<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Cup</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: #f0f0f0;
            display: flex; align-items: center; justify-content: center;
        }
        canvas { display: block; }
        .back-btn {
            position: fixed; top: 14px; left: 14px; z-index: 100;
            color: #333; text-decoration: none; font-size: 22px;
            font-weight: 300; opacity: 0.5;
        }
        .back-btn:hover { opacity: 1; }
        .hint {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: #aaa; font-family: -apple-system, sans-serif;
            pointer-events: none;
        }
        .mic-indicator {
            position: fixed; top: 20px; right: 20px;
            width: 12px; height: 12px; border-radius: 50%;
            background: #ddd; transition: background 0.1s;
        }
        .mic-indicator.active { background: #e74c3c; }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&lt;</a>
    <div class="mic-indicator" id="micDot"></div>
    <div class="hint">드래그: 회전 &nbsp;|&nbsp; 마이크에 후~ 불어보세요</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 2.5);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // OrbitControls (마우스 회전)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.target.set(0, 0.8, 0);

    // 조명 (밝게)
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(3, 5, 4);
    dirLight.castShadow = true;
    scene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
    rimLight.position.set(-3, 2, -3);
    scene.add(rimLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
    fillLight.position.set(0, -2, 3);
    scene.add(fillLight);

    // === 커피잔 만들기 (둥근 에스프레소 컵 스타일) ===

    // 잔 몸통 (둥글고 볼록한 형태)
    const cupPoints = [
        new THREE.Vector2(0, 0),        // 바닥 중심
        new THREE.Vector2(0.5, 0),      // 바닥
        new THREE.Vector2(0.55, 0.05),  // 바닥 모서리
        new THREE.Vector2(0.6, 0.15),
        new THREE.Vector2(0.72, 0.4),   // 배 부분 시작
        new THREE.Vector2(0.8, 0.6),    // 가장 볼록한 부분
        new THREE.Vector2(0.82, 0.75),
        new THREE.Vector2(0.8, 0.9),    // 위로 좁아짐
        new THREE.Vector2(0.75, 1.0),
        new THREE.Vector2(0.73, 1.05),  // 림
        new THREE.Vector2(0.75, 1.08),  // 림 두께
        new THREE.Vector2(0.73, 1.08),  // 림 안쪽
        new THREE.Vector2(0.68, 1.0),
        new THREE.Vector2(0.65, 0.85),
        new THREE.Vector2(0.68, 0.6),
        new THREE.Vector2(0.55, 0.3),
        new THREE.Vector2(0.45, 0.1),
        new THREE.Vector2(0.4, 0),      // 안쪽 바닥
    ];
    const cupGeom = new THREE.LatheGeometry(cupPoints, 48);
    const cupMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.1,
        metalness: 0.0,
        envMapIntensity: 0.5,
        visible: false,
    });
    const cup = new THREE.Mesh(cupGeom, cupMaterial);
    scene.add(cup);

    // 파티클 도트 레이어 (컵 표면) — 균일 분포
    const cupDotsGeom = new THREE.LatheGeometry(cupPoints, 120);
    // 버텍스를 세분화해서 세로도 빽빽하게
    const cupSubdivided = new THREE.LatheGeometry(
        subdividePoints(cupPoints, 5), 120
    );
    const cupPointsMat = new THREE.PointsMaterial({ color: 0xcccccc, size: 0.01, sizeAttenuation: true });
    const cupDots = new THREE.Points(cupSubdivided, cupPointsMat);
    scene.add(cupDots);

    // 프로파일 포인트 세분화 함수
    function subdividePoints(points, divisions) {
        const result = [];
        for (let i = 0; i < points.length - 1; i++) {
            for (let j = 0; j <= divisions; j++) {
                const t = j / divisions;
                const x = points[i].x + (points[i+1].x - points[i].x) * t;
                const y = points[i].y + (points[i+1].y - points[i].y) * t;
                result.push(new THREE.Vector2(x, y));
            }
        }
        result.push(points[points.length - 1]);
        return result;
    }

    // 손잡이 (두꺼운 고리형)
    const handlePath = new THREE.CurvePath();
    const handleCurve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0.75, 0.9, 0),
        new THREE.Vector3(1.2, 0.95, 0),
        new THREE.Vector3(1.2, 0.35, 0),
        new THREE.Vector3(0.72, 0.4, 0)
    );
    handlePath.add(handleCurve);
    const handleGeom = new THREE.TubeGeometry(handleCurve, 20, 0.07, 12, false);
    const handleMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 0.1, metalness: 0.0, visible: false
    });
    const handle = new THREE.Mesh(handleGeom, handleMat);
    scene.add(handle);

    // 파티클 도트 (손잡이) — 빽빽하게
    const handleDotsGeom = new THREE.TubeGeometry(handleCurve, 40, 0.07, 24, false);
    const handleDots = new THREE.Points(handleDotsGeom, new THREE.PointsMaterial({ color: 0xcccccc, size: 0.01, sizeAttenuation: true }));
    scene.add(handleDots);

    // 받침 접시 (얇고 넓은)
    const saucerPoints = [
        new THREE.Vector2(0, 0),
        new THREE.Vector2(1.4, 0),
        new THREE.Vector2(1.45, 0.02),
        new THREE.Vector2(1.45, 0.06),
        new THREE.Vector2(1.4, 0.08),
        new THREE.Vector2(0.6, 0.08),
        new THREE.Vector2(0.55, 0.06),
        new THREE.Vector2(0.55, 0.04),
        new THREE.Vector2(0.6, 0.02),
        new THREE.Vector2(1.35, 0.02),
        new THREE.Vector2(1.35, 0.04),
        new THREE.Vector2(0.65, 0.04),
    ];
    const saucerGeom = new THREE.LatheGeometry(saucerPoints, 48);
    const saucerMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 0.1, metalness: 0.0, visible: false
    });
    const saucer = new THREE.Mesh(saucerGeom, saucerMat);
    saucer.position.y = -0.02;
    scene.add(saucer);

    // 파티클 도트 (접시) — 빽빽하게
    const saucerDotsGeom = new THREE.LatheGeometry(subdividePoints(saucerPoints, 4), 80);
    const saucerDots = new THREE.Points(saucerDotsGeom, new THREE.PointsMaterial({ color: 0xcccccc, size: 0.01, sizeAttenuation: true }));
    saucerDots.position.y = -0.02;
    scene.add(saucerDots);

    // === 커피 액체 (파동 효과 — 촘촘한 그리드 파티클) ===
    const coffeeRadius = 0.62;
    const coffeeGridSize = 40; // 40x40 그리드
    const coffeePositions = [];
    const coffeeOriginal = []; // 원래 위치 저장

    for (let i = 0; i < coffeeGridSize; i++) {
        for (let j = 0; j < coffeeGridSize; j++) {
            const x = (i / (coffeeGridSize - 1) - 0.5) * coffeeRadius * 2;
            const z = (j / (coffeeGridSize - 1) - 0.5) * coffeeRadius * 2;
            // 원형 범위 내만
            if (x * x + z * z <= coffeeRadius * coffeeRadius) {
                coffeePositions.push(x, 1.0, z);
                coffeeOriginal.push(x, 1.0, z);
            }
        }
    }

    const coffeeParticleGeom = new THREE.BufferGeometry();
    coffeeParticleGeom.setAttribute('position', new THREE.Float32BufferAttribute(coffeePositions, 3));
    const coffeeParticleMat = new THREE.PointsMaterial({
        color: 0x3d1f0a,
        size: 0.01,
        sizeAttenuation: true
    });
    const coffeeParticles = new THREE.Points(coffeeParticleGeom, coffeeParticleMat);
    scene.add(coffeeParticles);

    // === 마이크 입김 + 잔 흔들림 감지 ===
    let blowStrength = 0;
    let targetBlow = 0;
    let shakeStrength = 0;
    let hasInteracted = false;
    let lastAzimuth = null;
    let lastPolar = null;
    const micDot = document.getElementById('micDot');

    // 첫 인터랙션 감지 — 드래그(mousedown)할 때만
    renderer.domElement.addEventListener('mousedown', () => {
        hasInteracted = true;
        initMic(); // 마이크도 첫 클릭 이후 시작
    });
    renderer.domElement.addEventListener('touchstart', () => {
        hasInteracted = true;
        initMic();
    });

    let micInitialized = false;
    async function initMic() {
        if (micInitialized) return;
        micInitialized = true;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioCtx = new AudioContext();
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            const data = new Uint8Array(analyser.frequencyBinCount);

            function checkBlow() {
                analyser.getByteFrequencyData(data);
                // 저주파 대역 (입김은 저주파)
                let sum = 0;
                for (let i = 0; i < 20; i++) sum += data[i];
                const avg = sum / 20;
                targetBlow = Math.min(avg / 80, 1.0);
                if (targetBlow < 0.15) targetBlow = 0; // 소음 무시
                if (targetBlow > 0.15) { micDot.classList.add('active'); hasInteracted = true; }
                else micDot.classList.remove('active');
                requestAnimationFrame(checkBlow);
            }
            checkBlow();
        } catch (e) {
            console.log('마이크 접근 불가');
        }
    }

    // === 애니메이션 루프 ===
    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // 잔 흔들림 감지 (카메라 회전 속도)
        const curAzimuth = controls.getAzimuthalAngle();
        const curPolar = controls.getPolarAngle();
        if (lastAzimuth === null) { lastAzimuth = curAzimuth; lastPolar = curPolar; }
        const deltaAz = Math.abs(curAzimuth - lastAzimuth);
        const deltaPo = Math.abs(curPolar - lastPolar);
        const rotSpeed = (deltaAz + deltaPo) * 60;
        shakeStrength += (Math.min(rotSpeed, 2.0) - shakeStrength) * 0.2;
        shakeStrength *= 0.98;
        if (shakeStrength < 0.001) shakeStrength = 0;
        lastAzimuth = curAzimuth;
        lastPolar = curPolar;

        // 입김 부드럽게 보간
        blowStrength += (targetBlow - blowStrength) * 0.1;
        if (blowStrength < 0.005) blowStrength = 0;

        // 커피 파동 — 파티클 위치 직접 업데이트
        const isDragging = shakeStrength > 0 || blowStrength > 0;
        const totalStrength = (hasInteracted && isDragging) ? Math.max(blowStrength, shakeStrength) : 0;
        const positions = coffeeParticleGeom.attributes.position.array;
        const time = performance.now() * 0.002;

        if (totalStrength > 0.001) {
            for (let i = 0; i < positions.length; i += 3) {
                const ox = coffeeOriginal[i];
                const oz = coffeeOriginal[i + 2];
                const dist = Math.sqrt(ox * ox + oz * oz);
                const wave = Math.sin(dist * 8 - time * 5) * totalStrength * 0.5
                           + Math.sin(ox * 5 + time * 3) * totalStrength * 0.3
                           + Math.cos(oz * 4 - time * 2) * totalStrength * 0.25;
                positions[i + 1] = coffeeOriginal[i + 1] + wave;
            }
            coffeeParticleGeom.attributes.position.needsUpdate = true;
        } else if (hasInteracted) {
            let settled = true;
            for (let i = 0; i < positions.length; i += 3) {
                const target = coffeeOriginal[i + 1];
                positions[i + 1] += (target - positions[i + 1]) * 0.03;
                if (Math.abs(positions[i + 1] - target) > 0.001) settled = false;
            }
            coffeeParticleGeom.attributes.position.needsUpdate = true;
        }

        renderer.render(scene, camera);
    }
    animate();

    // 리사이즈
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
</html>
