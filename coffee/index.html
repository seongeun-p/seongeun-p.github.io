<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Cup</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: #f0f0f0;
            display: flex; align-items: center; justify-content: center;
        }
        canvas { display: block; }
        .back-btn {
            position: fixed; top: 14px; left: 14px; z-index: 100;
            color: #333; text-decoration: none; font-size: 22px;
            font-weight: 300; opacity: 0.5;
        }
        .back-btn:hover { opacity: 1; }
        .hint {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: #aaa; font-family: -apple-system, sans-serif;
            pointer-events: none;
        }
        .mic-indicator {
            position: fixed; top: 20px; right: 20px;
            width: 12px; height: 12px; border-radius: 50%;
            background: #ddd; transition: background 0.1s;
        }
        .mic-indicator.active { background: #e74c3c; }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&lt;</a>
    <div class="mic-indicator" id="micDot"></div>
    <div class="hint">드래그: 회전 &nbsp;|&nbsp; 마이크에 후~ 불어보세요</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 2.5);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // OrbitControls (마우스 회전)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.target.set(0, 0.8, 0);

    // 조명 (밝게)
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(3, 5, 4);
    dirLight.castShadow = true;
    scene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
    rimLight.position.set(-3, 2, -3);
    scene.add(rimLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
    fillLight.position.set(0, -2, 3);
    scene.add(fillLight);

    // === 커피잔 만들기 (둥근 에스프레소 컵 스타일) ===

    // 잔 몸통 (둥글고 볼록한 형태)
    const cupPoints = [
        new THREE.Vector2(0, 0),        // 바닥 중심
        new THREE.Vector2(0.5, 0),      // 바닥
        new THREE.Vector2(0.55, 0.05),  // 바닥 모서리
        new THREE.Vector2(0.6, 0.15),
        new THREE.Vector2(0.72, 0.4),   // 배 부분 시작
        new THREE.Vector2(0.8, 0.6),    // 가장 볼록한 부분
        new THREE.Vector2(0.82, 0.75),
        new THREE.Vector2(0.8, 0.9),    // 위로 좁아짐
        new THREE.Vector2(0.75, 1.0),
        new THREE.Vector2(0.73, 1.05),  // 림
        new THREE.Vector2(0.75, 1.08),  // 림 두께
        new THREE.Vector2(0.73, 1.08),  // 림 안쪽
        new THREE.Vector2(0.68, 1.0),
        new THREE.Vector2(0.65, 0.85),
        new THREE.Vector2(0.68, 0.6),
        new THREE.Vector2(0.55, 0.3),
        new THREE.Vector2(0.45, 0.1),
        new THREE.Vector2(0.4, 0),      // 안쪽 바닥
    ];
    const cupGeom = new THREE.LatheGeometry(cupPoints, 48);
    const cupMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.1,
        metalness: 0.0,
        envMapIntensity: 0.5,
        visible: false,
    });
    const cup = new THREE.Mesh(cupGeom, cupMaterial);
    scene.add(cup);

    // 파티클 도트 레이어 (컵 표면) — 빽빽하게
    const cupPointsMat = new THREE.PointsMaterial({ color: 0x888888, size: 0.04, sizeAttenuation: true });
    const cupDots = new THREE.Points(new THREE.LatheGeometry(cupPoints, 120), cupPointsMat);
    scene.add(cupDots);

    // 손잡이 (두꺼운 고리형)
    const handlePath = new THREE.CurvePath();
    const handleCurve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(0.75, 0.9, 0),
        new THREE.Vector3(1.2, 0.95, 0),
        new THREE.Vector3(1.2, 0.35, 0),
        new THREE.Vector3(0.72, 0.4, 0)
    );
    handlePath.add(handleCurve);
    const handleGeom = new THREE.TubeGeometry(handleCurve, 20, 0.07, 12, false);
    const handleMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 0.1, metalness: 0.0, visible: false
    });
    const handle = new THREE.Mesh(handleGeom, handleMat);
    scene.add(handle);

    // 파티클 도트 (손잡이) — 빽빽하게
    const handleDotsGeom = new THREE.TubeGeometry(handleCurve, 40, 0.07, 24, false);
    const handleDots = new THREE.Points(handleDotsGeom, new THREE.PointsMaterial({ color: 0x888888, size: 0.04, sizeAttenuation: true }));
    scene.add(handleDots);

    // 받침 접시 (얇고 넓은)
    const saucerPoints = [
        new THREE.Vector2(0, 0),
        new THREE.Vector2(1.4, 0),
        new THREE.Vector2(1.45, 0.02),
        new THREE.Vector2(1.45, 0.06),
        new THREE.Vector2(1.4, 0.08),
        new THREE.Vector2(0.6, 0.08),
        new THREE.Vector2(0.55, 0.06),
        new THREE.Vector2(0.55, 0.04),
        new THREE.Vector2(0.6, 0.02),
        new THREE.Vector2(1.35, 0.02),
        new THREE.Vector2(1.35, 0.04),
        new THREE.Vector2(0.65, 0.04),
    ];
    const saucerGeom = new THREE.LatheGeometry(saucerPoints, 48);
    const saucerMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 0.1, metalness: 0.0, visible: false
    });
    const saucer = new THREE.Mesh(saucerGeom, saucerMat);
    saucer.position.y = -0.02;
    scene.add(saucer);

    // 파티클 도트 (접시) — 빽빽하게
    const saucerDotsGeom = new THREE.LatheGeometry(saucerPoints, 80);
    const saucerDots = new THREE.Points(saucerDotsGeom, new THREE.PointsMaterial({ color: 0x888888, size: 0.035, sizeAttenuation: true }));
    saucerDots.position.y = -0.02;
    scene.add(saucerDots);

    // 커피콩 3개 (접시 위)
    function createBean(x, z, rotY) {
        const beanGeom = new THREE.SphereGeometry(0.08, 16, 12);
        beanGeom.scale(1, 0.6, 1.4);
        const beanMat = new THREE.MeshStandardMaterial({
            color: 0x3d1f0a, roughness: 0.6, metalness: 0.1
        });
        const bean = new THREE.Mesh(beanGeom, beanMat);
        bean.position.set(x, 0.08, z);
        bean.rotation.y = rotY;
        bean.castShadow = true;
        // 가운데 홈 (얇은 박스로 표현)
        const grooveGeom = new THREE.BoxGeometry(0.01, 0.04, 0.18);
        const grooveMat = new THREE.MeshStandardMaterial({ color: 0x1a0f05, roughness: 0.8 });
        const groove = new THREE.Mesh(grooveGeom, grooveMat);
        groove.position.y = 0.03;
        bean.add(groove);
        scene.add(bean);
    }
    createBean(-1.0, 0.7, 0.3);
    createBean(-0.85, 0.8, -0.5);
    createBean(-0.95, 0.9, 0.8);

    // === 커피 액체 (파동 효과) ===
    const coffeeGeom = new THREE.CircleGeometry(0.67, 32);
    const coffeeUniforms = {
        uTime: { value: 0 },
        uBlowStrength: { value: 0 },
    };
    const coffeeMat = new THREE.ShaderMaterial({
        uniforms: coffeeUniforms,
        vertexShader: `
            uniform float uTime;
            uniform float uBlowStrength;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec3 pos = position;
                // 파동
                float dist = length(pos.xy);
                float wave = sin(dist * 10.0 - uTime * 5.0) * uBlowStrength * 0.05;
                wave += sin(pos.x * 8.0 + uTime * 3.0) * uBlowStrength * 0.03;
                wave += cos(pos.y * 6.0 - uTime * 4.0) * uBlowStrength * 0.02;
                pos.z = wave;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uBlowStrength;
            varying vec2 vUv;
            void main() {
                vec3 darkBrown = vec3(0.25, 0.15, 0.08);
                vec3 lightBrown = vec3(0.4, 0.25, 0.12);
                float f = length(vUv - 0.5) * 2.0;
                vec3 color = mix(darkBrown, lightBrown, f + uBlowStrength * 0.3);
                // 하이라이트
                float highlight = smoothstep(0.8, 1.0, 1.0 - f);
                color += highlight * 0.1;
                gl_FragColor = vec4(color, 1.0);
            }
        `,
    });
    const coffee = new THREE.Mesh(coffeeGeom, coffeeMat);
    coffee.rotation.x = -Math.PI / 2;
    coffee.position.y = 1.0;
    coffee.visible = false;
    scene.add(coffee);

    // 파티클 도트 (커피 표면) — 빽빽하게
    const coffeeDots = new THREE.Points(
        new THREE.CircleGeometry(0.67, 120),
        new THREE.PointsMaterial({ color: 0x3d1f0a, size: 0.03, sizeAttenuation: true })
    );
    coffeeDots.rotation.x = -Math.PI / 2;
    coffeeDots.position.y = 1.01;
    scene.add(coffeeDots);

    // === 마이크 입김 + 잔 흔들림 감지 ===
    let blowStrength = 0;
    let targetBlow = 0;
    let shakeStrength = 0;
    let hasInteracted = false;
    let lastAzimuth = null;
    let lastPolar = null;
    const micDot = document.getElementById('micDot');

    // 첫 인터랙션 감지 — 드래그(mousedown)할 때만
    renderer.domElement.addEventListener('mousedown', () => { hasInteracted = true; });
    renderer.domElement.addEventListener('touchstart', () => { hasInteracted = true; });

    async function initMic() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioCtx = new AudioContext();
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            const data = new Uint8Array(analyser.frequencyBinCount);

            function checkBlow() {
                analyser.getByteFrequencyData(data);
                // 저주파 대역 (입김은 저주파)
                let sum = 0;
                for (let i = 0; i < 20; i++) sum += data[i];
                const avg = sum / 20;
                targetBlow = Math.min(avg / 80, 1.0);
                if (targetBlow < 0.15) targetBlow = 0; // 소음 무시
                if (targetBlow > 0.15) { micDot.classList.add('active'); hasInteracted = true; }
                else micDot.classList.remove('active');
                requestAnimationFrame(checkBlow);
            }
            checkBlow();
        } catch (e) {
            console.log('마이크 접근 불가');
        }
    }
    initMic();

    // === 애니메이션 루프 ===
    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // 잔 흔들림 감지 (카메라 회전 속도)
        const curAzimuth = controls.getAzimuthalAngle();
        const curPolar = controls.getPolarAngle();
        if (lastAzimuth === null) { lastAzimuth = curAzimuth; lastPolar = curPolar; }
        const deltaAz = Math.abs(curAzimuth - lastAzimuth);
        const deltaPo = Math.abs(curPolar - lastPolar);
        const rotSpeed = (deltaAz + deltaPo) * 30;
        shakeStrength += (Math.min(rotSpeed, 1.5) - shakeStrength) * 0.15;
        shakeStrength *= 0.94; // 빠르게 감소 → 멈추면 잔잔해짐
        if (shakeStrength < 0.005) shakeStrength = 0;
        lastAzimuth = curAzimuth;
        lastPolar = curPolar;

        // 입김 부드럽게 보간
        blowStrength += (targetBlow - blowStrength) * 0.1;
        if (blowStrength < 0.005) blowStrength = 0;

        // 커피 파동 = 입김 + 흔들림 (둘 다 0이면 완전 정지)
        const totalStrength = hasInteracted ? Math.max(blowStrength, shakeStrength) : 0;
        coffeeUniforms.uBlowStrength.value = totalStrength;
        if (totalStrength > 0.001) {
            coffeeUniforms.uTime.value += 0.016;
        }

        renderer.render(scene, camera);
    }
    animate();

    // 리사이즈
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
</html>
