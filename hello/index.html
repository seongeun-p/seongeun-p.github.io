<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapour Text</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
        canvas { display: block; }
        .back-btn { position: fixed; top: 14px; left: 14px; z-index: 100; color: #fff; text-decoration: none; font-size: 22px; font-weight: 300; opacity: 0.5; }
        .back-btn:hover { opacity: 1; }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&lt;</a>
    <canvas id="c"></canvas>
    <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio * 1.5 || 1;

    const TEXTS = ['Hello', 'Goodbye', 'See you'];
    const FONT = '600 70px Inter, sans-serif';
    const COLOR = 'rgb(255, 255, 255)';
    const SPREAD = 5;
    const VAPORIZE_DURATION = 2000;
    const FADE_IN_DURATION = 1000;
    const WAIT_DURATION = 500;

    let W, H;
    let particles = [];
    let textBounds = { left: 0, right: 0, width: 0 };
    let currentTextIdx = 0;
    let state = 'static'; // static, vaporizing, fadingIn, waiting
    let vaporizeProgress = 0;
    let fadeOpacity = 0;
    let lastTime = performance.now();

    function resize() {
        W = innerWidth;
        H = innerHeight;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        createParticles();
    }

    function createParticles() {
        particles = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const fontSize = 70 * dpr;
        ctx.fillStyle = COLOR;
        ctx.font = `600 ${fontSize}px Inter, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const text = TEXTS[currentTextIdx];
        const textX = canvas.width / 2;
        const textY = canvas.height / 2;

        // 텍스트 경계 계산
        const metrics = ctx.measureText(text);
        const textWidth = metrics.width;
        textBounds = {
            left: textX - textWidth / 2,
            right: textX + textWidth / 2,
            width: textWidth
        };

        // 텍스트 렌더 후 픽셀 샘플링
        ctx.fillText(text, textX, textY);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        const sampleRate = Math.max(1, Math.round(dpr / 2));

        for (let y = 0; y < canvas.height; y += sampleRate) {
            for (let x = 0; x < canvas.width; x += sampleRate) {
                const idx = (y * canvas.width + x) * 4;
                const alpha = data[idx + 3];
                if (alpha > 0) {
                    const originalAlpha = alpha / 255 * (sampleRate / dpr);
                    particles.push({
                        x, y,
                        originalX: x,
                        originalY: y,
                        color: `rgba(${data[idx]}, ${data[idx+1]}, ${data[idx+2]}, ${originalAlpha})`,
                        opacity: originalAlpha,
                        originalAlpha,
                        vx: 0, vy: 0,
                        speed: 0,
                        shouldFadeQuick: false
                    });
                }
            }
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function vaporizeSpread(fontSize) {
        if (fontSize <= 20) return 0.2;
        if (fontSize >= 100) return 1.5;
        return 0.2 + (fontSize - 20) * (1.3 / 80);
    }

    function updateVaporize(dt) {
        vaporizeProgress += dt * 100 / (VAPORIZE_DURATION / 1000);
        const progress = Math.min(100, vaporizeProgress);
        const vaporizeX = textBounds.left + textBounds.width * progress / 100;

        const spreadAmount = vaporizeSpread(70) * SPREAD;
        let allDone = true;

        particles.forEach(p => {
            if (p.originalX <= vaporizeX) {
                if (p.speed === 0) {
                    const angle = Math.random() * Math.PI * 2;
                    p.speed = (Math.random() + 0.5) * spreadAmount;
                    p.vx = Math.cos(angle) * p.speed;
                    p.vy = Math.sin(angle) * p.speed;
                    p.shouldFadeQuick = Math.random() > 0.7;
                }

                if (p.shouldFadeQuick) {
                    p.opacity = Math.max(0, p.opacity - dt);
                } else {
                    const dx = p.originalX - p.x;
                    const dy = p.originalY - p.y;
                    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
                    const damping = Math.max(0.95, 1 - dist / (100 * spreadAmount));

                    p.vx = (p.vx + (Math.random()-0.5) * spreadAmount * 3 + dx * 0.002) * damping;
                    p.vy = (p.vy + (Math.random()-0.5) * spreadAmount * 3 + dy * 0.002) * damping;

                    const maxV = spreadAmount * 2;
                    const curV = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                    if (curV > maxV) { p.vx *= maxV/curV; p.vy *= maxV/curV; }

                    p.x += p.vx * dt * 20;
                    p.y += p.vy * dt * 10;

                    const fadeRate = 0.25 * (2000 / VAPORIZE_DURATION);
                    p.opacity = Math.max(0, p.opacity - dt * fadeRate);
                }

                if (p.opacity > 0.01) allDone = false;
            } else {
                allDone = false;
            }
        });

        return vaporizeProgress >= 100 && allDone;
    }

    function renderParticles() {
        ctx.save();
        ctx.scale(dpr, dpr);
        particles.forEach(p => {
            if (p.opacity > 0) {
                ctx.fillStyle = p.color.replace(/[\d.]+\)$/, `${p.opacity})`);
                ctx.fillRect(p.x / dpr, p.y / dpr, 1, 1);
            }
        });
        ctx.restore();
    }

    function renderFadeIn() {
        ctx.save();
        ctx.scale(dpr, dpr);
        particles.forEach(p => {
            p.x = p.originalX;
            p.y = p.originalY;
            const opacity = Math.min(fadeOpacity, 1) * p.originalAlpha;
            ctx.fillStyle = p.color.replace(/[\d.]+\)$/, `${opacity})`);
            ctx.fillRect(p.x / dpr, p.y / dpr, 1, 1);
        });
        ctx.restore();
    }

    function resetParticles() {
        particles.forEach(p => {
            p.x = p.originalX;
            p.y = p.originalY;
            p.opacity = p.originalAlpha;
            p.speed = 0;
            p.vx = 0;
            p.vy = 0;
            p.shouldFadeQuick = false;
        });
    }

    function animate(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        switch (state) {
            case 'static':
                renderParticles();
                // 시작 후 잠시 보여주고 증발
                setTimeout(() => { state = 'vaporizing'; }, 800);
                state = 'waiting-start';
                break;
            case 'waiting-start':
                renderParticles();
                break;
            case 'vaporizing':
                const done = updateVaporize(dt);
                renderParticles();
                if (done) {
                    currentTextIdx = (currentTextIdx + 1) % TEXTS.length;
                    createParticles();
                    fadeOpacity = 0;
                    state = 'fadingIn';
                }
                break;
            case 'fadingIn':
                fadeOpacity += dt * 1000 / FADE_IN_DURATION;
                renderFadeIn();
                if (fadeOpacity >= 1) {
                    resetParticles();
                    state = 'waiting';
                    setTimeout(() => {
                        vaporizeProgress = 0;
                        state = 'vaporizing';
                    }, WAIT_DURATION);
                }
                break;
            case 'waiting':
                renderParticles();
                break;
        }

        requestAnimationFrame(animate);
    }

    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(animate);
    </script>
</body>
</html>
