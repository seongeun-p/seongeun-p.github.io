<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seongeun-p | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* 그리드 — 화면 가득, 한 줄에 3개 */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
        }

        /* 각 썸네일 카드 */
        .card {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.05);
            filter: brightness(0.7);
        }

        /* 호버 시 제목 표시 */
        .card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: #fff;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .card:hover .overlay {
            transform: translateY(0);
        }

        .card .overlay h3 {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .card .overlay p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        /* 빈 슬롯 (아직 작업물이 없는 자리) */
        .card.empty {
            background: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .card.empty::after {
            content: '+';
            font-size: 32px;
            color: #333;
        }

        /* 반응형 — 작은 화면에서 열 수 줄이기 */
        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>
    <div class="grid">
        <!-- 작업물 1: 유리닦기 -->
        <a class="card" href="glass/">
            <img src="glass/photo.jpg" alt="유리 닦기">
            <div class="overlay">
                <h3>유리 닦기</h3>
                <p>마우스로 김 서린 유리를 닦아보세요</p>
            </div>
        </a>

        <!-- 작업물 2: 우산 찾기 -->
        <a class="card" href="umbrella/">
            <img src="umbrella/thumbnail.png" alt="내 우산을 찾아라">
            <div class="overlay">
                <h3>내 우산을 찾아라</h3>
                <p>팔찌와 같은 색 우산을 골라내세요</p>
            </div>
        </a>

        <!-- 작업물 3: 어금니 타이포 -->
        <a class="card" href="molar/">
            <img src="molar/thumbnail.png" alt="어금니가 영어로 뭐야?">
            <div class="overlay">
                <h3>어금니?</h3>
                <p>아는 사람?</p>
            </div>
        </a>

        <!-- 작업물 4: 카메라워크 -->
        <a class="card" href="camera/">
            <img src="camera/thumbnail.png" alt="Camera Work">
            <div class="overlay">
                <h3>호프 맞아요</h3>
                <p>카메라 앵글을 조절해 짧은 영상을 만들어보세요</p>
            </div>
        </a>

        <!-- 작업물 5: 김밥 게임 -->
        <a class="card" href="kimbap/" style="background:#fff8f0; display:flex; align-items:center; justify-content:center;">
            <div style="text-align:center; padding:20px;">
                <div style="font-size:48px;">🍙</div>
                <div style="font-weight:700; color:#333; font-size:12px; margin-top:8px;">성은이의 입맛 저격</div>
            </div>
            <div class="overlay">
                <h3>성은이의 입맛 저격</h3>
                <p>김밥이랑 어울리는 음식을 맞혀봐!</p>
            </div>
        </a>

        <!-- 작업물 6: 명함 자판기 -->
        <a class="card" href="namecard/" style="background:#f7f6f3; display:flex; align-items:center; justify-content:center;">
            <div style="text-align:center; padding:20px;">
                <div style="font-size:13px; color:#222; font-weight:700;">오늘의 운세 자판기</div>
                <div style="font-size:11px; color:#999; margin-top:4px;">이름을 넣으면 운세가 나와요</div>
            </div>
            <div class="overlay">
                <h3>오늘의 운세 자판기</h3>
                <p>이름+생년월일로 오늘의 운세 뽑기</p>
            </div>
        </a>
    </div>
</body>
</html>
