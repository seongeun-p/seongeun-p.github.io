<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seongeun-p | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* 그리드 — 화면 가득, 한 줄에 3개 */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
        }

        /* 각 썸네일 카드 */
        .card {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.05);
            filter: brightness(0.7);
        }

        /* 호버 시 제목 표시 */
        .card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: #fff;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .card:hover .overlay {
            transform: translateY(0);
        }

        .card .overlay h3 {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .card .overlay p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        /* 빈 슬롯 (아직 작업물이 없는 자리) */
        .card.empty {
            background: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .card.empty::after {
            content: '+';
            font-size: 32px;
            color: #333;
        }

        /* 반응형 — 작은 화면에서 열 수 줄이기 */
        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>
    <div class="grid">
        <!-- 작업물 1: 유리닦기 -->
        <a class="card" href="glass/">
            <img src="glass/photo.jpg" alt="유리 닦기">
            <div class="overlay">
                <h3>유리 닦기</h3>
                <p>마우스로 김 서린 유리를 닦아보세요</p>
            </div>
        </a>

        <!-- 작업물 2: 우산 찾기 -->
        <a class="card" href="umbrella/" style="background: #0a0a0a; display:flex; align-items:center; justify-content:center; padding: 20px;">
            <svg viewBox="0 0 200 200" style="width:80%; height:80%;">
                <!-- 봉 -->
                <rect x="10" y="50" width="180" height="3" fill="#8B4513"/>
                <rect x="10" y="50" width="180" height="1.5" fill="#A0522D"/>
                <!-- 역삼각형 우산들 -->
                <polygon points="25,55 35,55 30,140" fill="#e74c3c"/>
                <polygon points="40,55 50,55 45,145" fill="#2980b9"/>
                <polygon points="37,55 47,55 42,142" fill="#f1c40f" opacity="0.6"/>
                <polygon points="55,55 65,55 60,138" fill="#27ae60"/>
                <polygon points="70,55 80,55 75,148" fill="#8e44ad"/>
                <polygon points="85,55 95,55 90,135" fill="#f39c12"/>
                <polygon points="100,55 110,55 105,142" fill="#e91e63"/>
                <polygon points="115,55 125,55 120,140" fill="#3498db"/>
                <polygon points="130,55 140,55 135,146" fill="#2ecc71"/>
                <polygon points="145,55 155,55 150,137" fill="#ff5722"/>
                <polygon points="160,55 170,55 165,143" fill="#673ab7"/>
                <polygon points="175,55 185,55 180,139" fill="#00bcd4"/>
                <!-- 손잡이들 -->
                <circle cx="30" cy="46" r="4" fill="none" stroke="#D2691E" stroke-width="2"/>
                <circle cx="60" cy="46" r="4" fill="none" stroke="#8B4513" stroke-width="2"/>
                <circle cx="90" cy="46" r="4" fill="none" stroke="#A0522D" stroke-width="2"/>
                <circle cx="120" cy="46" r="4" fill="none" stroke="#CD853F" stroke-width="2"/>
                <circle cx="150" cy="46" r="4" fill="none" stroke="#D2691E" stroke-width="2"/>
                <!-- 손 (하단) -->
                <rect x="85" y="160" width="20" height="40" rx="3" fill="#d4956a"/>
                <rect x="82" y="145" width="7" height="18" rx="2" fill="#d4956a"/>
                <rect x="89" y="140" width="7" height="22" rx="2" fill="#d4956a"/>
                <rect x="96" y="142" width="7" height="20" rx="2" fill="#d4956a"/>
                <rect x="103" y="147" width="6" height="16" rx="2" fill="#d4956a"/>
                <!-- 팔찌 -->
                <rect x="83" y="170" width="24" height="6" fill="#e74c3c"/>
                <rect x="83" y="173" width="24" height="3" fill="#f1c40f"/>
            </svg>
            <div class="overlay" style="transform:translateY(0);">
                <h3>내 우산을 찾아라</h3>
                <p>팔찌와 같은 색 우산을 골라내세요</p>
            </div>
        </a>

        <!-- 빈 슬롯들 (작업물 추가하면 여기를 채움) -->
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
    </div>
</body>
</html>
