<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seongeun-p | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* 그리드 — 화면 가득, 한 줄에 5개 */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 4px;
        }

        /* 각 썸네일 카드 */
        .card {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.05);
            filter: brightness(0.7);
        }

        /* 호버 시 제목 표시 */
        .card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: #fff;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .card:hover .overlay {
            transform: translateY(0);
        }

        .card .overlay h3 {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .card .overlay p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        /* 빈 슬롯 (아직 작업물이 없는 자리) */
        .card.empty {
            background: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .card.empty::after {
            content: '+';
            font-size: 32px;
            color: #333;
        }

        /* 반응형 — 작은 화면에서 열 수 줄이기 */
        @media (max-width: 1024px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="grid">
        <!-- 작업물 1: 유리닦기 -->
        <a class="card" href="glass/">
            <img src="glass/photo.jpg" alt="유리 닦기">
            <div class="overlay">
                <h3>유리 닦기</h3>
                <p>마우스로 김 서린 유리를 닦아보세요</p>
            </div>
        </a>

        <!-- 빈 슬롯들 (작업물 추가하면 여기를 채움) -->
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
    </div>
</body>
</html>
