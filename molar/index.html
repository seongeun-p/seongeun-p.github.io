<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니가 영어로 뭐야?</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            width: 100vw; height: 100vh;
            overflow: hidden;
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text-container {
            position: relative;
            text-align: center;
        }

        /* 기본 텍스트: 어금니가 영어로 뭐야? */
        .base-text {
            font-family: 'Pretendard', sans-serif;
            font-weight: 800;
            font-size: clamp(48px, 9vw, 140px);
            line-height: 1.1;
            color: #1a1a1a;
            text-shadow:
                0 1px 0 #2a2a2a,
                0 2px 0 #252525,
                0 3px 0 #222,
                0 4px 0 #1f1f1f,
                0 5px 0 #1c1c1c,
                0 6px 3px rgba(0,0,0,0.4),
                0 0 8px rgba(255,255,255,0.08),
                -1px -1px 0 rgba(255,255,255,0.15),
                1px 1px 0 rgba(0,0,0,0.5);
            /* 엠보싱: 밝은 상단 + 어두운 하단 */
            background: linear-gradient(180deg, #e8e8e8 0%, #b0b0b0 40%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        /* 몰라 텍스트 (클릭 시 나타남) */
        .reveal-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Pretendard', sans-serif;
            font-weight: 800;
            font-size: clamp(80px, 16vw, 240px);
            line-height: 1;
            color: #1a1a1a;
            background: linear-gradient(180deg, #ff4444 0%, #cc0000 40%, #880000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 8px rgba(200,0,0,0.4));
            clip-path: circle(0% at var(--mx, 50%) var(--my, 50%));
            transition: none;
            pointer-events: none;
        }

        .reveal-text.active {
            clip-path: circle(var(--radius, 0%) at var(--mx, 50%) var(--my, 50%));
        }

        /* 3D 어금니 커서 */
        .cursor-molar {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        .cursor-molar svg {
            width: 40px;
            height: 52px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>
    <div class="text-container" id="container">
        <div class="base-text">어금니가<br>영어로 뭐야?</div>
        <div class="reveal-text" id="reveal">몰라</div>
    </div>

    <!-- 3D 어금니 커서 -->
    <div class="cursor-molar" id="cursor">
        <svg viewBox="0 0 50 65" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="30%" stop-color="#f0ede8"/>
                    <stop offset="70%" stop-color="#d4cfc5"/>
                    <stop offset="100%" stop-color="#b8b0a0"/>
                </linearGradient>
                <linearGradient id="rootGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#e8e2d8"/>
                    <stop offset="100%" stop-color="#c4b8a4"/>
                </linearGradient>
                <radialGradient id="toothShine" cx="35%" cy="30%" r="50%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
                    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                </radialGradient>
            </defs>
            <!-- 어금니 본체 -->
            <path d="M 12 28 C 12 14, 19 6, 25 6 C 31 6, 38 14, 38 28 L 38 36 C 38 38, 36 40, 35 40 L 33 52 C 33 56, 31 59, 28 59 C 27 59, 26 57, 26 55 L 26 46 C 26 45, 25.5 44.5, 25 44.5 C 24.5 44.5, 24 45, 24 46 L 24 55 C 24 57, 23 59, 22 59 C 19 59, 17 56, 17 52 L 15 40 C 14 40, 12 38, 12 36 Z"
                fill="url(#toothGrad)"/>
            <!-- 뿌리 -->
            <path d="M 17 40 L 15 52 C 15 56, 17 59, 19 59" fill="url(#rootGrad)"/>
            <path d="M 33 40 L 35 52 C 35 56, 33 59, 31 59" fill="url(#rootGrad)"/>
            <!-- 상단 울퉁불퉁 (어금니 cusp) -->
            <ellipse cx="19" cy="10" rx="6" ry="5" fill="url(#toothGrad)"/>
            <ellipse cx="25" cy="8" rx="5.5" ry="4.5" fill="url(#toothGrad)"/>
            <ellipse cx="31" cy="10" rx="6" ry="5" fill="url(#toothGrad)"/>
            <!-- 하이라이트 -->
            <ellipse cx="22" cy="18" rx="8" ry="10" fill="url(#toothShine)" opacity="0.5"/>
            <!-- 미세한 홈 -->
            <path d="M 22 15 Q 25 18 28 15" stroke="rgba(0,0,0,0.08)" stroke-width="0.8" fill="none"/>
            <path d="M 20 20 Q 25 22 30 20" stroke="rgba(0,0,0,0.06)" stroke-width="0.6" fill="none"/>
        </svg>
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        const reveal = document.getElementById('reveal');
        const container = document.getElementById('container');
        let isPressed = false;
        let radius = 0;
        let mx = 50, my = 50;

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            // reveal 위치 업데이트
            const rect = container.getBoundingClientRect();
            mx = ((e.clientX - rect.left) / rect.width) * 100;
            my = ((e.clientY - rect.top) / rect.height) * 100;
            reveal.style.setProperty('--mx', mx + '%');
            reveal.style.setProperty('--my', my + '%');
        });

        document.addEventListener('mousedown', () => {
            isPressed = true;
            reveal.classList.add('active');
            growReveal();
        });

        document.addEventListener('mouseup', () => {
            isPressed = false;
            // 서서히 줄어들기
            shrinkReveal();
        });

        function growReveal() {
            if (!isPressed) return;
            radius = Math.min(radius + 2, 80);
            reveal.style.setProperty('--radius', radius + '%');
            requestAnimationFrame(growReveal);
        }

        function shrinkReveal() {
            if (isPressed) return;
            radius = Math.max(radius - 3, 0);
            reveal.style.setProperty('--radius', radius + '%');
            if (radius > 0) {
                requestAnimationFrame(shrinkReveal);
            } else {
                reveal.classList.remove('active');
            }
        }

        // 커서 약간의 떨림 (어금니 느낌)
        let angle = 0, dir = 1;
        function wobble() {
            if (isPressed) {
                angle += 0.15 * dir;
                if (angle > 5) dir = -1;
                if (angle < -5) dir = 1;
            } else {
                angle *= 0.9;
            }
            cursor.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
            requestAnimationFrame(wobble);
        }
        wobble();
    </script>
</body>
</html>
