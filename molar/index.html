<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니가 영어로 뭐야?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121230;
            width: 100vw; height: 100vh;
            overflow: hidden;
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poster-area {
            position: relative;
            width: 75vmin;
            height: 75vmin;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 클릭 시 나타나는 몰라 레이어 */
        .reveal-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .reveal-layer canvas {
            width: 100%; height: 100%;
        }

        /* 어금니 커서 */
        .cursor-molar {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }
        .cursor-molar img {
            width: 50px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>
    <div class="poster-area">
        <canvas id="base"></canvas>
        <div class="reveal-layer">
            <canvas id="reveal"></canvas>
        </div>
    </div>
    <div class="cursor-molar" id="cursor">
        <img src="tooth.png" alt="어금니">
    </div>

    <script>
    const baseCanvas = document.getElementById('base');
    const revealCanvas = document.getElementById('reveal');
    const baseCtx = baseCanvas.getContext('2d');
    const revealCtx = revealCanvas.getContext('2d');
    const cursorEl = document.getElementById('cursor');

    let S; // canvas pixel size

    function resize() {
        const area = document.querySelector('.poster-area');
        const rect = area.getBoundingClientRect();
        S = Math.floor(rect.width * (window.devicePixelRatio || 1));
        baseCanvas.width = baseCanvas.height = S;
        revealCanvas.width = revealCanvas.height = S;
        drawBase();
        drawReveal();
    }

    // 버블 글자 그리기 함수
    function drawBubbleText(ctx, text, x, y, size, color, darkColor) {
        ctx.save();
        ctx.font = `900 ${size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.miterLimit = 2;

        // 뒤쪽 그림자 (더 두꺼운 stroke)
        ctx.lineWidth = size * 0.18;
        ctx.strokeStyle = darkColor;
        ctx.strokeText(text, x, y);

        // 메인 채우기
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);

        // 안쪽 하이라이트 선
        ctx.lineWidth = size * 0.06;
        ctx.strokeStyle = darkColor;
        ctx.strokeText(text, x, y);

        ctx.fillStyle = color;
        ctx.fillText(text, x, y);

        ctx.restore();
    }

    // 기본 텍스트: "어금니가 영어로 뭐야"
    function drawBase() {
        const ctx = baseCtx;
        ctx.clearRect(0, 0, S, S);

        const mainColor = '#8b7fdb';
        const darkColor = '#4a4090';
        const fontSize = S * 0.22;

        // 3줄로 꽉 채우기: "어금니가" / "영어로" / "뭐야?"
        drawBubbleText(ctx, '어금니가', S * 0.5, S * 0.22, fontSize, mainColor, darkColor);
        drawBubbleText(ctx, '영어로', S * 0.5, S * 0.5, fontSize, mainColor, darkColor);
        drawBubbleText(ctx, '뭐야?', S * 0.5, S * 0.78, fontSize, mainColor, darkColor);
    }

    // 몰라 텍스트 (빨간색)
    function drawReveal() {
        const ctx = revealCtx;
        ctx.clearRect(0, 0, S, S);

        // 배경 (어두운 남색)
        ctx.fillStyle = '#121230';
        ctx.fillRect(0, 0, S, S);

        const mainColor = '#ff5555';
        const darkColor = '#8b1a1a';
        const fontSize = S * 0.35;

        drawBubbleText(ctx, '몰', S * 0.5, S * 0.38, fontSize, mainColor, darkColor);
        drawBubbleText(ctx, '라', S * 0.5, S * 0.7, fontSize, mainColor, darkColor);
    }

    // 마스크 (클릭하면 원형으로 reveal 보이기)
    let isPressed = false;
    let maskRadius = 0;
    let maskX = 0.5, maskY = 0.5;

    function updateMask() {
        const el = revealCanvas.parentElement;
        el.style.clipPath = `circle(${maskRadius}% at ${maskX * 100}% ${maskY * 100}%)`;
    }

    function growMask() {
        if (!isPressed) return;
        maskRadius = Math.min(maskRadius + 1.5, 75);
        updateMask();
        requestAnimationFrame(growMask);
    }

    function shrinkMask() {
        if (isPressed) return;
        maskRadius = Math.max(maskRadius - 2.5, 0);
        updateMask();
        if (maskRadius > 0) requestAnimationFrame(shrinkMask);
    }

    // 이벤트
    const area = document.querySelector('.poster-area');

    document.addEventListener('mousemove', (e) => {
        cursorEl.style.left = e.clientX + 'px';
        cursorEl.style.top = e.clientY + 'px';

        const rect = area.getBoundingClientRect();
        maskX = (e.clientX - rect.left) / rect.width;
        maskY = (e.clientY - rect.top) / rect.height;
        if (isPressed) updateMask();
    });

    document.addEventListener('mousedown', () => {
        isPressed = true;
        updateMask();
        growMask();
    });

    document.addEventListener('mouseup', () => {
        isPressed = false;
        shrinkMask();
    });

    // 커서 흔들림
    let angle = 0, dir = 1;
    function wobble() {
        if (isPressed) {
            angle += 0.12 * dir;
            if (angle > 5) dir = -1;
            if (angle < -5) dir = 1;
        } else {
            angle *= 0.9;
        }
        cursorEl.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        requestAnimationFrame(wobble);
    }
    wobble();

    // 초기화
    resize();
    window.addEventListener('resize', resize);
    updateMask();
    </script>
</body>
</html>
