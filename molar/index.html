<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니가 영어로 뭐야?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            cursor: none;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .cursor-molar {
            position: fixed; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
        }
        .cursor-molar img {
            width: 50px; height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }
        .back-btn {
            position: fixed; top: 16px; left: 16px; z-index: 100;
            color: #fff; text-decoration: none; font-size: 20px;
            width: 36px; height: 36px; display: flex;
            align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(0,0,0,0.25);
            cursor: pointer; transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&#8592;</a>
    <canvas id="base"></canvas>
    <canvas id="reveal"></canvas>
    <div class="cursor-molar" id="cursor">
        <img src="tooth.png" alt="어금니">
    </div>

    <script>
    const baseCanvas = document.getElementById('base');
    const revealCanvas = document.getElementById('reveal');
    const baseCtx = baseCanvas.getContext('2d');
    const revealCtx = revealCanvas.getContext('2d');
    const cursorEl = document.getElementById('cursor');

    let W, H;
    let mouseX = 0.5, mouseY = 0.5;
    let isPressed = false;
    let revealSize = 0;
    const MAX_SIZE = 700;
    let hueOffset = 0;

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = baseCanvas.width = revealCanvas.width = window.innerWidth * dpr;
        H = baseCanvas.height = revealCanvas.height = window.innerHeight * dpr;
        baseCanvas.style.width = revealCanvas.style.width = '100vw';
        baseCanvas.style.height = revealCanvas.style.height = '100vh';
    }
    resize();
    window.addEventListener('resize', resize);

    function getGradient(ctx) {
        const h1 = hueOffset % 360;
        const h2 = (hueOffset + 80) % 360;
        const h3 = (hueOffset + 160) % 360;
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, `hsl(${h1}, 90%, 55%)`);
        grad.addColorStop(0.5, `hsl(${h2}, 85%, 50%)`);
        grad.addColorStop(1, `hsl(${h3}, 90%, 55%)`);
        return grad;
    }

    function drawText(ctx, text, x, y, size, fillColor, strokeColor) {
        ctx.save();
        ctx.font = `300 ${size}px Gulim, '굴림', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = size * 0.02;
        ctx.strokeStyle = strokeColor;
        ctx.strokeText(text, x, y);
        ctx.fillStyle = fillColor;
        ctx.fillText(text, x, y);
        ctx.restore();
    }

    // 성게 모양 path (뾰족한 가시 + 동그라미)
    function drawSeaUrchinPath(ctx, cx, cy, size) {
        const spikes = 20;
        const outerR = size;
        const innerR = size * 0.65;
        ctx.beginPath();
        for (let i = 0; i < spikes * 2; i++) {
            const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
            const r = i % 2 === 0 ? outerR : innerR;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
    }

    function drawBase() {
        baseCtx.fillStyle = getGradient(baseCtx);
        baseCtx.fillRect(0, 0, W, H);
        const fontSize = Math.min(W * 0.09, H * 0.18);
        drawText(baseCtx, '어금니가 영어로 뭐야?', W * 0.5, H * 0.5, fontSize, '#ffffff', '#000000');
    }

    function drawReveal() {
        const ctx = revealCtx;
        ctx.clearRect(0, 0, W, H);
        if (revealSize <= 0) return;

        ctx.save();
        drawSeaUrchinPath(ctx, mouseX * W, mouseY * H, revealSize);
        ctx.clip();

        // 흰색 배경
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, W, H);

        // 검정 "몰라" (테두리 없음)
        const fontSize = Math.min(W * 0.2, H * 0.3);
        ctx.save();
        ctx.font = `300 ${fontSize}px Gulim, '굴림', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#000000';
        ctx.fillText('몰라', W * 0.5, H * 0.5);
        ctx.restore();
        ctx.restore();
    }

    function animate() {
        hueOffset += 0.4;
        if (isPressed) {
            revealSize = Math.min(revealSize + 30, MAX_SIZE);
        } else {
            revealSize = Math.max(revealSize - 40, 0);
        }
        drawBase();
        drawReveal();
        requestAnimationFrame(animate);
    }

    document.addEventListener('mousemove', (e) => {
        cursorEl.style.left = e.clientX + 'px';
        cursorEl.style.top = e.clientY + 'px';
        mouseX = e.clientX / window.innerWidth;
        mouseY = e.clientY / window.innerHeight;
    });
    document.addEventListener('mousedown', () => { isPressed = true; });
    document.addEventListener('mouseup', () => { isPressed = false; });

    let angle = 0, dir = 1;
    function wobble() {
        if (isPressed) { angle += 0.12 * dir; if (angle > 5) dir = -1; if (angle < -5) dir = 1; }
        else { angle *= 0.9; }
        cursorEl.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        requestAnimationFrame(wobble);
    }
    wobble();
    animate();
    </script>
</body>
</html>
