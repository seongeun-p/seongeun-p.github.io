<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니가 영어로 뭐야?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            width: 100vw; height: 100vh;
            overflow: hidden;
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poster-area {
            position: relative;
            width: 75vmin;
            height: 75vmin;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 클릭 시 나타나는 몰라 레이어 */
        .reveal-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .reveal-layer canvas {
            width: 100%; height: 100%;
        }

        /* 어금니 커서 */
        .cursor-molar {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }
        .cursor-molar img {
            width: 50px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>
    <div class="poster-area">
        <canvas id="base"></canvas>
        <div class="reveal-layer">
            <canvas id="reveal"></canvas>
        </div>
    </div>
    <div class="cursor-molar" id="cursor">
        <img src="tooth.png" alt="어금니">
    </div>

    <!-- 어금니 실루엣 clip-path용 SVG -->
    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <clipPath id="tooth-clip" clipPathUnits="objectBoundingBox">
                <!-- 어금니 실루엣 (0~1 범위) -->
                <path d="M 0.3,0.05 C 0.2,0.02 0.15,0.08 0.15,0.15 C 0.12,0.05 0.05,0.08 0.08,0.18 C 0.02,0.12 0.0,0.2 0.05,0.28 C 0.0,0.35 0.05,0.45 0.12,0.48 C 0.08,0.55 0.1,0.65 0.18,0.68 L 0.2,0.85 C 0.2,0.92 0.25,0.98 0.3,0.98 C 0.33,0.98 0.35,0.95 0.35,0.9 L 0.38,0.78 C 0.4,0.76 0.42,0.75 0.45,0.75 L 0.55,0.75 C 0.58,0.75 0.6,0.76 0.62,0.78 L 0.65,0.9 C 0.65,0.95 0.67,0.98 0.7,0.98 C 0.75,0.98 0.8,0.92 0.8,0.85 L 0.82,0.68 C 0.9,0.65 0.92,0.55 0.88,0.48 C 0.95,0.45 1.0,0.35 0.95,0.28 C 1.0,0.2 0.98,0.12 0.92,0.18 C 0.95,0.08 0.88,0.05 0.85,0.15 C 0.85,0.08 0.8,0.02 0.7,0.05 C 0.65,0.0 0.55,0.0 0.5,0.03 C 0.45,0.0 0.35,0.0 0.3,0.05 Z"/>
            </clipPath>
        </defs>
    </svg>

    <script>
    const baseCanvas = document.getElementById('base');
    const revealCanvas = document.getElementById('reveal');
    const baseCtx = baseCanvas.getContext('2d');
    const revealCtx = revealCanvas.getContext('2d');
    const cursorEl = document.getElementById('cursor');

    let S; // canvas pixel size

    function resize() {
        const area = document.querySelector('.poster-area');
        const rect = area.getBoundingClientRect();
        S = Math.floor(rect.width * (window.devicePixelRatio || 1));
        baseCanvas.width = baseCanvas.height = S;
        revealCanvas.width = revealCanvas.height = S;
        drawBase();
        drawReveal();
    }

    // 버블 글자 그리기 함수
    function drawBubbleText(ctx, text, x, y, size, color) {
        ctx.save();
        ctx.font = `900 ${size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.miterLimit = 2;

        // 두꺼운 stroke로 빵빵한 느낌 (같은 색)
        ctx.lineWidth = size * 0.12;
        ctx.strokeStyle = color;
        ctx.strokeText(text, x, y);

        ctx.fillStyle = color;
        ctx.fillText(text, x, y);

        ctx.restore();
    }

    // 기본 텍스트: "어금니가 영어로 뭐야"
    function drawBase() {
        const ctx = baseCtx;
        ctx.clearRect(0, 0, S, S);

        const color = '#ffffff';
        const fontSize = S * 0.22;

        drawBubbleText(ctx, '어금니가', S * 0.5, S * 0.22, fontSize, color);
        drawBubbleText(ctx, '영어로', S * 0.5, S * 0.5, fontSize, color);
        drawBubbleText(ctx, '뭐야?', S * 0.5, S * 0.78, fontSize, color);
    }

    // 몰라 텍스트 (빨간색)
    function drawReveal() {
        const ctx = revealCtx;
        ctx.clearRect(0, 0, S, S);

        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, S, S);

        const color = '#e63946';
        const fontSize = S * 0.35;

        drawBubbleText(ctx, '몰', S * 0.5, S * 0.38, fontSize, color);
        drawBubbleText(ctx, '라', S * 0.5, S * 0.7, fontSize, color);
    }

    // 마스크 (클릭하면 어금니 실루엣으로 reveal 보이기)
    let isPressed = false;
    let maskRadius = 0;
    let maskX = 0.5, maskY = 0.5;

    function updateMask() {
        const el = revealCanvas.parentElement;
        if (maskRadius <= 0) {
            el.style.clipPath = 'circle(0% at 50% 50%)';
            return;
        }
        // 어금니 크기 (maskRadius를 퍼센트로 사용)
        const size = maskRadius * 1.2; // vmin 기준 크기
        const left = maskX * 100 - size / 2;
        const top = maskY * 100 - size / 2.2;

        // inset으로 위치 잡고 SVG clip-path 사용
        el.style.clipPath = `url(#tooth-clip)`;
        el.style.clip = 'auto';
        // transform으로 위치+크기 조절
        const tx = (maskX - 0.5) * 100;
        const ty = (maskY - 0.5) * 100;
        const scale = maskRadius / 50;
        el.style.transformOrigin = `${maskX * 100}% ${maskY * 100}%`;
        el.style.transform = `scale(${Math.max(scale, 0.01)})`;
    }

    function growMask() {
        if (!isPressed) return;
        maskRadius = Math.min(maskRadius + 1.5, 75);
        updateMask();
        requestAnimationFrame(growMask);
    }

    function shrinkMask() {
        if (isPressed) return;
        maskRadius = Math.max(maskRadius - 2.5, 0);
        updateMask();
        if (maskRadius > 0) requestAnimationFrame(shrinkMask);
    }

    // 이벤트
    const area = document.querySelector('.poster-area');

    document.addEventListener('mousemove', (e) => {
        cursorEl.style.left = e.clientX + 'px';
        cursorEl.style.top = e.clientY + 'px';

        const rect = area.getBoundingClientRect();
        maskX = (e.clientX - rect.left) / rect.width;
        maskY = (e.clientY - rect.top) / rect.height;
        if (isPressed) updateMask();
    });

    document.addEventListener('mousedown', () => {
        isPressed = true;
        updateMask();
        growMask();
    });

    document.addEventListener('mouseup', () => {
        isPressed = false;
        shrinkMask();
    });

    // 커서 흔들림
    let angle = 0, dir = 1;
    function wobble() {
        if (isPressed) {
            angle += 0.12 * dir;
            if (angle > 5) dir = -1;
            if (angle < -5) dir = 1;
        } else {
            angle *= 0.9;
        }
        cursorEl.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        requestAnimationFrame(wobble);
    }
    wobble();

    // 초기화
    resize();
    window.addEventListener('resize', resize);
    updateMask();
    </script>
</body>
</html>
