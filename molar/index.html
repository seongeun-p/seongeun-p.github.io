<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니가 영어로 뭐야?</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            width: 100vw; height: 100vh;
            overflow: hidden;
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text-container {
            position: relative;
            text-align: center;
        }

        /* 기본 텍스트: 어금니가 영어로 뭐야? */
        .base-text {
            font-family: 'Pretendard', sans-serif;
            font-weight: 800;
            font-size: clamp(48px, 9vw, 140px);
            line-height: 1.1;
            color: #1a1a1a;
            text-shadow:
                0 1px 0 #2a2a2a,
                0 2px 0 #252525,
                0 3px 0 #222,
                0 4px 0 #1f1f1f,
                0 5px 0 #1c1c1c,
                0 6px 3px rgba(0,0,0,0.4),
                0 0 8px rgba(255,255,255,0.08),
                -1px -1px 0 rgba(255,255,255,0.15),
                1px 1px 0 rgba(0,0,0,0.5);
            /* 엠보싱: 밝은 상단 + 어두운 하단 */
            background: linear-gradient(180deg, #e8e8e8 0%, #b0b0b0 40%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        /* 몰라 텍스트 (클릭 시 나타남) */
        .reveal-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Pretendard', sans-serif;
            font-weight: 800;
            font-size: clamp(80px, 16vw, 240px);
            line-height: 1;
            color: #1a1a1a;
            background: linear-gradient(180deg, #ff4444 0%, #cc0000 40%, #880000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 8px rgba(200,0,0,0.4));
            clip-path: circle(0% at var(--mx, 50%) var(--my, 50%));
            transition: none;
            pointer-events: none;
        }

        .reveal-text.active {
            clip-path: circle(var(--radius, 0%) at var(--mx, 50%) var(--my, 50%));
        }

        /* 3D 어금니 커서 */
        .cursor-molar {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        .cursor-molar img {
            width: 50px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>
    <div class="text-container" id="container">
        <div class="base-text">어금니가<br>영어로 뭐야?</div>
        <div class="reveal-text" id="reveal">몰라</div>
    </div>

    <!-- 3D 어금니 커서 -->
    <div class="cursor-molar" id="cursor">
        <img src="tooth.png" alt="어금니">
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        const reveal = document.getElementById('reveal');
        const container = document.getElementById('container');
        let isPressed = false;
        let radius = 0;
        let mx = 50, my = 50;

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            // reveal 위치 업데이트
            const rect = container.getBoundingClientRect();
            mx = ((e.clientX - rect.left) / rect.width) * 100;
            my = ((e.clientY - rect.top) / rect.height) * 100;
            reveal.style.setProperty('--mx', mx + '%');
            reveal.style.setProperty('--my', my + '%');
        });

        document.addEventListener('mousedown', () => {
            isPressed = true;
            reveal.classList.add('active');
            growReveal();
        });

        document.addEventListener('mouseup', () => {
            isPressed = false;
            // 서서히 줄어들기
            shrinkReveal();
        });

        function growReveal() {
            if (!isPressed) return;
            radius = Math.min(radius + 2, 80);
            reveal.style.setProperty('--radius', radius + '%');
            requestAnimationFrame(growReveal);
        }

        function shrinkReveal() {
            if (isPressed) return;
            radius = Math.max(radius - 3, 0);
            reveal.style.setProperty('--radius', radius + '%');
            if (radius > 0) {
                requestAnimationFrame(shrinkReveal);
            } else {
                reveal.classList.remove('active');
            }
        }

        // 커서 약간의 떨림 (어금니 느낌)
        let angle = 0, dir = 1;
        function wobble() {
            if (isPressed) {
                angle += 0.15 * dir;
                if (angle > 5) dir = -1;
                if (angle < -5) dir = 1;
            } else {
                angle *= 0.9;
            }
            cursor.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
            requestAnimationFrame(wobble);
        }
        wobble();
    </script>
</body>
</html>
