<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니가 영어로 뭐야?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f0e8;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poster {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 배경 텍스트 반복 */
        .text-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 60px;
            z-index: 1;
        }

        .text-line {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 900;
            line-height: 1.15;
            white-space: nowrap;
        }

        .line-question {
            color: #1a1a1a;
        }

        .line-answer {
            color: #e63946;
        }

        /* 대사 크기 점점 커짐 */
        .size-1 .line-question { font-size: clamp(18px, 3vw, 36px); }
        .size-1 .line-answer { font-size: clamp(20px, 3.5vw, 42px); }

        .size-2 .line-question { font-size: clamp(24px, 4vw, 48px); }
        .size-2 .line-answer { font-size: clamp(28px, 4.8vw, 56px); }

        .size-3 .line-question { font-size: clamp(32px, 5.5vw, 64px); }
        .size-3 .line-answer { font-size: clamp(38px, 6.5vw, 76px); }

        /* 어금니 캐릭터 */
        .molar-character {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            animation: headShake 1.5s ease-in-out infinite;
        }

        @keyframes headShake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            15% { transform: translate(-50%, -50%) rotate(-12deg); }
            30% { transform: translate(-50%, -50%) rotate(10deg); }
            45% { transform: translate(-50%, -50%) rotate(-8deg); }
            60% { transform: translate(-50%, -50%) rotate(6deg); }
            75% { transform: translate(-50%, -50%) rotate(-3deg); }
        }

        .molar-svg {
            width: clamp(180px, 28vw, 320px);
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.15));
        }

        /* 눈 감기 애니메이션 */
        .eye-lid {
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 40%, 100% { transform: scaleY(1); }
            45%, 95% { transform: scaleY(0.05); }
        }

        /* 물음표/느낌표 이펙트 */
        .floating-marks {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .mark {
            position: absolute;
            font-size: clamp(24px, 4vw, 48px);
            font-weight: 900;
            opacity: 0.08;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.08; }
            90% { opacity: 0.08; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="poster">

        <!-- 텍스트 레이어 -->
        <div class="text-layer">
            <div class="size-1">
                <div class="text-line line-question">어금니가 영어로 뭐야?</div>
                <div class="text-line line-answer">몰라</div>
            </div>
            <br>
            <div class="size-2">
                <div class="text-line line-question">어금니가 영어로 뭐냐니까?</div>
                <div class="text-line line-answer">몰라!</div>
            </div>
            <br>
            <div class="size-3">
                <div class="text-line line-question">어금니가 영어로 뭐냐고!</div>
                <div class="text-line line-answer">몰라!</div>
            </div>
            <br>
            <div class="size-1">
                <div class="text-line line-question">어금니가 영어로 뭐야?</div>
                <div class="text-line line-answer">몰라</div>
            </div>
            <br>
            <div class="size-2">
                <div class="text-line line-question">어금니가 영어로 뭐냐니까?</div>
                <div class="text-line line-answer">몰라!</div>
            </div>
            <br>
            <div class="size-3">
                <div class="text-line line-question">어금니가 영어로 뭐냐고!</div>
                <div class="text-line line-answer">몰라!</div>
            </div>
        </div>

        <!-- 어금니 캐릭터 -->
        <div class="molar-character">
            <svg class="molar-svg" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
                <!-- 어금니 몸통 -->
                <path d="M 40 100 
                         C 40 50, 70 20, 100 20 
                         C 130 20, 160 50, 160 100 
                         L 160 160
                         C 160 170, 155 175, 150 175
                         L 145 220
                         C 145 240, 135 250, 125 250
                         C 120 250, 115 245, 115 235
                         L 115 200
                         C 115 195, 110 192, 105 192
                         L 95 192
                         C 90 192, 85 195, 85 200
                         L 85 235
                         C 85 245, 80 250, 75 250
                         C 65 250, 55 240, 55 220
                         L 50 175
                         C 45 175, 40 170, 40 160
                         Z" 
                     fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
                
                <!-- 어금니 상단 울퉁불퉁 -->
                <ellipse cx="72" cy="28" rx="18" ry="14" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
                <ellipse cx="100" cy="22" rx="16" ry="12" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
                <ellipse cx="128" cy="28" rx="18" ry="14" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>

                <!-- 눈 (감은 상태 — 일자) -->
                <g class="eye-lid" style="transform-origin: 78px 95px;">
                    <path d="M 62 95 Q 78 105 94 95" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
                </g>
                <g class="eye-lid" style="transform-origin: 122px 95px;">
                    <path d="M 106 95 Q 122 105 138 95" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
                </g>

                <!-- 눈썹 (찡그린) -->
                <path d="M 60 78 L 90 82" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
                <path d="M 140 78 L 110 82" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

                <!-- 입 (삐죽) -->
                <path d="M 85 135 Q 100 128 115 135" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
                
                <!-- 볼터치 -->
                <ellipse cx="65" cy="120" rx="10" ry="6" fill="rgba(230,57,70,0.2)"/>
                <ellipse cx="135" cy="120" rx="10" ry="6" fill="rgba(230,57,70,0.2)"/>

                <!-- 땀방울 -->
                <path d="M 155 60 Q 160 50 165 60 Q 160 70 155 60" fill="rgba(100,180,255,0.6)"/>
            </svg>
        </div>

        <!-- 떠다니는 물음표/느낌표 -->
        <div class="floating-marks" id="marks"></div>
    </div>

    <script>
        // 떠다니는 ?! 마크 생성
        const marks = document.getElementById('marks');
        const symbols = ['?', '!', '?!', 'MOLAR', '몰라', '?'];
        
        for (let i = 0; i < 15; i++) {
            const mark = document.createElement('div');
            mark.className = 'mark';
            mark.textContent = symbols[i % symbols.length];
            mark.style.left = Math.random() * 100 + '%';
            mark.style.animationDelay = Math.random() * 8 + 's';
            mark.style.animationDuration = (6 + Math.random() * 4) + 's';
            mark.style.color = Math.random() > 0.5 ? '#1a1a1a' : '#e63946';
            marks.appendChild(mark);
        }
    </script>
</body>
</html>
