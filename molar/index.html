<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니가 영어로 뭐야?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            width: 100vw; height: 100vh;
            overflow: hidden;
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .poster-area {
            position: relative;
            width: 75vmin; height: 75vmin;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .cursor-molar {
            position: fixed; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
        }
        .cursor-molar img {
            width: 50px; height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>
    <div class="poster-area">
        <canvas id="base"></canvas>
        <canvas id="reveal"></canvas>
    </div>
    <div class="cursor-molar" id="cursor">
        <img src="tooth.png" alt="어금니" id="toothImg">
    </div>

    <script>
    const baseCanvas = document.getElementById('base');
    const revealCanvas = document.getElementById('reveal');
    const baseCtx = baseCanvas.getContext('2d');
    const revealCtx = revealCanvas.getContext('2d');
    const cursorEl = document.getElementById('cursor');
    const toothImg = document.getElementById('toothImg');

    let S;
    let mouseX = 0, mouseY = 0;
    let isPressed = false;
    let toothSize = 0;
    const MAX_TOOTH = 280;

    function resize() {
        const area = document.querySelector('.poster-area');
        const rect = area.getBoundingClientRect();
        S = Math.floor(rect.width * (window.devicePixelRatio || 1));
        baseCanvas.width = baseCanvas.height = S;
        revealCanvas.width = revealCanvas.height = S;
        drawBase();
    }

    function drawText(ctx, text, x, y, size, fillColor, strokeColor) {
        ctx.save();
        ctx.font = `bold ${size}px Gulim, '굴림', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        // 검정 테두리
        ctx.lineWidth = size * 0.08;
        ctx.strokeStyle = strokeColor || '#000000';
        ctx.strokeText(text, x, y);
        // 흰색 채우기
        ctx.fillStyle = fillColor;
        ctx.fillText(text, x, y);
        ctx.restore();
    }

    // 배경색 그라데이션 (시간에 따라 변함)
    let hueOffset = 0;

    function getGradientBg(ctx) {
        const h1 = (hueOffset) % 360;
        const h2 = (hueOffset + 60) % 360;
        const h3 = (hueOffset + 120) % 360;
        const grad = ctx.createLinearGradient(0, 0, S, S);
        grad.addColorStop(0, `hsl(${h1}, 90%, 55%)`);
        grad.addColorStop(0.5, `hsl(${h2}, 85%, 50%)`);
        grad.addColorStop(1, `hsl(${h3}, 90%, 55%)`);
        return grad;
    }

    function drawBase() {
        baseCtx.clearRect(0, 0, S, S);
        // 알록달록 배경
        baseCtx.fillStyle = getGradientBg(baseCtx);
        baseCtx.fillRect(0, 0, S, S);

        const fontSize = S * 0.22;
        drawText(baseCtx, '어금니가', S * 0.5, S * 0.22, fontSize, '#ffffff', '#000000');
        drawText(baseCtx, '영어로', S * 0.5, S * 0.5, fontSize, '#ffffff', '#000000');
        drawText(baseCtx, '뭐야?', S * 0.5, S * 0.78, fontSize, '#ffffff', '#000000');
    }

    // 어금니 모양 path 그리기 (마스크용)
    function drawToothPath(ctx, cx, cy, size) {
        const s = size / 200; // 기본 200px 기준 스케일
        ctx.beginPath();
        // 어금니 실루엣
        ctx.moveTo(cx - 60*s, cy + 80*s);
        ctx.quadraticCurveTo(cx - 70*s, cy + 20*s, cx - 50*s, cy - 30*s);
        ctx.quadraticCurveTo(cx - 40*s, cy - 70*s, cx - 20*s, cy - 85*s);
        ctx.quadraticCurveTo(cx, cy - 60*s, cx, cy - 60*s);
        ctx.quadraticCurveTo(cx, cy - 60*s, cx + 20*s, cy - 85*s);
        ctx.quadraticCurveTo(cx + 40*s, cy - 70*s, cx + 50*s, cy - 30*s);
        ctx.quadraticCurveTo(cx + 70*s, cy + 20*s, cx + 60*s, cy + 80*s);
        // 하단 뿌리 (간략화)
        ctx.quadraticCurveTo(cx + 40*s, cy + 100*s, cx + 25*s, cy + 110*s);
        ctx.quadraticCurveTo(cx + 15*s, cy + 100*s, cx + 5*s, cy + 90*s);
        ctx.quadraticCurveTo(cx, cy + 85*s, cx - 5*s, cy + 90*s);
        ctx.quadraticCurveTo(cx - 15*s, cy + 100*s, cx - 25*s, cy + 110*s);
        ctx.quadraticCurveTo(cx - 40*s, cy + 100*s, cx - 60*s, cy + 80*s);
        ctx.closePath();
    }

    // reveal 캔버스 그리기
    function drawReveal() {
        const ctx = revealCtx;
        ctx.clearRect(0, 0, S, S);

        if (toothSize <= 0) return;

        // 1) 어금니 모양 마스크 영역만 그리기
        ctx.save();
        drawToothPath(ctx, mouseX * S, mouseY * S, toothSize * (S / 400));
        ctx.clip();

        // 2) 배경
        ctx.fillStyle = getGradientBg(ctx);
        ctx.fillRect(0, 0, S, S);

        // 3) 빨간 "몰라" 텍스트 (흰 테두리 + 빨간 채우기 대신, 빨간 채우기 + 검정 테두리)
        const fontSize = S * 0.35;
        drawText(ctx, '몰', S * 0.5, S * 0.38, fontSize, '#e63946', '#000000');
        drawText(ctx, '라', S * 0.5, S * 0.7, fontSize, '#e63946', '#000000');

        ctx.restore();
    }

    // 애니메이션 루프
    function animate() {
        hueOffset += 0.5;
        if (isPressed) {
            toothSize = Math.min(toothSize + 6, MAX_TOOTH);
        } else {
            toothSize = Math.max(toothSize - 10, 0);
        }
        drawBase();
        drawReveal();
        requestAnimationFrame(animate);
    }

    // 이벤트
    const area = document.querySelector('.poster-area');

    document.addEventListener('mousemove', (e) => {
        cursorEl.style.left = e.clientX + 'px';
        cursorEl.style.top = e.clientY + 'px';

        const rect = area.getBoundingClientRect();
        mouseX = (e.clientX - rect.left) / rect.width;
        mouseY = (e.clientY - rect.top) / rect.height;
    });

    document.addEventListener('mousedown', () => { isPressed = true; });
    document.addEventListener('mouseup', () => { isPressed = false; });

    // 커서 흔들림
    let angle = 0, dir = 1;
    function wobble() {
        if (isPressed) {
            angle += 0.12 * dir;
            if (angle > 5) dir = -1;
            if (angle < -5) dir = 1;
        } else {
            angle *= 0.9;
        }
        cursorEl.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        requestAnimationFrame(wobble);
    }
    wobble();

    resize();
    window.addEventListener('resize', resize);
    animate();
    </script>
</body>
</html>
