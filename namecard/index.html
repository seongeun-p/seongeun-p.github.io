<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명함 자판기</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@700&family=Gamja+Flower&family=Gothic+A1:wght@700&family=Jua&family=Nanum+Brush+Script&family=Nanum+Gothic:wght@700&family=Nanum+Myeongjo:wght@700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@700;900&family=Noto+Serif+KR:wght@700&family=Poor+Story&family=Single+Day&family=Sunflower:wght@700&family=Yeon+Sung&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
            background: #ffffff;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* 떠다니는 원들 배경 */
        .floating-circles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .circle {
            position: absolute;
            border-radius: 50%;
            animation: float linear infinite;
        }
        .circle .inner {
            position: absolute;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes float {
            0% { transform: translate(0, 0); }
            25% { transform: translate(30px, -20px); }
            50% { transform: translate(-20px, -40px); }
            75% { transform: translate(-30px, 20px); }
            100% { transform: translate(0, 0); }
        }

        .back-btn {
            position: fixed; top: 14px; left: 14px; z-index: 100;
            color: #333; text-decoration: none; font-size: 22px;
            font-weight: 300; opacity: 0.5;
        }
        .back-btn:hover { opacity: 1; }

        /* 입력 화면 */
        .input-screen {
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
            transition: opacity 0.4s, transform 0.4s;
            z-index: 10; position: relative;
        }
        .input-screen.hide { opacity: 0; transform: scale(0.95); pointer-events: none; }

        .input-screen h1 {
            font-size: 24px; font-weight: 700; color: #222;
            letter-spacing: -0.5px;
        }
        .input-screen p {
            font-size: 13px; color: #999; margin-top: -10px;
        }

        .input-group {
            display: flex; flex-direction: column; gap: 12px;
            width: 280px;
        }
        .input-group label {
            font-size: 12px; color: #666; font-weight: 600;
        }
        .input-group input {
            padding: 12px 16px; border: 1.5px solid #ddd;
            border-radius: 8px; font-size: 15px;
            font-family: 'Noto Sans KR', sans-serif;
            outline: none; transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: #333; }

        .generate-btn {
            padding: 14px 40px; background: #222; color: #fff;
            border: none; border-radius: 30px; font-size: 15px;
            font-weight: 600; cursor: pointer; margin-top: 8px;
            font-family: 'Noto Sans KR', sans-serif;
            transition: background 0.2s;
        }
        .generate-btn:hover { background: #444; }

        /* 명함 화면 */
        .card-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s;
        }
        .card-screen.show { opacity: 1; pointer-events: auto; }

        .namecard {
            width: 300px; height: 420px;
            border-radius: 0;
            padding: 36px 30px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .namecard .name-area {
            display: flex; gap: 2px; align-items: baseline;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .namecard .name-char {
            font-size: 52px; font-weight: 700;
            line-height: 1;
        }

        .namecard .quote {
            font-size: 16px; opacity: 0.85;
            line-height: 1.6;
            margin-top: 8px;
        }

        .namecard .divider {
            width: 40px; height: 2px;
            background: currentColor; opacity: 0.3;
            margin: 16px auto;
        }

        .namecard .birth {
            font-size: 11px; opacity: 0.5;
            letter-spacing: 1px;
        }

        .namecard .deco {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
        }

        .card-actions {
            display: flex; gap: 12px; margin-top: 24px;
        }
        .card-actions button {
            padding: 10px 24px; border-radius: 24px;
            font-size: 13px; cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 600; border: none;
        }
        .btn-again { background: #222; color: #fff; }
        .btn-again:hover { background: #444; }
        .btn-back { background: #eee; color: #333; }
        .btn-back:hover { background: #ddd; }
    </style>
</head>
<body>
    <div class="floating-circles" id="floatingCircles"></div>
    <a class="back-btn" href="../">&lt;</a>

    <!-- 입력 화면 -->
    <div class="input-screen" id="inputScreen">
        <h1>오늘의 운세 자판기</h1>
        <p>이름과 생년월일을 넣으면 오늘의 운세가 나와요</p>
        <div class="input-group">
            <label>이름</label>
            <input type="text" id="nameInput" placeholder="홍길동" maxlength="6">
            <label>생년월일</label>
            <input type="text" id="birthInput" placeholder="1995.03.25">
        </div>
        <button class="generate-btn" id="generateBtn">운세 뽑기</button>
    </div>

    <!-- 명함 결과 화면 -->
    <div class="card-screen" id="cardScreen">
        <div class="namecard" id="namecard">
            <div class="name-area" id="nameArea"></div>
            <div class="divider"></div>
            <div class="quote" id="quoteText"></div>
            <div class="birth" id="birthText"></div>
            <div class="deco" id="deco"></div>
        </div>
        <div class="card-actions">
            <button class="btn-again" id="btnAgain">다시 뽑기</button>
            <button class="btn-back" id="btnBack">처음으로</button>
        </div>
    </div>

    <script>
    // 떠다니는 원들 생성
    const CIRCLE_COLORS = ['#ff3b7f', '#ff8c00', '#ffd000', '#00c853', '#2979ff', '#e040fb', '#ff5252', '#00e676'];
    const circlesContainer = document.getElementById('floatingCircles');

    for (let i = 0; i < 135; i++) {
        const circle = document.createElement('div');
        circle.className = 'circle';
        const size = 20 + Math.random() * 120;
        const color = CIRCLE_COLORS[Math.floor(Math.random() * CIRCLE_COLORS.length)];
        circle.style.width = size + 'px';
        circle.style.height = size + 'px';
        circle.style.background = color;
        circle.style.left = Math.random() * 100 + '%';
        circle.style.top = Math.random() * 100 + '%';
        circle.style.animationDuration = (8 + Math.random() * 12) + 's';
        circle.style.animationDelay = -(Math.random() * 10) + 's';
        circle.style.opacity = 0.8 + Math.random() * 0.2;

        // 일부 원에 안쪽 작은 원 추가 (레퍼런스처럼)
        if (Math.random() > 0.5) {
            const inner = document.createElement('div');
            inner.className = 'inner';
            const innerSize = size * (0.3 + Math.random() * 0.3);
            const innerColor = CIRCLE_COLORS[Math.floor(Math.random() * CIRCLE_COLORS.length)];
            inner.style.width = innerSize + 'px';
            inner.style.height = innerSize + 'px';
            inner.style.background = innerColor;
            circle.appendChild(inner);
        }

        circlesContainer.appendChild(circle);
    }
    const FONTS = [
        "'Black Han Sans'", "'Do Hyeon'", "'Gaegu'", "'Gamja Flower'",
        "'Gothic A1'", "'Jua'", "'Nanum Brush Script'", "'Nanum Gothic'",
        "'Nanum Myeongjo'", "'Nanum Pen Script'", "'Noto Sans KR'",
        "'Noto Serif KR'", "'Poor Story'", "'Single Day'",
        "'Sunflower'", "'Yeon Sung'"
    ];

    const PALETTES = [
        { bg: '#ff6b6b', text: '#fff', deco: '#feca57' },
        { bg: '#48dbfb', text: '#222', deco: '#ff9ff3' },
        { bg: '#feca57', text: '#222', deco: '#ff6348' },
        { bg: '#ff9ff3', text: '#222', deco: '#54a0ff' },
        { bg: '#54a0ff', text: '#fff', deco: '#feca57' },
        { bg: '#5f27cd', text: '#fff', deco: '#ff9ff3' },
        { bg: '#10ac84', text: '#fff', deco: '#feca57' },
        { bg: '#ee5a24', text: '#fff', deco: '#f6e58d' },
        { bg: '#f368e0', text: '#fff', deco: '#48dbfb' },
        { bg: '#01a3a4', text: '#fff', deco: '#f9ca24' },
        { bg: '#6c5ce7', text: '#fff', deco: '#fd79a8' },
        { bg: '#00b894', text: '#fff', deco: '#fdcb6e' },
        { bg: '#e17055', text: '#fff', deco: '#81ecec' },
        { bg: '#0984e3', text: '#fff', deco: '#ffeaa7' },
        { bg: '#fdcb6e', text: '#222', deco: '#e17055' },
        { bg: '#81ecec', text: '#222', deco: '#6c5ce7' },
    ];

    // 오늘의 운세
    const QUOTES_BY_MONTH = {
        1: ['올해 대박나는 운이 따른다', '새로운 시작이 좋은 결과를 부른다'],
        2: ['기다리던 연락이 곧 온다', '숨겨둔 재능이 빛을 발한다'],
        3: ['예상치 못한 행운이 찾아온다', '좋은 사람이 곁에 나타난다'],
        4: ['하던 일이 순조롭게 풀린다', '금전운이 상승하는 시기'],
        5: ['건강이 회복되는 좋은 흐름', '주변에서 도움의 손길이 온다'],
        6: ['인간관계가 넓어지는 시기', '오랜 고민이 해결된다'],
        7: ['직감을 믿어도 좋은 날', '여행이나 이동에 행운이 따른다'],
        8: ['노력한 만큼 보상이 온다', '새로운 기회의 문이 열린다'],
        9: ['조용히 준비한 것이 결실을 맺는다', '뜻밖의 선물이 기다린다'],
        10: ['자신감을 가져도 좋은 시기', '중요한 결정이 좋은 방향으로 간다'],
        11: ['작은 변화가 큰 행복을 부른다', '오늘 만난 사람이 귀인이다'],
        12: ['한 해를 잘 마무리할 운', '내년에 대박칠 기운이 차오른다'],
    };

    const QUOTES_EXTRA = [
        '오늘 뭘 해도 잘 풀리는 날',
        '복권 한 장 사도 괜찮은 날',
        '갑자기 좋은 소식이 들려온다',
        '밥 한끼에 인생이 바뀔 수 있다',
        '지금 떠오른 생각이 정답이다',
        '오늘의 선택이 미래를 바꾼다',
        '누군가 당신을 떠올리고 있다',
        '낮잠 자도 되는 날',
        '퇴근길에 좋은 일이 생긴다',
        '오늘 카페 가면 좋은 일이 있다',
    ];

    function getMonth(birthStr) {
        const parts = birthStr.replace(/[^0-9]/g, '');
        if (parts.length >= 6) return parseInt(parts.substring(4, 6));
        return Math.floor(Math.random() * 12) + 1;
    }

    function seed(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
        return Math.abs(h);
    }

    function generate() {
        const name = document.getElementById('nameInput').value.trim();
        const birth = document.getElementById('birthInput').value.trim();
        if (!name) { alert('이름을 입력해주세요'); return; }

        const s = seed(name + birth + Math.random().toString());
        const month = getMonth(birth);

        // 색상 팔레트
        const palette = PALETTES[s % PALETTES.length];
        const card = document.getElementById('namecard');
        card.style.background = palette.bg;
        card.style.color = palette.text;
        document.getElementById('deco').style.background = palette.deco;

        // 추가 데코 도형들
        const existingDecos = card.querySelectorAll('.extra-deco');
        existingDecos.forEach(d => d.remove());
        for (let i = 0; i < 4; i++) {
            const d = document.createElement('div');
            d.className = 'deco extra-deco';
            const size = 40 + Math.random() * 100;
            d.style.width = size + 'px';
            d.style.height = size + 'px';
            d.style.background = i % 2 === 0 ? palette.deco : palette.text;
            d.style.top = (Math.random() * 200 - 40) + 'px';
            d.style.right = (Math.random() * 300 - 60) + 'px';
            d.style.opacity = 0.08 + Math.random() * 0.1;
            card.appendChild(d);
        }
        document.getElementById('cardScreen').style.background = palette.bg + '20';

        // 이름 글자별 다른 폰트
        const nameArea = document.getElementById('nameArea');
        nameArea.innerHTML = '';
        const usedFonts = [];
        for (let i = 0; i < name.length; i++) {
            let font;
            do { font = FONTS[Math.floor(Math.random() * FONTS.length)]; }
            while (usedFonts.includes(font) && usedFonts.length < FONTS.length);
            usedFonts.push(font);

            const span = document.createElement('span');
            span.className = 'name-char';
            span.textContent = name[i];
            span.style.fontFamily = font;
            // 약간의 크기/위치 변화
            span.style.fontSize = (40 + Math.random() * 16) + 'px';
            span.style.marginRight = (Math.random() * 4) + 'px';
            nameArea.appendChild(span);
        }

        // 글귀
        const monthQuotes = QUOTES_BY_MONTH[month] || QUOTES_EXTRA;
        const allQuotes = [...monthQuotes, ...QUOTES_EXTRA];
        const quote = allQuotes[Math.floor(Math.random() * allQuotes.length)];
        document.getElementById('quoteText').textContent = quote;
        document.getElementById('quoteText').style.fontFamily = FONTS[Math.floor(Math.random() * FONTS.length)];

        // 생년월일 숨기기
        document.getElementById('birthText').textContent = '';

        // 화면 전환
        document.getElementById('inputScreen').classList.add('hide');
        document.getElementById('cardScreen').classList.add('show');
    }

    function goBack() {
        document.getElementById('inputScreen').classList.remove('hide');
        document.getElementById('cardScreen').classList.remove('show');
    }

    document.getElementById('generateBtn').addEventListener('click', generate);
    document.getElementById('btnAgain').addEventListener('click', generate);
    document.getElementById('btnBack').addEventListener('click', goBack);

    // Enter 키로도 생성
    document.getElementById('birthInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') generate();
    });
    document.getElementById('nameInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('birthInput').focus();
    });
    </script>
</body>
</html>
