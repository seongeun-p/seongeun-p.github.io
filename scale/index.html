<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키로의 무게는?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #1a1025; font-family: -apple-system, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
        .back-btn { position: fixed; top: 14px; left: 14px; z-index: 100; color: #fff; text-decoration: none; font-size: 22px; font-weight: 300; opacity: 0.5; }
        .back-btn:hover { opacity: 1; }
        .ui-overlay { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 12px; pointer-events: none; z-index: 50; }
        .ui-overlay > * { pointer-events: auto; }
        h1 { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); font-size: 16px; color: #fff; z-index: 50; }
        .info { position: fixed; top: 36px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.5); z-index: 50; }
        .tray { display: flex; gap: 6px; padding: 10px 14px; background: rgba(255,255,255,0.1); border-radius: 12px; backdrop-filter: blur(8px); margin-bottom: 8px; }
        .tray-item { width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s, background 0.15s; font-size: 9px; color: rgba(255,255,255,0.7); position: relative; }
        .tray-item:hover { transform: scale(1.1); background: rgba(255,255,255,0.15); }
        .tray-item:hover .item-name { opacity: 1; }
        .item-name { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .tray-item span { font-size: 18px; }
        .bottom-bar { display: flex; gap: 12px; align-items: center; }
        .weight-text { font-size: 13px; color: #fff; font-family: 'Courier New', monospace; }
        .status-text { font-size: 11px; color: rgba(255,255,255,0.5); }
        .guess-btn { padding: 7px 16px; background: #a855f7; color: #fff; border: none; border-radius: 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .guess-btn:hover { background: #9333ea; }
        .result { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #fff; padding: 24px 36px; border-radius: 14px; text-align: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .result.show { opacity: 1; pointer-events: auto; }
        .result h2 { font-size: 18px; margin-bottom: 6px; }
        .result p { font-size: 12px; color: #888; margin-bottom: 12px; }
        .result button { padding: 7px 18px; background: #7c3aed; color: #fff; border: none; border-radius: 14px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&lt;</a>
    <h1>키로의 무게는?</h1>
    <div class="info">물건을 10번까지 올려보고 키로의 무게를 맞혀보세요!</div>

    <div class="ui-overlay">
        <div class="tray" id="tray"></div>
        <div class="bottom-bar">
            <span class="weight-text" id="weightText">0g</span>
            <span class="status-text" id="statusText">물건을 올려보세요</span>
            <span class="status-text" id="chancesText">기회: 10</span>
        </div>
        <div class="bottom-bar" style="margin-top:6px;">
            <input type="number" id="guessInput" placeholder="키로 무게(g)?" style="width:100px; padding:5px 10px; border-radius:10px; border:none; font-size:13px; text-align:center;">
            <button class="guess-btn" id="guessBtn">제출!</button>
        </div>
    </div>

    <div class="result" id="result"><h2 id="rTitle"></h2><p id="rText"></p><button onclick="location.reload()">다시</button></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
    const scene = new THREE.Scene();
    // 그라데이션 배경 (보라→핑크)
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = 2; bgCanvas.height = 512;
    const bgCtx = bgCanvas.getContext('2d');
    const grad = bgCtx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#1a0533');
    grad.addColorStop(0.5, '#2d1b69');
    grad.addColorStop(1, '#4a1942');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, 2, 512);
    const bgTexture = new THREE.CanvasTexture(bgCanvas);
    scene.background = bgTexture;
    scene.fog = new THREE.Fog(0x2d1b69, 6, 16);

    const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.5, 0);
    controls.maxPolarAngle = Math.PI / 2.2;

    // 조명 — 부드럽고 따뜻하게
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dl = new THREE.DirectionalLight(0xffeedd, 0.8);
    dl.position.set(3, 5, 4); dl.castShadow = true;
    scene.add(dl);
    const pl1 = new THREE.PointLight(0xff88cc, 0.6, 10);
    pl1.position.set(-3, 3, 2);
    scene.add(pl1);
    const pl2 = new THREE.PointLight(0x8844ff, 0.4, 10);
    pl2.position.set(3, 2, -2);
    scene.add(pl2);

    // 바닥 — 반투명 원형 플랫폼
    const floor = new THREE.Mesh(
        new THREE.CylinderGeometry(3, 3.2, 0.1, 32),
        new THREE.MeshStandardMaterial({ color: 0x3d1f6d, roughness: 0.4, metalness: 0.1 })
    );
    floor.position.y = -0.05; floor.receiveShadow = true;
    scene.add(floor);

    // 저울 기둥
    const scaleRoot = new THREE.Group();
    scaleRoot.scale.set(0.8, 0.8, 0.8); // 20% 축소
    scene.add(scaleRoot);

    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.3, metalness: 0.5 });
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 2.5, 8), pillarMat);
    pillar.position.y = 1.25; pillar.castShadow = true;
    scaleRoot.add(pillar);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.15, 12), pillarMat);
    base.position.y = 0.075; base.castShadow = true;
    scaleRoot.add(base);

    // 저울 구조 — 접시를 빔의 자식으로!
    const beamMat = new THREE.MeshStandardMaterial({ color: 0xa78bfa, roughness: 0.2, metalness: 0.5 });
    const panMat = new THREE.MeshStandardMaterial({ color: 0xc4b5fd, roughness: 0.2, metalness: 0.3 });
    const beamGroup = new THREE.Group();
    beamGroup.position.y = 2.5;
    scaleRoot.add(beamGroup);

    const beam = new THREE.Mesh(new THREE.BoxGeometry(4, 0.08, 0.12), beamMat);
    beam.castShadow = true;
    beamGroup.add(beam);

    // 접시를 빔 그룹의 자식으로 → 빔 기울면 접시도 같이!
    const panL = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.5, 0.08, 16), panMat);
    panL.position.set(-1.8, -0.08, 0); panL.castShadow = true;
    beamGroup.add(panL);
    const panR = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.5, 0.08, 16), panMat);
    panR.position.set(1.8, -0.08, 0); panR.castShadow = true;
    beamGroup.add(panR);

    // 키로 유령 (로우폴리 — 구 + 원뿔 합체)
    const ghostMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    const ghostGroup = new THREE.Group();
    const ghostHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), ghostMat);
    ghostHead.position.y = 0.35;
    ghostGroup.add(ghostHead);
    const ghostBody = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.5, 8), ghostMat);
    ghostBody.position.y = -0.05; ghostBody.rotation.x = Math.PI;
    ghostGroup.add(ghostBody);
    // 눈
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), eyeMat);
    eyeL.position.set(-0.12, 0.38, 0.28);
    ghostGroup.add(eyeL);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), eyeMat);
    eyeR.position.set(0.12, 0.38, 0.28);
    ghostGroup.add(eyeR);
    ghostGroup.castShadow = true;
    ghostGroup.position.set(-1.8, 0.5, 0);
    beamGroup.add(ghostGroup);

    // 배경 장식 — 떠다니는 로우폴리 도형들
    const decoMat1 = new THREE.MeshStandardMaterial({ color: 0xff88cc, roughness: 0.4, metalness: 0.2 });
    const decoMat2 = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.4, metalness: 0.2 });
    const decoMat3 = new THREE.MeshStandardMaterial({ color: 0xffcc88, roughness: 0.4, metalness: 0.2 });
    const decos = [];
    for (let i = 0; i < 12; i++) {
        const geos = [new THREE.IcosahedronGeometry(0.15, 0), new THREE.OctahedronGeometry(0.12, 0), new THREE.TorusGeometry(0.1, 0.04, 6, 8)];
        const mats = [decoMat1, decoMat2, decoMat3];
        const mesh = new THREE.Mesh(geos[i % 3], mats[i % 3]);
        mesh.position.set((Math.random()-0.5)*8, 0.5 + Math.random()*4, (Math.random()-0.5)*6);
        scene.add(mesh);
        decos.push(mesh);
    }

    // 물건 데이터 + 3D
    const ITEMS = [
        { name:'깃털', weight:1, color:0xa78bfa, icon:'🪶' },
        { name:'구슬', weight:5, color:0xc4b5fd, icon:'🔮' },
        { name:'풍선', weight:2, color:0xfb923c, icon:'🎈' },
        { name:'나뭇가지', weight:3, color:0x92400e, icon:'🌿' },
        { name:'꽃', weight:2, color:0xf9a8d4, icon:'🌸' },
        { name:'별', weight:1, color:0xfde68a, icon:'⭐' },
        { name:'돌', weight:8, color:0xa8a29e, icon:'🪨' },
        { name:'도토리', weight:3, color:0xd97706, icon:'🌰' },
        { name:'클로버', weight:1, color:0x22c55e, icon:'🍀' },
        { name:'동전', weight:4, color:0xfbbf24, icon:'🪙' },
        { name:'열쇠', weight:6, color:0x9ca3af, icon:'🔑' },
    ];

    const KIRO_WEIGHT = 15 + Math.floor(Math.random() * 16);
    let placedWeight = 0;
    let placedMeshes = [];
    let placedItems = [];
    let chances = 10;

    // 트레이 UI
    const tray = document.getElementById('tray');
    ITEMS.forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'tray-item';
        el.innerHTML = `<span class="item-name">${item.name}</span><span style="font-size:20px;">${item.icon}</span><span style="font-size:8px;">${item.weight}g</span>`;
        el.onclick = () => addItem(i);
        tray.appendChild(el);
    });

    // 3D 아이템 모양 만들기 함수
    function createItemMesh(idx) {
        const group = new THREE.Group();
        switch(idx) {
            case 0: // 깃털 — 얇은 잎 모양
                const featherGeo = new THREE.PlaneGeometry(0.08, 0.35);
                const featherMat = new THREE.MeshStandardMaterial({ color: 0xa78bfa, side: THREE.DoubleSide, roughness: 0.5 });
                const feather = new THREE.Mesh(featherGeo, featherMat);
                feather.rotation.z = 0.2;
                group.add(feather);
                // 줄기
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.35, 4), new THREE.MeshStandardMaterial({ color: 0x666666 }));
                group.add(stem);
                break;
            case 1: // 유리구슬 — 투명한 구
                const marble = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 12), new THREE.MeshStandardMaterial({ color: 0xc4b5fd, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.8 }));
                group.add(marble);
                break;
            case 2: // 풍선 — 구 + 매듭 + 줄
                const balloon = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), new THREE.MeshStandardMaterial({ color: 0xfb923c, roughness: 0.4 }));
                balloon.position.y = 0.1;
                group.add(balloon);
                const knot = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.06, 6), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
                knot.position.y = -0.06;
                group.add(knot);
                const string = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.15, 4), new THREE.MeshStandardMaterial({ color: 0x888888 }));
                string.position.y = -0.14;
                group.add(string);
                break;
            case 3: // 나뭇가지 — Y자 막대
                const branchMat = new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.8 });
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, 0.3, 6), branchMat);
                group.add(trunk);
                const branchL = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.15, 5), branchMat);
                branchL.position.set(-0.05, 0.15, 0); branchL.rotation.z = 0.5;
                group.add(branchL);
                const branchR = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.12, 5), branchMat);
                branchR.position.set(0.04, 0.12, 0); branchR.rotation.z = -0.4;
                group.add(branchR);
                break;
            case 4: // 꽃 — 중앙 원 + 꽃잎 5개
                const petalMat = new THREE.MeshStandardMaterial({ color: 0xf9a8d4, roughness: 0.5 });
                const center = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), new THREE.MeshStandardMaterial({ color: 0xfbbf24 }));
                group.add(center);
                for (let p = 0; p < 5; p++) {
                    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), petalMat);
                    const angle = (p / 5) * Math.PI * 2;
                    petal.position.set(Math.cos(angle)*0.08, Math.sin(angle)*0.08, 0);
                    petal.scale.set(1, 1, 0.4);
                    group.add(petal);
                }
                break;
            case 5: // 별 — 뾰족한 형태
                const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.12, 0), new THREE.MeshStandardMaterial({ color: 0xfde68a, roughness: 0.3, metalness: 0.3 }));
                star.scale.set(1, 1.3, 0.5);
                group.add(star);
                break;
            case 6: // 돌 — 울퉁불퉁한 구
                const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.16, 0), new THREE.MeshStandardMaterial({ color: 0xa8a29e, roughness: 0.9 }));
                rock.scale.set(1.2, 0.8, 1);
                group.add(rock);
                break;
            case 7: // 도토리 — 모자 + 몸통
                const acornBody = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.6 }));
                acornBody.scale.y = 1.3;
                group.add(acornBody);
                const acornCap = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 4, 0, Math.PI*2, 0, Math.PI*0.5), new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.7 }));
                acornCap.position.y = 0.08;
                group.add(acornCap);
                break;
            case 8: // 클로버 — 잎 3개 + 줄기
                const leafMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.5 });
                for (let l = 0; l < 3; l++) {
                    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), leafMat);
                    const a = (l / 3) * Math.PI * 2 - Math.PI/2;
                    leaf.position.set(Math.cos(a)*0.06, 0.06 + Math.sin(a)*0.06, 0);
                    leaf.scale.set(1, 1, 0.4);
                    group.add(leaf);
                }
                const cloverStem = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.15, 4), new THREE.MeshStandardMaterial({ color: 0x15803d }));
                cloverStem.position.y = -0.08;
                group.add(cloverStem);
                break;
            case 9: // 동전 — 납작 원통
                const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.02, 16), new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.2, metalness: 0.7 }));
                group.add(coin);
                break;
            case 10: // 열쇠 — 고리 + 막대
                const keyMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.3, metalness: 0.6 });
                const keyRing = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.015, 8, 12), keyMat);
                keyRing.position.y = 0.1;
                group.add(keyRing);
                const keyShaft = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.2, 0.01), keyMat);
                keyShaft.position.y = -0.02;
                group.add(keyShaft);
                const keyTooth = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.02, 0.01), keyMat);
                keyTooth.position.set(0.02, -0.1, 0);
                group.add(keyTooth);
                break;
        }
        group.scale.set(0.8, 0.8, 0.8);
        return group;
    }

    function addItem(idx) {
        if (chances <= 0) return;
        chances--;
        document.getElementById('chancesText').textContent = '기회: ' + chances;

        const item = ITEMS[idx];
        placedWeight += item.weight;
        placedItems.push(idx);

        const mesh = createItemMesh(idx);
        const row = Math.floor(placedMeshes.length / 4);
        const col = placedMeshes.length % 4;
        mesh.position.set(1.8 + (col - 1.5) * 0.3, 0.15 + row * 0.35, (Math.random()-0.5)*0.2);
        beamGroup.add(mesh);
        placedMeshes.push(mesh);

        updateScale();
    }

    // 클릭으로 빼기 (raycaster)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    renderer.domElement.addEventListener('click', (e) => {
        mouse.x = (e.clientX / innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(placedMeshes);
        if (hits.length > 0) {
            const mesh = hits[0].object;
            const idx = placedMeshes.indexOf(mesh);
            if (idx >= 0) {
                beamGroup.remove(mesh);
                placedWeight -= ITEMS[placedItems[idx]].weight;
                placedMeshes.splice(idx, 1);
                placedItems.splice(idx, 1);
                placedMeshes.forEach((m, i) => {
                    const row = Math.floor(i / 4);
                    const col = i % 4;
                    m.position.x = 1.8 + (col - 1.5) * 0.22;
                    m.position.y = 0.05 + row * 0.25;
                });
                updateScale();
            }
        }
    });

    let targetAngle = Math.max(-0.15, Math.min(0.15, KIRO_WEIGHT * 0.008)); // 시작 시 키로 쪽 기울어짐
    beamGroup.rotation.z = targetAngle; // 즉시 적용

    function updateScale() {
        document.getElementById('weightText').textContent = placedWeight + 'g';
        const diff = KIRO_WEIGHT - placedWeight;
        const s = document.getElementById('statusText');
        if (diff > 5) s.textContent = '아직 가벼워요';
        else if (diff > 0) s.textContent = '거의 다!';
        else if (diff === 0) s.textContent = '완벽!';
        else s.textContent = '너무 무거워요';

        // 목표 각도 설정 (애니메이션에서 lerp)
        targetAngle = Math.max(-0.15, Math.min(0.15, (KIRO_WEIGHT - placedWeight) * 0.008));
    }

    // 답 제출
    document.getElementById('guessBtn').onclick = () => {
        const guess = parseInt(document.getElementById('guessInput').value);
        if (isNaN(guess)) return;
        const diff = Math.abs(guess - KIRO_WEIGHT);
        const t = document.getElementById('rTitle');
        const p = document.getElementById('rText');
        if (diff === 0) { t.textContent = '정답!'; p.textContent = `키로: 정확히 ${KIRO_WEIGHT}g!`; }
        else if (diff <= 2) { t.textContent = '거의 맞았어요!'; p.textContent = `키로: ${KIRO_WEIGHT}g (${diff}g 차이)`; }
        else if (diff <= 5) { t.textContent = '아쉬워요!'; p.textContent = `키로: ${KIRO_WEIGHT}g / 입력: ${guess}g (${diff}g 차이)`; }
        else { t.textContent = '많이 차이나요'; p.textContent = `키로: ${KIRO_WEIGHT}g / 입력: ${guess}g (${diff}g 차이)`; }
        document.getElementById('result').classList.add('show');
    };

    let ghostTime = 0;
    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // 부드러운 기울기 (lerp)
        beamGroup.rotation.z += (targetAngle - beamGroup.rotation.z) * 0.05;

        // 키로 유령 둥둥
        ghostTime += 0.02;
        ghostGroup.position.y = 0.5 + Math.sin(ghostTime) * 0.05;
        ghostGroup.rotation.y = Math.sin(ghostTime * 0.5) * 0.2;

        // 물건들 살짝 회전
        placedMeshes.forEach((m, i) => { m.rotation.y += 0.005 + i * 0.001; });
        // 배경 장식 둥둥
        decos.forEach((d, i) => {
            d.rotation.x += 0.003 + i * 0.001;
            d.rotation.y += 0.005;
            d.position.y += Math.sin(ghostTime + i) * 0.002;
        });
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
    </script>
