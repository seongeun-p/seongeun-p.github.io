<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Corner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f8f8f6; min-height: 100vh; font-family: -apple-system, 'Helvetica Neue', sans-serif; color: #222; }
        .back-btn { position: fixed; top: 20px; left: 20px; z-index: 100; color: #222; text-decoration: none; font-size: 20px; font-weight: 300; opacity: 0.4; }
        .back-btn:hover { opacity: 1; }

        /* 헤더 */
        .header { padding: 80px 40px 40px; max-width: 900px; margin: 0 auto; }
        .header h1 { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #999; margin-bottom: 16px; }
        .header p { font-size: 14px; color: #666; line-height: 1.7; max-width: 500px; }

        /* 카테고리 네비 */
        .category-nav { padding: 0 40px 30px; max-width: 900px; margin: 0 auto; display: flex; gap: 20px; }
        .category-nav a { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #aaa; text-decoration: none; padding-bottom: 4px; border-bottom: 1px solid transparent; transition: all 0.2s; cursor: pointer; }
        .category-nav a.active { color: #222; border-bottom-color: #222; }
        .category-nav a:hover { color: #222; }

        /* 그리드 */
        .grid { padding: 0 40px 80px; max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 24px; }

        /* 아이템 */
        .item { position: relative; cursor: pointer; perspective: 600px; }
        .item-inner { width: 100%; aspect-ratio: 2/3; position: relative; transform-style: preserve-3d; transition: transform 0.6s ease; }
        .item:hover .item-inner { transform: rotateY(180deg); }

        /* 책등 (앞면) */
        .item-spine { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: mixed; font-size: 11px; font-weight: 500; color: #333; letter-spacing: 0.5px; padding: 12px 6px; overflow: hidden; border-radius: 2px; }

        /* 표지 (뒷면) */
        .item-cover { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; transform: rotateY(180deg); overflow: hidden; border-radius: 2px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .item-cover img { width: 100%; height: 100%; object-fit: cover; }

        .item-info { margin-top: 10px; opacity: 0; transform: translateY(4px); transition: opacity 0.3s, transform 0.3s; }
        .item:hover .item-info { opacity: 1; transform: translateY(0); }
        .item-title { font-size: 11px; font-weight: 500; color: #333; line-height: 1.4; }
        .item-type { font-size: 9px; color: #aaa; margin-top: 3px; text-transform: uppercase; letter-spacing: 1px; }

        .item-cover .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #ddd; font-size: 10px; color: #888; padding: 10px; text-align: center; }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&lt;</a>

    <div class="header">
        <h1>Book Corner</h1>
        <p>An ever-evolving collection of books, films, and animations I've experienced — in no particular order.</p>
    </div>

    <div class="category-nav" id="nav">
        <a data-cat="all" class="active">All</a>
        <a data-cat="book">Book</a>
        <a data-cat="movie">Film</a>
        <a data-cat="anime">Animation</a>
    </div>

    <div class="grid" id="grid"></div>

    <script>
    const ITEMS = [
        { title: '탐나는 현대미술', type: 'book', cover: 'https://image.yes24.com/goods/90432858/XL' },
        { title: '긴키 지방의 어느 장소에 대하여', type: 'book', cover: 'https://image.yes24.com/goods/108859702/XL' },
        { title: '지구 끝의 온실', type: 'book', cover: 'https://image.yes24.com/goods/99057498/XL' },
        { title: '아무도 오지 않는 곳에서', type: 'book', cover: 'https://image.yes24.com/goods/108055069/XL' },
        { title: '채식주의자', type: 'book', cover: 'https://image.yes24.com/goods/8150824/XL' },
        { title: '이듬해 봄', type: 'book', cover: 'https://image.yes24.com/goods/116573498/XL' },
        { title: '개인주의자 선언', type: 'book', cover: 'https://image.yes24.com/goods/23280830/XL' },
        { title: '호프', type: 'movie', cover: 'https://image.tmdb.org/t/p/w500/vKDUmKO6F9bBKpIpMXrmHSfMfSu.jpg' },
        { title: '약사의 혼자말', type: 'anime', cover: 'https://image.tmdb.org/t/p/w500/f2mMiWfVfR8YwNEhMnbqfrFhC0r.jpg' },
        { title: '나의 히어로 아카데미아', type: 'anime', cover: 'https://image.tmdb.org/t/p/w500/ivOLM47yJt90P19RH1NvJrAJz9F.jpg' },
    ];

    const TYPE_LABELS = { book: 'Book', movie: 'Film', anime: 'Animation' };
    const grid = document.getElementById('grid');
    let currentCat = 'all';

    const SPINE_COLORS = ['#e8e8e8','#d0d0d0','#c0c0c0','#b0b0b0','#ddd','#eee','#ccc','#bbb','#e0e0e0','#f0f0f0'];

    function renderGrid(cat) {
        grid.innerHTML = '';
        const filtered = cat === 'all' ? ITEMS : ITEMS.filter(i => i.type === cat);
        filtered.forEach((item, idx) => {
            const el = document.createElement('div');
            el.className = 'item';
            const spineColor = SPINE_COLORS[idx % SPINE_COLORS.length];
            el.innerHTML = `
                <div class="item-inner">
                    <div class="item-spine" style="background:${spineColor};">
                        ${item.title}
                    </div>
                    <div class="item-cover">
                        <img src="${item.cover}" alt="${item.title}" onerror="this.parentElement.innerHTML='<div class=placeholder>${item.title}</div>'">
                    </div>
                </div>
                <div class="item-info">
                    <div class="item-title">${item.title}</div>
                    <div class="item-type">${TYPE_LABELS[item.type]}</div>
                </div>
            `;
            grid.appendChild(el);
        });
    }

    // 네비 클릭
    document.getElementById('nav').addEventListener('click', (e) => {
        if (e.target.dataset.cat) {
            currentCat = e.target.dataset.cat;
            document.querySelectorAll('.category-nav a').forEach(a => a.classList.remove('active'));
            e.target.classList.add('active');
            renderGrid(currentCat);
        }
    });

    renderGrid('all');
    </script>
</body>
</html>
