<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shelf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; min-height: 100vh; font-family: -apple-system, sans-serif; color: #222; padding: 40px 20px; }
        .back-btn { position: fixed; top: 14px; left: 14px; z-index: 100; color: #333; text-decoration: none; font-size: 22px; font-weight: 300; opacity: 0.5; }
        .back-btn:hover { opacity: 1; }

        h1 { text-align: center; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: rgba(0,0,0,0.3); margin-bottom: 40px; }

        .shelf-section { margin-bottom: 50px; }
        .shelf-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(0,0,0,0.35); margin-bottom: 14px; padding-left: 10px; }

        .bookshelf { display: flex; align-items: flex-end; gap: 6px; padding: 0 10px 12px; position: relative; flex-wrap: wrap; }
        .bookshelf::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 10px; background: #e8e8e8; border-radius: 2px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

        /* 책 한 권 */
        .book { width: 36px; height: 180px; perspective: 400px; cursor: pointer; position: relative; z-index: 1; }
        .book:hover { z-index: 10; }

        .book-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s ease; transform-origin: left center; }
        .book:hover .book-inner { transform: rotateY(-70deg); }

        /* 책등 (spine) */
        .book-spine { position: absolute; width: 36px; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 2px 0 0 2px; writing-mode: vertical-rl; text-orientation: mixed; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; padding: 8px 2px; overflow: hidden; text-overflow: ellipsis; backface-visibility: hidden; }

        /* 표지 (cover) */
        .book-cover { position: absolute; width: 120px; height: 100%; transform: rotateY(90deg); transform-origin: left center; border-radius: 0 2px 2px 0; overflow: hidden; backface-visibility: hidden; box-shadow: 4px 4px 12px rgba(0,0,0,0.4); }
        .book-cover img { width: 100%; height: 100%; object-fit: cover; }

        /* 카테고리 태그 */
        .book-tag { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 8px; color: rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
        .book:hover .book-tag { opacity: 1; }

        /* 반응형 */
        @media (max-width: 600px) {
            .book { width: 30px; height: 150px; }
            .book-cover { width: 100px; }
        }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&lt;</a>
    <h1>My Shelf</h1>

    <div class="shelf-section">
        <div class="shelf-label">Book</div>
        <div class="bookshelf" id="shelfBook"></div>
    </div>
    <div class="shelf-section">
        <div class="shelf-label">Movie</div>
        <div class="bookshelf" id="shelfMovie"></div>
    </div>
    <div class="shelf-section">
        <div class="shelf-label">Animation</div>
        <div class="bookshelf" id="shelfAnime"></div>
    </div>

    <script>
    const ITEMS = [
        { title: '탐나는 현대미술', type: 'book', color: '#e0e0e0', textColor: '#333', cover: 'https://image.yes24.com/goods/90432858/XL' },
        { title: '긴키 지방의 어느 장소에 대하여', type: 'book', color: '#888', textColor: '#fff', cover: 'https://image.yes24.com/goods/108859702/XL' },
        { title: '지구 끝의 온실', type: 'book', color: '#555', textColor: '#ddd', cover: 'https://image.yes24.com/goods/99057498/XL' },
        { title: '아무도 오지 않는 곳에서', type: 'book', color: '#333', textColor: '#ccc', cover: 'https://image.yes24.com/goods/108055069/XL' },
        { title: '채식주의자', type: 'book', color: '#aaa', textColor: '#222', cover: 'https://image.yes24.com/goods/8150824/XL' },
        { title: '이듬해 봄', type: 'book', color: '#f0f0f0', textColor: '#444', cover: 'https://image.yes24.com/goods/116573498/XL' },
        { title: '개인주의자 선언', type: 'book', color: '#222', textColor: '#eee', cover: 'https://image.yes24.com/goods/23280830/XL' },
        { title: '호프', type: 'movie', color: '#666', textColor: '#fff', cover: 'https://image.tmdb.org/t/p/w500/vKDUmKO6F9bBKpIpMXrmHSfMfSu.jpg' },
        { title: '약사의 혼자말', type: 'anime', color: '#444', textColor: '#ddd', cover: 'https://image.tmdb.org/t/p/w500/f2mMiWfVfR8YwNEhMnbqfrFhC0r.jpg' },
        { title: '나의 히어로 아카데미아', type: 'anime', color: '#777', textColor: '#fff', cover: 'https://image.tmdb.org/t/p/w500/ivOLM47yJt90P19RH1NvJrAJz9F.jpg' },
    ];

    const TYPE_LABELS = { book: '책', movie: '영화', anime: '애니' };

    function renderShelf(containerId, items) {
        const shelf = document.getElementById(containerId);
        items.forEach(item => {
            const book = document.createElement('div');
            book.className = 'book';
            const height = 160 + Math.random() * 40;
            book.style.height = height + 'px';
            book.innerHTML = `
                <div class="book-tag">${item.title}</div>
                <div class="book-inner">
                    <div class="book-spine" style="background:${item.color}; color:${item.textColor};">
                        ${item.title.length > 12 ? item.title.slice(0,12)+'…' : item.title}
                    </div>
                    <div class="book-cover">
                        <img src="${item.cover}" alt="${item.title}" loading="lazy">
                    </div>
                </div>
            `;
            shelf.appendChild(book);
        });
    }

    renderShelf('shelfBook', ITEMS.filter(i => i.type === 'book'));
    renderShelf('shelfMovie', ITEMS.filter(i => i.type === 'movie'));
    renderShelf('shelfAnime', ITEMS.filter(i => i.type === 'anime'));
    </script>
</body>
</html>
