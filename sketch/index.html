<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Typography</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; min-height: 100vh; font-family: Helvetica, Arial, sans-serif; overflow-x: hidden; }
        .back-btn { position: fixed; top: 14px; left: 14px; z-index: 200; color: #333; text-decoration: none; font-size: 22px; font-weight: 300; opacity: 0.5; }
        .back-btn:hover { opacity: 1; }

        /* 인트로 */
        .intro { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .marquee-path { position: absolute; width: 100%; height: 100%; }
        .marquee-text { font-size: 48px; font-weight: 900; letter-spacing: 8px; }
        .intro-center { z-index: 10; text-align: center; }
        .intro-center p { font-size: 13px; color: #888; margin-bottom: 20px; }
        .intro-btn { padding: 12px 28px; background: #111; color: #fff; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: Helvetica, sans-serif; }
        .intro-btn:hover { background: #333; }

        /* SVG 마키 */
        .marquee-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .marquee-letter { font-family: Helvetica, Arial, sans-serif; font-weight: 900; font-size: 12000px; fill: #000; }

        /* 메인 */
        .main { display: none; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100vh; }
        .main.show { display: flex; }
        .upload-area { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 9px 18px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #222; background: #fff; color: #222; }
        .btn:hover { background: #222; color: #fff; }
        #fileInput { display: none; }
        .camera-view { display: none; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
        .camera-view.show { display: flex; }
        .camera-view video { max-width: 50vw; max-height: 40vh; }
        .snap-btn { padding: 9px 20px; background: #222; color: #fff; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .loading { display: none; font-size: 12px; color: #888; margin: 12px; }
        .loading.show { display: block; }

        /* 결과물 */
        .result-area { margin: 20px 0; display: flex; gap: 16px; align-items: flex-start; }
        .result-area canvas { max-width: 38vw; max-height: 55vh; border: 1px solid #eee; display: none; }

        /* 히스토리 */
        .history { margin-top: 40px; width: 100%; max-width: 700px; }
        .history h3 { font-size: 12px; color: #999; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; }
        .history-list { display: flex; gap: 10px; flex-wrap: wrap; }
        .history-item { width: 80px; height: 80px; border: 1px solid #eee; cursor: pointer; position: relative; }
        .history-item img { width: 100%; height: 100%; object-fit: cover; }
        .history-item .dl { position: absolute; bottom: 2px; right: 2px; font-size: 9px; background: #111; color: #fff; padding: 2px 4px; border-radius: 2px; text-decoration: none; }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&lt;</a>

    <!-- 인트로 -->
    <div class="intro" id="intro">
        <svg class="marquee-container" viewBox="0 0 300000 20000" preserveAspectRatio="xMidYMid slice">
            <defs>
                <path id="path2" d="M -20000,10000 Q 75000,5000 150000,10000 T 320000,10000" fill="none"/>
            </defs>
            <text class="marquee-letter">
                <textPath href="#path2" id="tp2">F A K E T Y P O G R A P H Y</textPath>
            </text>
        </svg>
        <div class="intro-center">
            <p>사진 속 형태를 알파벳으로 해석합니다</p>
            <button class="intro-btn" id="startBtn">START →</button>
        </div>
    </div>

    <!-- 메인 -->
    <div class="main" id="main">
        <div class="upload-area">
            <button class="btn" id="uploadBtn">Upload</button>
            <button class="btn" id="cameraBtn">Camera</button>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="camera-view" id="cameraView">
            <video id="video" autoplay playsinline></video>
            <button class="snap-btn" id="snapBtn">Capture</button>
        </div>
        <div class="loading" id="loading">Processing...</div>
        <div class="result-area">
            <canvas id="originalCanvas"></canvas>
            <canvas id="output"></canvas>
        </div>
        <div class="history" id="history">
            <h3>Recent</h3>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
    // 마키 애니메이션
    let offset2 = 0;
    function animateMarquee() {
        offset2 -= 30;
        document.getElementById('tp2').setAttribute('startOffset', offset2);
        requestAnimationFrame(animateMarquee);
    }
    animateMarquee();

    // 인트로 → 메인
    document.getElementById('startBtn').onclick = () => {
        document.getElementById('intro').style.display = 'none';
        document.getElementById('main').classList.add('show');
    };

    // 파일/카메라
    const fileInput = document.getElementById('fileInput');
    const cameraView = document.getElementById('cameraView');
    const video = document.getElementById('video');
    const outputCanvas = document.getElementById('output');
    const loading = document.getElementById('loading');
    const historyList = document.getElementById('historyList');
    let history = [];

    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    fileInput.onchange = (e) => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (ev) => loadImage(ev.target.result); r.readAsDataURL(f); };
    document.getElementById('cameraBtn').onclick = async () => { const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); video.srcObject = s; cameraView.classList.add('show'); };
    document.getElementById('snapBtn').onclick = () => { const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video,0,0); video.srcObject.getTracks().forEach(t=>t.stop()); cameraView.classList.remove('show'); loadImage(c.toDataURL('image/jpeg')); };

    function loadImage(src) {
        loading.classList.add('show');
        const img = new Image();
        img.onload = () => {
            const maxSize = 600;
            let w = img.width, h = img.height;
            if (w > maxSize || h > maxSize) { const r = Math.min(maxSize/w, maxSize/h); w = Math.floor(w*r); h = Math.floor(h*r); }
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w; tempCanvas.height = h;
            tempCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
            // 원본 표시
            const origCanvas = document.getElementById('originalCanvas');
            origCanvas.width = w; origCanvas.height = h;
            origCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
            origCanvas.style.display = 'block';
            processImage(tempCanvas.getContext('2d').getImageData(0,0,w,h), w, h);
            loading.classList.remove('show');
        };
        img.src = src;
    }

    function processImage(imageData, w, h) {
        const src = imageData.data;
        outputCanvas.width = w; outputCanvas.height = h;
        outputCanvas.style.display = 'block';
        const ctx = outputCanvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);

        // 그레이스케일 + 엣지
        const gray = new Uint8Array(w*h);
        for (let i = 0; i < w*h; i++) { const idx = i*4; gray[i] = Math.round(src[idx]*0.299+src[idx+1]*0.587+src[idx+2]*0.114); }
        const edges = new Float32Array(w*h);
        for (let y = 1; y < h-1; y++) {
            for (let x = 1; x < w-1; x++) {
                const idx = y*w+x;
                const gx = -gray[(y-1)*w+(x-1)]+gray[(y-1)*w+(x+1)]-2*gray[y*w+(x-1)]+2*gray[y*w+(x+1)]-gray[(y+1)*w+(x-1)]+gray[(y+1)*w+(x+1)];
                const gy = -gray[(y-1)*w+(x-1)]-2*gray[(y-1)*w+x]-gray[(y-1)*w+(x+1)]+gray[(y+1)*w+(x-1)]+2*gray[(y+1)*w+x]+gray[(y+1)*w+(x+1)];
                edges[idx] = Math.sqrt(gx*gx+gy*gy);
            }
        }

        // 피사체 바운딩
        const threshold = 50;
        let minX=w, minY=h, maxX=0, maxY=0, cnt=0;
        for (let y=0;y<h;y++) for (let x=0;x<w;x++) { if(edges[y*w+x]>threshold){cnt++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;} }
        if (cnt < 20) return;

        const bw=maxX-minX, bh=maxY-minY, bcx=minX+bw/2, bcy=minY+bh/2;
        const aspectRatio = bw/(bh||1);

        // 중앙 빈 정도
        let centerEdge=0, ts=0;
        for(let y=bcy-bh*0.2;y<bcy+bh*0.2;y+=3) for(let x=bcx-bw*0.2;x<bcx+bw*0.2;x+=3) { if(x>=0&&x<w&&y>=0&&y<h){ts++;if(edges[Math.floor(y)*w+Math.floor(x)]>threshold)centerEdge++;} }
        const centerRatio = ts>0 ? centerEdge/ts : 0;

        // 상하좌우
        let top=0,bottom=0,left=0,right=0;
        for(let y=minY;y<=maxY;y+=3) for(let x=minX;x<=maxX;x+=3) { if(edges[y*w+x]>threshold){if(y<bcy)top++;else bottom++;if(x<bcx)left++;else right++;} }

        // 알파벳
        let letter;
        if (aspectRatio<0.35) letter='I';
        else if (aspectRatio>3) letter='~';
        else if (centerRatio<0.08&&aspectRatio>0.6&&aspectRatio<1.5) letter='O';
        else if (top>bottom*2) letter=['T','Y','V'][Math.floor(Math.random()*3)];
        else if (bottom>top*2) letter=['A','U','L'][Math.floor(Math.random()*3)];
        else if (left>right*1.8) letter=['C','J','G'][Math.floor(Math.random()*3)];
        else if (right>left*1.8) letter=['P','F','7'][Math.floor(Math.random()*3)];
        else if (aspectRatio>1.3) letter=['W','M','m'][Math.floor(Math.random()*3)];
        else letter=['X','H','K','N','R','B','S'][Math.floor(Math.random()*7)];

        // 큰 알파벳 — 비비드 랜덤 색상
        const VIVID_COLORS = ['#ff0055', '#00e5ff', '#76ff03', '#ff6d00', '#d500f9', '#00c853', '#2979ff', '#ff1744', '#ffea00', '#00bfa5'];
        const resultColor = VIVID_COLORS[Math.floor(Math.random() * VIVID_COLORS.length)];
        
        // 70% 흰바탕+색글자, 30% 색바탕+흰글자
        const invertMode = Math.random() < 0.3;
        if (invertMode) {
            ctx.fillStyle = resultColor;
            ctx.fillRect(0, 0, w, h);
        }

        const fontSize = Math.max(bw, bh) * 1.0;
        ctx.font = `bold ${fontSize}px Helvetica, Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = invertMode ? '#fff' : resultColor;
        ctx.fillText(letter, bcx, bcy);

        // 메타 텍스트 — 반전 모드면 흰색, 아니면 검정
        const metaColor = invertMode ? '#fff' : '#000';

        // 타이포 포스터 메타데이터 텍스트
        const now = new Date();
        const meta = [
            `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}  ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
            `Detected: "${letter}"  |  ${w}×${h}`,
            `Edge: ${(cnt/(w*h)*100).toFixed(1)}%  |  Ratio: ${aspectRatio.toFixed(2)}`,
            'FAKE TYPOGRAPHY',
        ];

        ctx.fillStyle = metaColor;
        ctx.textAlign = 'left';
        ctx.font = '10px Helvetica, Arial, sans-serif';
        meta.forEach((line, i) => {
            ctx.fillText(line, 12, h - 12 - (meta.length - 1 - i) * 14);
        });

        // 우상단에 큰 글자 반복 (작게)
        ctx.textAlign = 'right';
        ctx.font = '9px Helvetica, Arial, sans-serif';
        ctx.fillStyle = metaColor;
        ctx.fillText(`INTERPRETED AS "${letter}"`, w - 12, 20);
        ctx.fillText('seongeun-p.github.io/sketch', w - 12, 34);

        // 히스토리에 추가
        addToHistory(outputCanvas.toDataURL('image/png'));
    }

    function addToHistory(dataUrl) {
        history.unshift(dataUrl);
        if (history.length > 10) history.pop();
        renderHistory();
    }

    function renderHistory() {
        historyList.innerHTML = '';
        history.forEach((url, i) => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<img src="${url}"><a class="dl" href="${url}" download="fake-typo-${i}.png">↓</a>`;
            historyList.appendChild(div);
        });
    }
    </script>
</body>
</html>
