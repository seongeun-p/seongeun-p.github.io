<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Typography</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            min-height: 100vh;
            font-family: -apple-system, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .back-btn {
            position: fixed; top: 14px; left: 14px; z-index: 100;
            color: #333; text-decoration: none; font-size: 22px;
            font-weight: 300; opacity: 0.5;
        }
        .back-btn:hover { opacity: 1; }
        h1 { font-size: 18px; margin-bottom: 6px; color: #222; }
        .subtitle { font-size: 12px; color: #999; margin-bottom: 16px; }
        .upload-area { display: flex; gap: 10px; margin-bottom: 16px; }
        .btn {
            padding: 9px 18px; border-radius: 20px; font-size: 12px;
            font-weight: 600; cursor: pointer; border: none;
            background: #222; color: #fff;
        }
        .btn:hover { background: #444; }
        .btn.cam { background: #0984e3; }
        #fileInput { display: none; }
        .result { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 95vw; }
        .result canvas { max-width: 45vw; max-height: 70vh; border: 1px solid #eee; }
        #original, #output { display: none; }
        .camera-view { display: none; flex-direction: column; align-items: center; gap: 10px; }
        .camera-view.show { display: flex; }
        .camera-view video { max-width: 45vw; max-height: 50vh; border-radius: 4px; }
        .snap-btn { padding: 9px 20px; background: #e74c3c; color: #fff; border: none; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .loading { display: none; font-size: 12px; color: #888; margin: 12px; }
        .loading.show { display: block; }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&lt;</a>
    <h1>Fake Typography</h1>
    <div class="subtitle">사진을 올리면 가짜 글자로 바꿔줘요</div>
    <div class="upload-area">
        <button class="btn" id="uploadBtn">사진 올리기</button>
        <button class="btn cam" id="cameraBtn">카메라</button>
        <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="camera-view" id="cameraView">
        <video id="video" autoplay playsinline></video>
        <button class="snap-btn" id="snapBtn">촬영</button>
    </div>
    <div class="loading" id="loading">변환 중...</div>
    <div class="result">
        <canvas id="original"></canvas>
        <canvas id="output"></canvas>
    </div>

    <script>
    const fileInput = document.getElementById('fileInput');
    const cameraView = document.getElementById('cameraView');
    const video = document.getElementById('video');
    const originalCanvas = document.getElementById('original');
    const outputCanvas = document.getElementById('output');
    const loading = document.getElementById('loading');

    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => loadImage(ev.target.result);
        reader.readAsDataURL(file);
    };

    document.getElementById('cameraBtn').onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        cameraView.classList.add('show');
    };
    document.getElementById('snapBtn').onclick = () => {
        const c = document.createElement('canvas');
        c.width = video.videoWidth; c.height = video.videoHeight;
        c.getContext('2d').drawImage(video, 0, 0);
        video.srcObject.getTracks().forEach(t => t.stop());
        cameraView.classList.remove('show');
        loadImage(c.toDataURL('image/jpeg'));
    };

    function loadImage(src) {
        loading.classList.add('show');
        const img = new Image();
        img.onload = () => {
            const maxSize = 600;
            let w = img.width, h = img.height;
            if (w > maxSize || h > maxSize) {
                const r = Math.min(maxSize / w, maxSize / h);
                w = Math.floor(w * r); h = Math.floor(h * r);
            }
            originalCanvas.width = w; originalCanvas.height = h;
            const octx = originalCanvas.getContext('2d');
            octx.drawImage(img, 0, 0, w, h);
            originalCanvas.style.display = 'block';
            processImage(octx.getImageData(0, 0, w, h), w, h);
            loading.classList.remove('show');
        };
        img.src = src;
    }

    function processImage(imageData, w, h) {
        const src = imageData.data;
        outputCanvas.width = w; outputCanvas.height = h;
        outputCanvas.style.display = 'block';
        const ctx = outputCanvas.getContext('2d');

        // 배경 흰색
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);

        // 그레이스케일
        const gray = new Uint8Array(w * h);
        for (let i = 0; i < w * h; i++) {
            const idx = i * 4;
            gray[i] = Math.round(src[idx] * 0.299 + src[idx+1] * 0.587 + src[idx+2] * 0.114);
        }

        // Sobel 엣지
        const edges = new Float32Array(w * h);
        const angles = new Float32Array(w * h);
        for (let y = 1; y < h - 1; y++) {
            for (let x = 1; x < w - 1; x++) {
                const idx = y * w + x;
                const gx = -gray[(y-1)*w+(x-1)] + gray[(y-1)*w+(x+1)]
                         - 2*gray[y*w+(x-1)] + 2*gray[y*w+(x+1)]
                         - gray[(y+1)*w+(x-1)] + gray[(y+1)*w+(x+1)];
                const gy = -gray[(y-1)*w+(x-1)] - 2*gray[(y-1)*w+x] - gray[(y-1)*w+(x+1)]
                         + gray[(y+1)*w+(x-1)] + 2*gray[(y+1)*w+x] + gray[(y+1)*w+(x+1)];
                edges[idx] = Math.sqrt(gx * gx + gy * gy);
                angles[idx] = Math.atan2(gy, gx);
            }
        }

        // 글자 격자로 분할해서 그리기
        const cellSize = 28; // 한 "글자" 크기
        const padding = 4;
        const threshold = 40;

        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';

        for (let cy = 0; cy < h; cy += cellSize) {
            for (let cx = 0; cx < w; cx += cellSize) {
                // 셀 내부 엣지 포인트 수집
                const strokes = [];
                let lastX = -1, lastY = -1;
                let hasContent = false;

                // 셀 내부를 스캔해서 연결된 선 추출
                for (let sy = cy + padding; sy < Math.min(cy + cellSize - padding, h); sy += 2) {
                    for (let sx = cx + padding; sx < Math.min(cx + cellSize - padding, w); sx += 2) {
                        const idx = sy * w + sx;
                        if (edges[idx] > threshold) {
                            hasContent = true;
                            const angle = angles[idx];
                            const len = 3 + Math.random() * 4;
                            strokes.push({
                                x1: sx, y1: sy,
                                x2: sx + Math.cos(angle) * len,
                                y2: sy + Math.sin(angle) * len
                            });
                        }
                    }
                }

                if (!hasContent) continue;

                // 선분들을 연결해서 "글자처럼" 그리기
                ctx.beginPath();
                strokes.forEach((s, i) => {
                    if (i === 0 || Math.random() > 0.6) {
                        ctx.moveTo(s.x1, s.y1);
                    }
                    ctx.lineTo(s.x2, s.y2);
                    // 가끔 곡선으로 연결 (글자 느낌)
                    if (i < strokes.length - 1 && Math.random() > 0.4) {
                        const next = strokes[i + 1];
                        ctx.quadraticCurveTo(
                            (s.x2 + next.x1) / 2 + (Math.random() - 0.5) * 6,
                            (s.y2 + next.y1) / 2 + (Math.random() - 0.5) * 6,
                            next.x1, next.y1
                        );
                    }
                });
                ctx.stroke();

                // 셀 테두리 (살짝 보이게 — 글자 격자감)
                if (hasContent && Math.random() > 0.7) {
                    ctx.strokeStyle = 'rgba(0,0,0,0.03)';
                    ctx.strokeRect(cx, cy, cellSize, cellSize);
                    ctx.strokeStyle = '#111';
                }
            }
        }
    }
    </script>
</body>
</html>
