<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFO Abduction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: -apple-system, sans-serif;
        }
        .back-btn {
            position: fixed; top: 14px; left: 14px; z-index: 200;
            color: #fff; text-decoration: none; font-size: 22px;
            font-weight: 300; opacity: 0.6; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .back-btn:hover { opacity: 1; }

        .scene {
            width: 100%; height: 100%; position: relative;
            display: flex; align-items: flex-end; justify-content: center;
            transition: background 1s;
        }

        /* 바닥 */
        .ground {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 20%;
            background: #2a2a2a;
        }

        /* 캐릭터 */
        .character {
            position: absolute; bottom: 18%; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center;
            z-index: 10;
            transition: transform 2s ease-in;
        }
        .character.abducted {
            transform: translateX(-50%) translateY(-120vh);
        }

        .face-container {
            width: 100px; height: 100px;
            border-radius: 50%; overflow: hidden;
            border: 4px solid #333;
            background: #555;
        }
        .face-container video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1);
        }

        .body-svg {
            margin-top: -10px;
        }

        /* UFO */
        .ufo {
            position: absolute; top: -200px; left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            transition: top 2s ease-out;
        }
        .ufo.arrive {
            top: 10%;
        }
        .ufo.leave {
            top: -300px;
            transition: top 1.5s ease-in;
        }

        /* 빔 */
        .beam {
            position: absolute; top: 0; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            background: linear-gradient(180deg, rgba(150,255,150,0.6) 0%, rgba(150,255,150,0) 100%);
            z-index: 5;
            transition: width 0.8s, height 0.8s, opacity 0.5s;
            opacity: 0;
            clip-path: polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);
        }
        .beam.active {
            width: 200px; height: 70vh;
            opacity: 1;
            top: 15%;
        }
        .beam.off {
            opacity: 0;
        }

        /* 카운트다운 */
        .countdown {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px; font-weight: 900; color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 100; opacity: 0;
            transition: opacity 0.3s;
        }
        .countdown.show { opacity: 1; }

        /* 메시지 */
        .message {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px; font-weight: 700; color: #0f0;
            text-shadow: 0 0 20px rgba(0,255,0,0.5);
            z-index: 100; opacity: 0;
            font-family: 'Courier New', monospace;
            text-align: center;
        }
        .message.show { opacity: 1; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <a class="back-btn" href="../">&lt;</a>

    <div class="scene" id="scene">
        <div class="ground" id="ground"></div>

        <!-- UFO -->
        <div class="ufo" id="ufo">
            <svg width="160" height="80" viewBox="0 0 160 80">
                <!-- 돔 -->
                <ellipse cx="80" cy="35" rx="30" ry="25" fill="#aaa" stroke="#888" stroke-width="2"/>
                <ellipse cx="80" cy="35" rx="25" ry="20" fill="rgba(150,220,255,0.4)"/>
                <!-- 본체 -->
                <ellipse cx="80" cy="50" rx="70" ry="18" fill="#777" stroke="#555" stroke-width="2"/>
                <!-- 라이트 -->
                <circle cx="40" cy="50" r="5" fill="#ff0" opacity="0.8"/>
                <circle cx="60" cy="54" r="5" fill="#0f0" opacity="0.8"/>
                <circle cx="80" cy="56" r="5" fill="#ff0" opacity="0.8"/>
                <circle cx="100" cy="54" r="5" fill="#0f0" opacity="0.8"/>
                <circle cx="120" cy="50" r="5" fill="#ff0" opacity="0.8"/>
                <!-- 하단 -->
                <ellipse cx="80" cy="58" rx="25" ry="8" fill="#555"/>
            </svg>
        </div>

        <!-- 빔 -->
        <div class="beam" id="beam"></div>

        <!-- 캐릭터 -->
        <div class="character" id="character">
            <div class="face-container">
                <video id="faceVideo" autoplay playsinline muted></video>
            </div>
            <svg class="body-svg" width="80" height="120" viewBox="0 0 80 120">
                <!-- 몸통 -->
                <rect x="25" y="0" width="30" height="50" rx="8" fill="#3a7bd5"/>
                <!-- 팔 -->
                <rect x="5" y="5" width="18" height="40" rx="8" fill="#3a7bd5"/>
                <rect x="57" y="5" width="18" height="40" rx="8" fill="#3a7bd5"/>
                <!-- 바지 -->
                <rect x="25" y="48" width="14" height="45" rx="6" fill="#2c3e50"/>
                <rect x="41" y="48" width="14" height="45" rx="6" fill="#2c3e50"/>
                <!-- 신발 -->
                <rect x="22" y="90" width="18" height="12" rx="5" fill="#1a1a1a"/>
                <rect x="40" y="90" width="18" height="12" rx="5" fill="#1a1a1a"/>
            </svg>
        </div>
    </div>

    <div class="countdown" id="countdown"></div>
    <div class="message" id="message">ABDUCTED</div>

    <script>
    const scene = document.getElementById('scene');
    const ground = document.getElementById('ground');
    const ufo = document.getElementById('ufo');
    const beam = document.getElementById('beam');
    const character = document.getElementById('character');
    const countdown = document.getElementById('countdown');
    const message = document.getElementById('message');
    const faceVideo = document.getElementById('faceVideo');

    // 배경 팔레트
    const BACKGROUNDS = [
        { sky: 'linear-gradient(180deg, #0a0a2a 0%, #1a1a4a 50%, #2a2a3a 100%)', ground: '#1a1a1a' }, // 밤하늘
        { sky: 'linear-gradient(180deg, #ff7e5f 0%, #feb47b 50%, #ffbf69 100%)', ground: '#3a5a3a' }, // 석양
        { sky: 'linear-gradient(180deg, #2c3e50 0%, #4a6741 50%, #2d4a2d 100%)', ground: '#2a3a2a' }, // 숲 밤
        { sky: 'linear-gradient(180deg, #141e30 0%, #243b55 60%, #1a2a3a 100%)', ground: '#111' }, // 도시 밤
        { sky: 'linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%)', ground: '#1a1a2a' }, // 보라 밤
        { sky: 'linear-gradient(180deg, #000428 0%, #004e92 100%)', ground: '#0a1a0a' }, // 깊은 밤
    ];

    // 랜덤 배경 적용
    const bg = BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)];
    scene.style.background = bg.sky;
    ground.style.background = bg.ground;

    // 별 추가
    for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.style.cssText = `position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
            left:${Math.random()*100}%; top:${Math.random()*60}%; opacity:${0.3+Math.random()*0.7};`;
        scene.appendChild(star);
    }

    // 카메라 시작
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 200, height: 200 } });
            faceVideo.srcObject = stream;
        } catch (e) {
            console.log('카메라 접근 불가');
        }
    }
    startCamera();

    // 시퀀스 시작 (3초 카운트다운 후)
    let count = 3;
    setTimeout(() => {
        countdown.classList.add('show');
        countdown.textContent = count;

        const interval = setInterval(() => {
            count--;
            if (count > 0) {
                countdown.textContent = count;
            } else {
                clearInterval(interval);
                countdown.classList.remove('show');
                startAbduction();
            }
        }, 1000);
    }, 1500); // 카메라 로드 기다림

    function startAbduction() {
        // 1) UFO 등장
        ufo.classList.add('arrive');

        // 2) 2초 후 빔 켜짐
        setTimeout(() => {
            beam.classList.add('active');
        }, 2000);

        // 3) 3초 후 캐릭터 빨려 올라감
        setTimeout(() => {
            character.classList.add('abducted');
        }, 3500);

        // 4) 5.5초 후 빔 꺼짐
        setTimeout(() => {
            beam.classList.remove('active');
            beam.classList.add('off');
        }, 5500);

        // 5) 6초 후 UFO 떠남
        setTimeout(() => {
            ufo.classList.add('leave');
            ufo.classList.remove('arrive');
        }, 6000);

        // 6) 7초 후 메시지
        setTimeout(() => {
            message.classList.add('show');
        }, 7500);

        // 7) 10초 후 리셋
        setTimeout(() => {
            location.reload();
        }, 11000);
    }
    </script>
</body>
</html>
