<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 우산을 찾아라</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: #0a0a0a; cursor: none; user-select: none;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        .bracelet-info {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: #000; border: 3px solid #fff; padding: 8px 20px;
            color: #fff; font-size: 14px; display: flex; align-items: center; gap: 12px;
            font-family: 'Courier New', monospace; z-index: 200;
        }
        .bracelet-swatch { width: 24px; height: 24px; border: 2px solid #fff; }
        .chances-ui {
            position: fixed; top: 16px; right: 20px;
            color: #fff; font-size: 14px; z-index: 200;
            font-family: 'Courier New', monospace;
        }
        .chance-x { color: #e74c3c; font-size: 18px; margin-left: 4px; }
        .chance-o { color: #2ecc71; font-size: 18px; margin-left: 4px; }
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 900; opacity: 0;
            pointer-events: none; transition: opacity 0.3s;
        }
        .overlay-screen.show { opacity: 1; pointer-events: auto; cursor: default; }
        .overlay-screen h1 {
            font-family: 'Courier New', monospace; font-size: 48px;
            text-transform: uppercase; letter-spacing: 4px;
        }
        .overlay-screen p {
            font-family: 'Courier New', monospace; font-size: 16px;
            margin: 12px 0 24px; color: #aaa;
        }
        .overlay-screen button {
            font-family: 'Courier New', monospace; font-size: 16px;
            padding: 10px 28px; background: #000; color: #fff;
            border: 3px solid #fff; cursor: pointer;
        }
        .overlay-screen button:hover { background: #fff; color: #000; }
        #success-screen { background: rgba(0,0,0,0.85); }
        #success-screen h1 { color: #2ecc71; }
        #fail-screen { background: rgba(30,0,0,0.95); }
        #fail-screen h1 { color: #e74c3c; }
        .siren { animation: sirenFlash 0.15s infinite alternate; }
        @keyframes sirenFlash {
            0% { box-shadow: inset 0 0 200px rgba(255,0,0,0.4); }
            100% { box-shadow: inset 0 0 200px rgba(0,0,255,0.4); }
        }
        #handcuff-scene {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 400; display: none; background: #1a0000;
        }
        #handcuff-scene.show { display: block; }
        .instruction {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.5); font-size: 12px; z-index: 200;
            font-family: 'Courier New', monospace; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <canvas id="handcuff-scene"></canvas>
    <div class="bracelet-info">
        <span>MY BRACELET:</span>
        <div class="bracelet-swatch" id="swatch"></div>
    </div>
    <div class="chances-ui" id="chances">
        LIFE: <span class="chance-o">&#9679;</span><span class="chance-o">&#9679;</span>
    </div>
    <div class="instruction">Click the umbrella that matches your bracelet</div>
    <div class="overlay-screen" id="success-screen">
        <h1>CLEAR!</h1>
        <p>You found your umbrella.</p>
        <button onclick="location.reload()">RETRY</button>
    </div>
    <div class="overlay-screen" id="fail-screen">
        <h1>BUSTED!</h1>
        <p>That's not yours...</p>
        <button onclick="location.reload()">RETRY</button>
    </div>

    <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', () => { resize(); initGame(); });

    // 픽셀 크기
    const PX = 3;

    // 우산 팔레트 — 접힌 우산 몸통 색상+패턴
    const PALETTES = [
        { colors: ['#e74c3c','#c0392b','#ff6b6b'], pattern: 'solid' },
        { colors: ['#2980b9','#f1c40f','#2980b9'], pattern: 'hstripe' },
        { colors: ['#27ae60','#e74c3c','#27ae60'], pattern: 'vband' },
        { colors: ['#f39c12','#2c3e50','#f39c12'], pattern: 'hstripe' },
        { colors: ['#8e44ad','#1abc9c','#8e44ad'], pattern: 'diamond' },
        { colors: ['#c0392b','#ecf0f1','#c0392b'], pattern: 'hstripe' },
        { colors: ['#16a085','#f39c12','#e74c3c'], pattern: 'tricolor' },
        { colors: ['#d35400','#2ecc71','#d35400'], pattern: 'vband' },
        { colors: ['#2c3e50','#e74c3c','#f1c40f'], pattern: 'tricolor' },
        { colors: ['#1a1a1a','#333','#1a1a1a'], pattern: 'zigzag' },
        { colors: ['#3498db','#e74c3c','#f1c40f'], pattern: 'tricolor' },
        { colors: ['#e67e22','#3498db','#e67e22'], pattern: 'hstripe' },
        { colors: ['#27ae60','#f39c12','#27ae60'], pattern: 'diamond' },
        { colors: ['#e74c3c','#27ae60','#e74c3c'], pattern: 'vband' },
        { colors: ['#9b59b6','#f1c40f','#9b59b6'], pattern: 'hstripe' },
        { colors: ['#1abc9c','#e74c3c','#1abc9c'], pattern: 'diamond' },
        { colors: ['#2980b9','#2ecc71','#2980b9'], pattern: 'vband' },
        { colors: ['#e91e63','#00bcd4','#e91e63'], pattern: 'hstripe' },
        { colors: ['#ff5722','#4caf50','#ff5722'], pattern: 'tricolor' },
        { colors: ['#673ab7','#ff9800','#673ab7'], pattern: 'diamond' },
        { colors: ['#f44336','#2196f3','#ffeb3b'], pattern: 'tricolor' },
        { colors: ['#4caf50','#f44336','#4caf50'], pattern: 'hstripe' },
        { colors: ['#ff9800','#3f51b5','#ff9800'], pattern: 'vband' },
        { colors: ['#00bcd4','#e91e63','#00bcd4'], pattern: 'diamond' },
        { colors: ['#8bc34a','#ff5722','#8bc34a'], pattern: 'hstripe' },
        { colors: ['#e74c3c','#f1c40f','#2ecc71'], pattern: 'tricolor' },
        { colors: ['#3f51b5','#ff9800','#3f51b5'], pattern: 'vband' },
        { colors: ['#009688','#ff5722','#009688'], pattern: 'zigzag' },
        { colors: ['#795548','#ffc107','#795548'], pattern: 'hstripe' },
        { colors: ['#607d8b','#ff4081','#607d8b'], pattern: 'diamond' },
    ];

    // 손잡이 타입
    const HANDLES = ['j-hook', 'round', 'straight', 't-handle'];

    let umbrellas = [];
    let targetIdx = 0;
    let mouseX = 0, mouseY = 0;
    let hoveredIdx = -1;
    let wrongCount = 0;
    let gameOver = false;

    function initGame() {
        umbrellas = [];
        const count = 30;
        // 우산들이 걸리는 봉의 위치
        const rackY = H * 0.22;
        const rackLeft = W * 0.05;
        const rackRight = W * 0.95;
        const spacing = (rackRight - rackLeft) / count;

        const shuffled = [...PALETTES].sort(() => Math.random() - 0.5);

        for (let i = 0; i < count; i++) {
            const palette = shuffled[i];
            const handle = HANDLES[i % HANDLES.length];
            const x = rackLeft + (i + 0.5) * spacing;
            const bodyW = spacing * 0.7;
            const bodyH = H * 0.55 + (Math.random() * H * 0.08);
            const tilt = (Math.random() - 0.5) * 4; // 약간 기울기

            umbrellas.push({
                x, rackY, bodyW, bodyH, palette, handle, tilt,
                hovered: false, removed: false
            });
        }

        targetIdx = Math.floor(Math.random() * count);
        updateSwatch();
    }

    function updateSwatch() {
        const swatch = document.getElementById('swatch');
        const p = umbrellas[targetIdx].palette;
        if (p.pattern === 'solid') {
            swatch.style.background = p.colors[0];
        } else if (p.pattern === 'hstripe') {
            swatch.style.background = `repeating-linear-gradient(0deg, ${p.colors[0]} 0px, ${p.colors[0]} 4px, ${p.colors[1]} 4px, ${p.colors[1]} 8px)`;
        } else if (p.pattern === 'vband') {
            swatch.style.background = `linear-gradient(90deg, ${p.colors[0]} 33%, ${p.colors[1]} 33%, ${p.colors[1]} 66%, ${p.colors[2]} 66%)`;
        } else if (p.pattern === 'tricolor') {
            swatch.style.background = `linear-gradient(180deg, ${p.colors[0]} 33%, ${p.colors[1]} 33%, ${p.colors[1]} 66%, ${p.colors[2]} 66%)`;
        } else if (p.pattern === 'diamond' || p.pattern === 'zigzag') {
            swatch.style.background = `repeating-conic-gradient(${p.colors[0]} 0% 25%, ${p.colors[1]} 0% 50%) 50% / 8px 8px`;
        }
    }

    // 접힌 우산 몸통 패턴 그리기 (픽셀)
    function drawFoldedBody(x, y, w, h, palette, hovered) {
        const { colors, pattern } = palette;
        const px = PX;
        const cols = Math.floor(w / px);
        const rows = Math.floor(h / px);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let color;
                const py = r / rows;
                const px2 = c / cols;

                if (pattern === 'solid') {
                    // 접힌 주름 효과
                    const fold = Math.sin(px2 * Math.PI * 6);
                    color = fold > 0.3 ? colors[0] : colors[1] || darken(colors[0]);
                } else if (pattern === 'hstripe') {
                    const stripe = Math.floor(r / 4) % 3;
                    color = colors[stripe % colors.length];
                } else if (pattern === 'vband') {
                    const band = Math.floor(px2 * 3);
                    color = colors[band];
                } else if (pattern === 'tricolor') {
                    const band = Math.floor(py * 3);
                    color = colors[band];
                } else if (pattern === 'diamond') {
                    const d = (r + c) % 8 < 4;
                    color = d ? colors[0] : colors[1];
                } else if (pattern === 'zigzag') {
                    const z = (r + Math.floor(Math.sin(c * 0.5) * 3)) % 6 < 3;
                    color = z ? colors[0] : colors[1];
                } else {
                    color = colors[0];
                }

                // 접힌 주름 음영
                const foldShade = Math.sin(px2 * Math.PI * 5) * 0.15;
                ctx.fillStyle = shadeColor(color, foldShade);
                ctx.fillRect(x + c * px, y + r * px, px, px);
            }
        }

        // 호버 시 밝은 외곽선
        if (hovered) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 10;
            ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
            ctx.shadowBlur = 0;
        }
    }

    function darken(hex) {
        return shadeColor(hex, -0.3);
    }

    function shadeColor(color, percent) {
        let r = parseInt(color.slice(1,3), 16);
        let g = parseInt(color.slice(3,5), 16);
        let b = parseInt(color.slice(5,7), 16);
        r = Math.min(255, Math.max(0, Math.round(r * (1 + percent))));
        g = Math.min(255, Math.max(0, Math.round(g * (1 + percent))));
        b = Math.min(255, Math.max(0, Math.round(b * (1 + percent))));
        return `rgb(${r},${g},${b})`;
    }

    // 우산 그리기 (접힌 상태, 봉에 걸림)
    function drawUmbrella(u, idx) {
        if (u.removed) return;
        ctx.save();

        const cx = u.x;
        const topY = u.rackY + 15; // 봉 아래에서 시작
        const bw = u.bodyW;
        const bh = u.bodyH;

        // 약간 기울기
        ctx.translate(cx, topY);
        ctx.rotate(u.tilt * Math.PI / 180);
        ctx.translate(-cx, -topY);

        // 호버 시 살짝 위로 + 커짐
        if (u.hovered) {
            ctx.translate(0, -8);
            ctx.translate(cx, topY + bh/2);
            ctx.scale(1.06, 1.06);
            ctx.translate(-cx, -(topY + bh/2));
        }

        // 손잡이 (위쪽, 봉에 걸리는 부분)
        const handleColor = ['#8B4513','#D2691E','#A0522D','#CD853F'][idx % 4];
        ctx.strokeStyle = handleColor;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        if (u.handle === 'j-hook') {
            ctx.beginPath();
            ctx.arc(cx, u.rackY - 2, 10, 0, Math.PI);
            ctx.stroke();
        } else if (u.handle === 'round') {
            ctx.beginPath();
            ctx.arc(cx, u.rackY - 4, 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = handleColor;
            ctx.fill();
        } else if (u.handle === 'straight') {
            ctx.beginPath();
            ctx.moveTo(cx, u.rackY - 12);
            ctx.lineTo(cx, u.rackY + 5);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.moveTo(cx - 8, u.rackY - 6);
            ctx.lineTo(cx + 8, u.rackY - 6);
            ctx.moveTo(cx, u.rackY - 6);
            ctx.lineTo(cx, u.rackY + 5);
            ctx.stroke();
        }

        // 우산 상단 밴드 (묶음)
        ctx.fillStyle = '#222';
        ctx.fillRect(cx - bw/2, topY, bw, 6);
        ctx.fillRect(cx - bw/2, topY + bh - 8, bw, 6);

        // 접힌 우산 몸통
        drawFoldedBody(cx - bw/2, topY + 6, bw, bh - 14, u.palette, u.hovered);

        // 하단 팁
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.moveTo(cx - 3, topY + bh);
        ctx.lineTo(cx + 3, topY + bh);
        ctx.lineTo(cx, topY + bh + 12);
        ctx.fill();

        ctx.restore();
    }

    // 봉 (rack) 그리기
    function drawRack() {
        const rackY = H * 0.22;
        const rackLeft = W * 0.03;
        const rackRight = W * 0.97;

        // 메인 봉
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(rackLeft, rackY - 3, rackRight - rackLeft, 6);

        // 하이라이트
        ctx.fillStyle = '#A0522D';
        ctx.fillRect(rackLeft, rackY - 3, rackRight - rackLeft, 2);

        // 그림자
        ctx.fillStyle = '#5C3317';
        ctx.fillRect(rackLeft, rackY + 1, rackRight - rackLeft, 2);

        // 양쪽 지지대
        ctx.fillStyle = '#654321';
        ctx.fillRect(rackLeft, rackY - 20, 8, 40);
        ctx.fillRect(rackRight - 8, rackY - 20, 8, 40);
    }

    // 손 그리기
    function drawHand() {
        ctx.save();
        const hx = mouseX;
        const hy = mouseY + 40;

        // 팔
        ctx.fillStyle = '#d4956a';
        ctx.fillRect(hx - 12, hy, 24, H - hy + 20);
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.strokeRect(hx - 12, hy, 24, H - hy + 20);

        // 팔찌
        const tp = umbrellas[targetIdx].palette;
        ctx.save();
        ctx.beginPath();
        ctx.rect(hx - 14, hy + 16, 28, 12);
        ctx.clip();
        // 팔찌에 미니 패턴
        const bc = tp.colors;
        for (let i = 0; i < 28; i += PX) {
            const ci = Math.floor(i / (28 / bc.length)) % bc.length;
            ctx.fillStyle = bc[ci];
            ctx.fillRect(hx - 14 + i, hy + 16, PX, 12);
        }
        ctx.restore();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(hx - 14, hy + 16, 28, 12);

        // 손가락들 (위로 뻗음)
        const fingers = [
            { ox: -9, w: 7, h: 24 },
            { ox: -3, w: 7, h: 30 },
            { ox: 3, w: 7, h: 27 },
            { ox: 9, w: 6, h: 22 },
        ];
        fingers.forEach(f => {
            ctx.fillStyle = '#d4956a';
            ctx.fillRect(hx + f.ox, hy - f.h, f.w, f.h);
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(hx + f.ox, hy - f.h, f.w, f.h);
        });
        // 엄지
        ctx.fillStyle = '#d4956a';
        ctx.fillRect(hx - 16, hy - 16, 6, 16);
        ctx.strokeStyle = '#111';
        ctx.strokeRect(hx - 16, hy - 16, 6, 16);

        ctx.restore();
    }

    // 히트 테스트
    function getHoveredUmbrella(mx, my) {
        for (let i = umbrellas.length - 1; i >= 0; i--) {
            const u = umbrellas[i];
            if (u.removed) continue;
            const topY = u.rackY + 15;
            const halfW = u.bodyW / 2 + 6;
            if (mx > u.x - halfW && mx < u.x + halfW &&
                my > topY - 20 && my < topY + u.bodyH + 20) {
                return i;
            }
        }
        return -1;
    }

    // 경고
    let warningAlpha = 0;
    function showWarning() { warningAlpha = 1; }

    // 수갑 장면
    function drawHandcuffScene() {
        const hc = document.getElementById('handcuff-scene');
        hc.classList.add('show');
        hc.width = W; hc.height = H;
        const hctx = hc.getContext('2d');
        let frameCount = 0;

        function animateScene() {
            frameCount++;
            hctx.clearRect(0, 0, W, H);
            // 빨간 배경 깜빡임
            hctx.fillStyle = frameCount % 20 < 10 ? '#2a0000' : '#1a0000';
            hctx.fillRect(0, 0, W, H);

            const cx = W / 2;
            const cy = H / 2 + 20;
            const s = Math.min(W, H) * 0.0045;

            // 왼손
            drawBigHand(hctx, cx - 60*s, cy, s);
            // 오른손 (미러)
            hctx.save();
            hctx.translate(cx + 60*s, cy);
            hctx.scale(-1, 1);
            hctx.translate(-(cx + 60*s), -cy);
            drawBigHand(hctx, cx + 60*s, cy, s);
            hctx.restore();

            // 수갑
            hctx.fillStyle = '#777';
            hctx.fillRect(cx - 60*s - 12*s, cy + 25*s, 28*s, 14*s);
            hctx.strokeStyle = '#444'; hctx.lineWidth = 3;
            hctx.strokeRect(cx - 60*s - 12*s, cy + 25*s, 28*s, 14*s);
            hctx.fillStyle = '#777';
            hctx.fillRect(cx + 60*s - 16*s, cy + 25*s, 28*s, 14*s);
            hctx.strokeRect(cx + 60*s - 16*s, cy + 25*s, 28*s, 14*s);

            // 체인
            hctx.strokeStyle = '#888'; hctx.lineWidth = 3*s;
            hctx.setLineDash([5*s, 3*s]);
            hctx.beginPath();
            hctx.moveTo(cx - 45*s, cy + 32*s);
            hctx.quadraticCurveTo(cx, cy + 50*s, cx + 45*s, cy + 32*s);
            hctx.stroke();
            hctx.setLineDash([]);

            // BUSTED
            if (frameCount > 20) {
                hctx.fillStyle = '#e74c3c';
                hctx.font = `bold ${Math.floor(50*s)}px Courier New`;
                hctx.textAlign = 'center';
                hctx.shadowColor = '#ff0000'; hctx.shadowBlur = 20;
                hctx.fillText('BUSTED', cx, cy - 70*s);
                hctx.shadowBlur = 0;
            }

            if (frameCount < 100) requestAnimationFrame(animateScene);
            else document.getElementById('fail-screen').classList.add('show');
        }
        animateScene();
    }

    function drawBigHand(c, hx, hy, s) {
        // 팔
        c.fillStyle = '#d4956a';
        c.fillRect(hx - 14*s, hy, 28*s, 70*s);
        c.strokeStyle = '#111'; c.lineWidth = 2;
        c.strokeRect(hx - 14*s, hy, 28*s, 70*s);
        // 손바닥
        c.fillStyle = '#d4956a';
        c.fillRect(hx - 16*s, hy - 28*s, 32*s, 32*s);
        c.strokeRect(hx - 16*s, hy - 28*s, 32*s, 32*s);
        // 주먹 손가락
        const fw = 7*s, fh = 12*s;
        for (let i = 0; i < 4; i++) {
            const fx = hx - 14*s + i * 8*s;
            c.fillStyle = '#d4956a';
            c.fillRect(fx, hy - 28*s - fh, fw, fh);
            c.strokeRect(fx, hy - 28*s - fh, fw, fh);
        }
    }

    // 메인 렌더 루프
    function render() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, W, H);

        // 배경 텍스처 (미세 노이즈)
        ctx.fillStyle = 'rgba(255,255,255,0.01)';
        for (let i = 0; i < 200; i++) {
            ctx.fillRect(Math.random()*W, Math.random()*H, PX, PX);
        }

        // 봉
        drawRack();

        // 우산들
        hoveredIdx = getHoveredUmbrella(mouseX, mouseY);
        umbrellas.forEach((u, i) => {
            u.hovered = (i === hoveredIdx);
            drawUmbrella(u, i);
        });

        // 손
        drawHand();

        // 경고 텍스트
        if (warningAlpha > 0) {
            ctx.save();
            ctx.globalAlpha = warningAlpha;
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 56px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('WRONG!', W / 2, H / 2);
            ctx.restore();
            warningAlpha -= 0.02;
        }

        if (!gameOver) requestAnimationFrame(render);
    }

    // 입력
    canvas.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    canvas.addEventListener('click', () => {
        if (gameOver) return;
        if (hoveredIdx === -1) return;

        if (hoveredIdx === targetIdx) {
            umbrellas[hoveredIdx].removed = true;
            gameOver = true;
            setTimeout(() => {
                document.getElementById('success-screen').classList.add('show');
            }, 300);
        } else {
            wrongCount++;
            showWarning();
            const chances = document.getElementById('chances');
            let html = 'LIFE: ';
            for (let i = 0; i < 2; i++) {
                if (i < 2 - wrongCount) html += '<span class="chance-o">&#9679;</span>';
                else html += '<span class="chance-x">&#10005;</span>';
            }
            chances.innerHTML = html;

            if (wrongCount >= 2) {
                gameOver = true;
                document.body.classList.add('siren');
                setTimeout(() => {
                    document.body.classList.remove('siren');
                    drawHandcuffScene();
                }, 1500);
            }
        }
    });

    // 시작
    initGame();
    render();
    </script>
</body>
</html>
