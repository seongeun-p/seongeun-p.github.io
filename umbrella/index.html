<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 우산을 찾아라</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: #0a0a0a; cursor: none; user-select: none;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        .bracelet-info {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 8px 20px;
            color: #fff; font-size: 13px; display: flex; align-items: center; gap: 12px;
            font-family: 'Courier New', monospace; z-index: 200;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .bracelet-swatch { width: 22px; height: 22px; border: 2px solid rgba(255,255,255,0.4); }
        .chances-ui {
            position: fixed; top: 16px; right: 20px;
            color: #fff; font-size: 14px; z-index: 200;
            font-family: 'Courier New', monospace;
        }
        .chance-x { color: #e74c3c; font-size: 18px; margin-left: 4px; }
        .chance-o { color: #2ecc71; font-size: 18px; margin-left: 4px; }
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 900; opacity: 0;
            pointer-events: none; transition: opacity 0.3s;
        }
        .overlay-screen.show { opacity: 1; pointer-events: auto; cursor: default; }
        .overlay-screen h1 {
            font-family: 'Courier New', monospace; font-size: 48px;
            text-transform: uppercase; letter-spacing: 4px;
        }
        .overlay-screen p {
            font-family: 'Courier New', monospace; font-size: 16px;
            margin: 12px 0 24px; color: #aaa;
        }
        .overlay-screen button {
            font-family: 'Courier New', monospace; font-size: 16px;
            padding: 10px 28px; background: #000; color: #fff;
            border: 3px solid #fff; cursor: pointer;
        }
        .overlay-screen button:hover { background: #fff; color: #000; }
        #success-screen { background: rgba(0,0,0,0.85); }
        #success-screen h1 { color: #2ecc71; }
        #fail-screen { background: rgba(30,0,0,0.95); }
        #fail-screen h1 { color: #e74c3c; }
        .siren { animation: sirenFlash 0.15s infinite alternate; }
        @keyframes sirenFlash {
            0% { box-shadow: inset 0 0 200px rgba(255,0,0,0.4); }
            100% { box-shadow: inset 0 0 200px rgba(0,0,255,0.4); }
        }
        #handcuff-scene {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 400; display: none; background: #1a0000;
        }
        #handcuff-scene.show { display: block; }
        /* 룰 설명 */
        #rule-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
            transition: opacity 0.5s;
        }
        #rule-screen.hide { opacity: 0; pointer-events: none; }
        #rule-screen h2 {
            color: #fff; font-size: 28px; margin-bottom: 20px;
            font-family: 'Courier New', monospace; letter-spacing: 2px;
        }
        #rule-screen .rule-box {
            display: flex; align-items: center; gap: 16px;
            background: rgba(255,255,255,0.05); padding: 16px 32px; border-radius: 4px;
        }
        #rule-screen .rule-swatch {
            width: 36px; height: 36px; border: 3px solid #fff;
        }
        #rule-screen .rule-text {
            color: #ccc; font-size: 18px; font-family: 'Courier New', monospace;
        }
        #rule-screen .countdown {
            margin-top: 24px; color: #666; font-size: 14px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <canvas id="handcuff-scene"></canvas>
    <div id="rule-screen">
        <h2>FIND YOUR UMBRELLA</h2>
        <div class="rule-box">
            <div class="rule-swatch" id="rule-swatch"></div>
            <div class="rule-text">이 팔찌와 같은 우산을 가져가세요</div>
        </div>
        <div class="countdown" id="countdown">3</div>
    </div>
    <div class="bracelet-info" id="bracelet-info" style="display:none;">
        <span>MY BRACELET:</span>
        <div class="bracelet-swatch" id="swatch"></div>
    </div>
    <div class="chances-ui" id="chances" style="display:none;">
        LIFE: <span class="chance-o">&#9679;</span><span class="chance-o">&#9679;</span>
    </div>
    <div class="overlay-screen" id="success-screen">
        <h1>CLEAR!</h1>
        <p>You found your umbrella.</p>
        <button onclick="location.reload()">RETRY</button>
    </div>
    <div class="overlay-screen" id="fail-screen">
        <h1>BUSTED!</h1>
        <p>That's not yours...</p>
        <button onclick="location.reload()">RETRY</button>
    </div>

    <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', () => { resize(); initGame(); });

    const PX = 3;
    const PALETTES = [
        { colors: ['#e74c3c','#c0392b','#ff6b6b'], pattern: 'solid' },
        { colors: ['#2980b9','#f1c40f','#2980b9'], pattern: 'hstripe' },
        { colors: ['#27ae60','#e74c3c','#27ae60'], pattern: 'vband' },
        { colors: ['#f39c12','#2c3e50','#f39c12'], pattern: 'hstripe' },
        { colors: ['#8e44ad','#1abc9c','#8e44ad'], pattern: 'diamond' },
        { colors: ['#c0392b','#ecf0f1','#c0392b'], pattern: 'hstripe' },
        { colors: ['#16a085','#f39c12','#e74c3c'], pattern: 'tricolor' },
        { colors: ['#d35400','#2ecc71','#d35400'], pattern: 'vband' },
        { colors: ['#2c3e50','#e74c3c','#f1c40f'], pattern: 'tricolor' },
        { colors: ['#1a1a1a','#555','#1a1a1a'], pattern: 'zigzag' },
        { colors: ['#3498db','#e74c3c','#f1c40f'], pattern: 'tricolor' },
        { colors: ['#e67e22','#3498db','#e67e22'], pattern: 'hstripe' },
        { colors: ['#27ae60','#f39c12','#27ae60'], pattern: 'diamond' },
        { colors: ['#e74c3c','#27ae60','#e74c3c'], pattern: 'vband' },
        { colors: ['#9b59b6','#f1c40f','#9b59b6'], pattern: 'hstripe' },
        { colors: ['#1abc9c','#e74c3c','#1abc9c'], pattern: 'diamond' },
        { colors: ['#2980b9','#2ecc71','#2980b9'], pattern: 'vband' },
        { colors: ['#e91e63','#00bcd4','#e91e63'], pattern: 'hstripe' },
        { colors: ['#ff5722','#4caf50','#ff5722'], pattern: 'tricolor' },
        { colors: ['#673ab7','#ff9800','#673ab7'], pattern: 'diamond' },
        { colors: ['#f44336','#2196f3','#ffeb3b'], pattern: 'tricolor' },
        { colors: ['#4caf50','#f44336','#4caf50'], pattern: 'hstripe' },
        { colors: ['#ff9800','#3f51b5','#ff9800'], pattern: 'vband' },
        { colors: ['#00bcd4','#e91e63','#00bcd4'], pattern: 'diamond' },
        { colors: ['#8bc34a','#ff5722','#8bc34a'], pattern: 'hstripe' },
        { colors: ['#e74c3c','#f1c40f','#2ecc71'], pattern: 'tricolor' },
        { colors: ['#3f51b5','#ff9800','#3f51b5'], pattern: 'vband' },
        { colors: ['#009688','#ff5722','#009688'], pattern: 'zigzag' },
        { colors: ['#795548','#ffc107','#795548'], pattern: 'hstripe' },
        { colors: ['#607d8b','#ff4081','#607d8b'], pattern: 'diamond' },
    ];
    const HANDLES = ['j-hook','round','straight','t-handle'];

    let umbrellas = [];
    let targetIdx = 0;
    let mouseX = 0, mouseY = 0;
    let hoveredIdx = -1;
    let wrongCount = 0;
    let gameOver = false;
    let gameStarted = false;

    function initGame() {
        umbrellas = [];
        const count = 30;
        const rackY = H * 0.2;
        const rackLeft = W * 0.04;
        const rackRight = W * 0.96;
        const spacing = (rackRight - rackLeft) / count;
        const shuffled = [...PALETTES].sort(() => Math.random() - 0.5);

        for (let i = 0; i < count; i++) {
            const palette = shuffled[i];
            const handle = HANDLES[i % HANDLES.length];
            const x = rackLeft + (i + 0.5) * spacing;
            const topW = spacing * 0.8;  // 상단 넓이
            const bodyH = H * 0.58 + Math.random() * H * 0.06;
            const tilt = (Math.random() - 0.5) * 3;

            umbrellas.push({
                x, rackY, topW, bodyH, palette, handle, tilt,
                hovered: false, removed: false
            });
        }
        targetIdx = Math.floor(Math.random() * count);
        updateSwatch();
    }

    function updateSwatch() {
        const p = umbrellas[targetIdx].palette;
        const setSwatchBg = (el) => {
            if (p.pattern === 'solid') el.style.background = p.colors[0];
            else if (p.pattern === 'hstripe') el.style.background = `repeating-linear-gradient(0deg, ${p.colors[0]} 0px, ${p.colors[0]} 4px, ${p.colors[1]} 4px, ${p.colors[1]} 8px)`;
            else if (p.pattern === 'vband') el.style.background = `linear-gradient(90deg, ${p.colors[0]} 33%, ${p.colors[1]} 33%, ${p.colors[1]} 66%, ${p.colors[2]} 66%)`;
            else if (p.pattern === 'tricolor') el.style.background = `linear-gradient(180deg, ${p.colors[0]} 33%, ${p.colors[1]} 33%, ${p.colors[1]} 66%, ${p.colors[2]} 66%)`;
            else el.style.background = `repeating-conic-gradient(${p.colors[0]} 0% 25%, ${p.colors[1]} 0% 50%) 50% / 8px 8px`;
        };
        setSwatchBg(document.getElementById('swatch'));
        setSwatchBg(document.getElementById('rule-swatch'));
    }

    function shadeColor(color, percent) {
        let r = parseInt(color.slice(1,3), 16);
        let g = parseInt(color.slice(3,5), 16);
        let b = parseInt(color.slice(5,7), 16);
        r = Math.min(255, Math.max(0, Math.round(r * (1 + percent))));
        g = Math.min(255, Math.max(0, Math.round(g * (1 + percent))));
        b = Math.min(255, Math.max(0, Math.round(b * (1 + percent))));
        return `rgb(${r},${g},${b})`;
    }

    // 역삼각형 우산 몸통 그리기 (위가 넓고 아래로 뾰족)
    function drawTriangleBody(cx, topY, topW, bodyH, palette, hovered) {
        const { colors, pattern } = palette;
        const px = PX;
        const rows = Math.floor(bodyH / px);

        for (let r = 0; r < rows; r++) {
            const progress = r / rows; // 0(상단) ~ 1(하단)
            // 역삼각형: 위는 넓고 아래로 좁아짐
            const rowW = topW * (1 - progress * 0.85);
            const cols = Math.floor(rowW / px);
            const startX = cx - rowW / 2;

            for (let c = 0; c < cols; c++) {
                let color;
                const px2 = c / cols;

                if (pattern === 'solid') {
                    const fold = Math.sin(px2 * Math.PI * 5);
                    color = fold > 0.2 ? colors[0] : shadeColor(colors[0], -0.25);
                } else if (pattern === 'hstripe') {
                    const stripe = Math.floor(r / 5) % colors.length;
                    color = colors[stripe];
                } else if (pattern === 'vband') {
                    const band = Math.floor(px2 * 3);
                    color = colors[Math.min(band, colors.length - 1)];
                } else if (pattern === 'tricolor') {
                    const band = Math.floor(progress * 3);
                    color = colors[Math.min(band, colors.length - 1)];
                } else if (pattern === 'diamond') {
                    const d = (r + c) % 7 < 4;
                    color = d ? colors[0] : colors[1];
                } else if (pattern === 'zigzag') {
                    const z = (r + Math.floor(Math.sin(c * 0.4) * 3)) % 6 < 3;
                    color = z ? colors[0] : colors[1];
                } else {
                    color = colors[0];
                }
                // 접힌 주름 음영
                const fold = Math.sin(px2 * Math.PI * 4) * 0.12;
                ctx.fillStyle = shadeColor(color, fold);
                ctx.fillRect(startX + c * px, topY + r * px, px, px);
            }
        }

        // 호버 글로우 (테두리 없이 빛만)
        if (hovered) {
            ctx.save();
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(cx - topW/2, topY);
            ctx.lineTo(cx + topW/2, topY);
            ctx.lineTo(cx, topY + bodyH);
            ctx.closePath();
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();
        }
    }

    // 우산 그리기 (역삼각형, 봉에 걸림)
    function drawUmbrella(u, idx) {
        if (u.removed) return;
        ctx.save();

        const cx = u.x;
        const topY = u.rackY + 14;

        // 기울기
        ctx.translate(cx, topY);
        ctx.rotate(u.tilt * Math.PI / 180);
        ctx.translate(-cx, -topY);

        // 호버 시 위로 + 커짐
        if (u.hovered) {
            ctx.translate(0, -6);
            ctx.translate(cx, topY + u.bodyH / 2);
            ctx.scale(1.08, 1.08);
            ctx.translate(-cx, -(topY + u.bodyH / 2));
        }

        // 손잡이 (봉에 걸리는 부분)
        const hc = ['#8B4513','#D2691E','#A0522D','#CD853F'][idx % 4];
        ctx.lineCap = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = hc;
        if (u.handle === 'j-hook') {
            ctx.beginPath();
            ctx.arc(cx, u.rackY - 1, 9, 0, Math.PI);
            ctx.stroke();
        } else if (u.handle === 'round') {
            ctx.beginPath();
            ctx.arc(cx, u.rackY - 3, 7, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = hc;
            ctx.fill();
        } else if (u.handle === 'straight') {
            ctx.beginPath();
            ctx.moveTo(cx, u.rackY - 10);
            ctx.lineTo(cx, u.rackY + 4);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.moveTo(cx - 7, u.rackY - 5);
            ctx.lineTo(cx + 7, u.rackY - 5);
            ctx.moveTo(cx, u.rackY - 5);
            ctx.lineTo(cx, u.rackY + 4);
            ctx.stroke();
        }

        // 상단 밴드
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(cx - u.topW / 2, topY, u.topW, 4);

        // 역삼각형 몸통
        drawTriangleBody(cx, topY + 4, u.topW, u.bodyH - 4, u.palette, u.hovered);

        // 하단 뾰족한 팁
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.moveTo(cx - 2, topY + u.bodyH);
        ctx.lineTo(cx + 2, topY + u.bodyH);
        ctx.lineTo(cx, topY + u.bodyH + 8);
        ctx.fill();

        ctx.restore();
    }

    // 봉 그리기
    function drawRack() {
        const rackY = H * 0.2;
        const l = W * 0.02, r = W * 0.98;
        // 봉
        ctx.fillStyle = '#6B3A20';
        ctx.fillRect(l, rackY - 2, r - l, 5);
        ctx.fillStyle = '#8B5A3A';
        ctx.fillRect(l, rackY - 2, r - l, 2);
        ctx.fillStyle = '#4A2510';
        ctx.fillRect(l, rackY + 1, r - l, 2);
    }

    // 손 그리기 (테두리 없이, 픽셀 스타일)
    function drawHand() {
        ctx.save();
        const hx = mouseX;
        const hy = mouseY + 35;
        const skinLight = '#e8b896';
        const skinMid = '#d4956a';
        const skinDark = '#b87a50';

        // 팔 (그라데이션 느낌 — 테두리 없이)
        for (let i = 0; i < Math.ceil((H - hy + 20) / PX); i++) {
            const shade = i % 3 === 0 ? skinDark : (i % 3 === 1 ? skinMid : skinLight);
            ctx.fillStyle = shade;
            ctx.fillRect(hx - 10, hy + 4 + i * PX, 20, PX);
        }

        // 손바닥
        ctx.fillStyle = skinMid;
        ctx.fillRect(hx - 12, hy - 18, 24, 22);
        ctx.fillStyle = skinLight;
        ctx.fillRect(hx - 10, hy - 16, 20, 4);

        // 팔찌 (타겟 색상 패턴)
        const tp = umbrellas[targetIdx].palette;
        const bw = 24, bh = 10;
        const bx = hx - bw / 2, by = hy + 4;
        const bc = tp.colors;
        for (let i = 0; i < bw; i += PX) {
            const ci = Math.floor(i / (bw / bc.length)) % bc.length;
            ctx.fillStyle = bc[ci];
            ctx.fillRect(bx + i, by, PX, bh);
        }

        // 손가락들 (위로, 테두리 없이 픽셀 블록)
        const fingers = [
            { ox: -9, w: 6, h: 20 },
            { ox: -3, w: 6, h: 26 },
            { ox: 3, w: 6, h: 23 },
            { ox: 9, w: 5, h: 18 },
        ];
        fingers.forEach((f, fi) => {
            for (let r = 0; r < Math.ceil(f.h / PX); r++) {
                const c = r % 2 === 0 ? skinMid : skinLight;
                ctx.fillStyle = c;
                ctx.fillRect(hx + f.ox, hy - 18 - f.h + r * PX, f.w, PX);
            }
            // 손톱
            ctx.fillStyle = '#f0c8b0';
            ctx.fillRect(hx + f.ox + 1, hy - 18 - f.h, f.w - 2, PX);
        });
        // 엄지
        for (let r = 0; r < 4; r++) {
            ctx.fillStyle = r % 2 === 0 ? skinMid : skinLight;
            ctx.fillRect(hx - 15, hy - 12 + r * PX, 5, PX);
        }

        ctx.restore();
    }

    // 히트 테스트
    function getHoveredUmbrella(mx, my) {
        for (let i = umbrellas.length - 1; i >= 0; i--) {
            const u = umbrellas[i];
            if (u.removed) continue;
            const topY = u.rackY + 14;
            const halfW = u.topW / 2 + 4;
            if (mx > u.x - halfW && mx < u.x + halfW &&
                my > topY - 15 && my < topY + u.bodyH + 10) {
                return i;
            }
        }
        return -1;
    }

    // 경고
    let warningAlpha = 0;
    function showWarning() { warningAlpha = 1; }

    // 수갑 장면
    function drawHandcuffScene() {
        const hc = document.getElementById('handcuff-scene');
        hc.classList.add('show');
        hc.width = W; hc.height = H;
        const c = hc.getContext('2d');
        let frame = 0;
        const skinMid = '#d4956a';
        const skinLight = '#e8b896';

        function animate() {
            frame++;
            c.clearRect(0, 0, W, H);
            c.fillStyle = frame % 20 < 10 ? '#2a0000' : '#180000';
            c.fillRect(0, 0, W, H);

            const cx = W / 2, cy = H / 2 + 30;
            const s = Math.min(W, H) * 0.005;

            // 양손 (픽셀, 테두리 없이)
            drawBigPixelHand(c, cx - 55*s, cy, s, skinMid, skinLight);
            c.save();
            c.translate(cx + 55*s, cy);
            c.scale(-1, 1);
            c.translate(-(cx + 55*s), -cy);
            drawBigPixelHand(c, cx + 55*s, cy, s, skinMid, skinLight);
            c.restore();

            // 수갑 (픽셀 블록)
            c.fillStyle = '#888';
            for (let i = 0; i < 7; i++) {
                c.fillRect(cx - 55*s - 10*s + i*4*s, cy + 20*s, 4*s, 12*s);
                c.fillRect(cx + 55*s - 18*s + i*4*s, cy + 20*s, 4*s, 12*s);
            }
            c.fillStyle = '#666';
            c.fillRect(cx - 55*s - 10*s, cy + 20*s, 28*s, 3*s);
            c.fillRect(cx + 55*s - 18*s, cy + 20*s, 28*s, 3*s);

            // 체인 (픽셀 도트)
            c.fillStyle = '#777';
            for (let i = 0; i < 12; i++) {
                const t = i / 11;
                const chainX = cx - 40*s + t * 80*s;
                const chainY = cy + 26*s + Math.sin(t * Math.PI) * 20*s;
                c.fillRect(chainX, chainY, 4*s, 4*s);
            }

            // BUSTED
            if (frame > 20) {
                c.fillStyle = '#e74c3c';
                c.font = `bold ${Math.floor(44*s)}px Courier New`;
                c.textAlign = 'center';
                c.shadowColor = '#ff0000'; c.shadowBlur = 20;
                c.fillText('BUSTED', cx, cy - 65*s);
                c.shadowBlur = 0;
            }

            if (frame < 100) requestAnimationFrame(animate);
            else document.getElementById('fail-screen').classList.add('show');
        }
        animate();
    }

    function drawBigPixelHand(c, hx, hy, s, skinMid, skinLight) {
        // 팔 (픽셀 줄)
        for (let i = 0; i < 18; i++) {
            c.fillStyle = i % 2 === 0 ? skinMid : skinLight;
            c.fillRect(hx - 12*s, hy + i * 4*s, 24*s, 4*s);
        }
        // 손바닥
        c.fillStyle = skinMid;
        c.fillRect(hx - 14*s, hy - 24*s, 28*s, 28*s);
        c.fillStyle = skinLight;
        c.fillRect(hx - 12*s, hy - 22*s, 24*s, 6*s);
        // 주먹 손가락
        for (let i = 0; i < 4; i++) {
            for (let r = 0; r < 3; r++) {
                c.fillStyle = r % 2 === 0 ? skinMid : skinLight;
                c.fillRect(hx - 12*s + i * 7*s, hy - 24*s - 12*s + r*4*s, 6*s, 4*s);
            }
        }
    }

    // 렌더
    function render() {
        if (!gameStarted) { requestAnimationFrame(render); return; }
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, W, H);

        drawRack();

        hoveredIdx = getHoveredUmbrella(mouseX, mouseY);
        umbrellas.forEach((u, i) => { u.hovered = (i === hoveredIdx); drawUmbrella(u, i); });

        drawHand();

        if (warningAlpha > 0) {
            ctx.save();
            ctx.globalAlpha = warningAlpha;
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 52px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('WRONG!', W / 2, H / 2);
            ctx.restore();
            warningAlpha -= 0.02;
        }

        if (!gameOver) requestAnimationFrame(render);
    }

    // 입력
    canvas.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    canvas.addEventListener('click', () => {
        if (!gameStarted || gameOver) return;
        if (hoveredIdx === -1) return;

        if (hoveredIdx === targetIdx) {
            umbrellas[hoveredIdx].removed = true;
            gameOver = true;
            setTimeout(() => document.getElementById('success-screen').classList.add('show'), 300);
        } else {
            wrongCount++;
            showWarning();
            const ch = document.getElementById('chances');
            let html = 'LIFE: ';
            for (let i = 0; i < 2; i++) {
                html += i < 2 - wrongCount ? '<span class="chance-o">&#9679;</span>' : '<span class="chance-x">&#10005;</span>';
            }
            ch.innerHTML = html;
            if (wrongCount >= 2) {
                gameOver = true;
                document.body.classList.add('siren');
                setTimeout(() => { document.body.classList.remove('siren'); drawHandcuffScene(); }, 1500);
            }
        }
    });

    // 시작 — 3초 룰 설명 후 게임 시작
    initGame();
    render();

    let countdownVal = 3;
    const countdownEl = document.getElementById('countdown');
    const countdownInterval = setInterval(() => {
        countdownVal--;
        if (countdownVal > 0) {
            countdownEl.textContent = countdownVal;
        } else {
            clearInterval(countdownInterval);
            document.getElementById('rule-screen').classList.add('hide');
            document.getElementById('bracelet-info').style.display = 'flex';
            document.getElementById('chances').style.display = 'block';
            gameStarted = true;
        }
    }, 1000);
    </script>
</body>
</html>
