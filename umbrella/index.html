<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 우산을 찾아라</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            cursor: none;
            user-select: none;
        }

        /* 우산꽂이 */
        .umbrella-stand {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
        }

        /* 우산꽂이 통 */
        .stand-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 180px;
            background: linear-gradient(180deg, #4a3728 0%, #2d1f14 100%);
            border-radius: 10px 10px 20px 20px;
            border: 3px solid #5c4033;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stand-body::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -10px;
            right: -10px;
            height: 16px;
            background: #5c4033;
            border-radius: 8px;
        }

        /* 우산 */
        .umbrella {
            position: absolute;
            cursor: none;
            transition: transform 0.2s ease;
        }

        .umbrella:hover {
            transform: translateY(-10px);
        }

        .umbrella.wrong {
            animation: shake 0.4s ease;
        }

        .umbrella.correct {
            animation: pullOut 0.8s ease forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-2deg); }
            75% { transform: translateX(8px) rotate(2deg); }
        }

        @keyframes pullOut {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-200px) scale(1.2); opacity: 0; }
        }

        /* 커스텀 커서 — 손 */
        .hand-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-20px, -10px);
        }

        /* 팔찌 */
        .bracelet-display {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 999;
        }

        .bracelet-color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
        }

        /* 경고 표시 */
        .warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 80px;
            z-index: 2000;
            pointer-events: none;
            animation: warningPop 0.8s ease forwards;
        }

        @keyframes warningPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* 남은 기회 */
        .chances {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            z-index: 999;
        }

        .chance-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            margin-left: 6px;
            transition: opacity 0.3s;
        }

        .chance-dot.used {
            opacity: 0.2;
        }

        /* 사이렌 효과 */
        .siren {
            animation: sirenFlash 0.2s infinite alternate;
        }

        @keyframes sirenFlash {
            0% { background: rgba(255, 0, 0, 0.3); }
            100% { background: rgba(0, 0, 255, 0.3); }
        }

        /* 성공 화면 */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .success-overlay h1 {
            color: #2ecc71;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 48px;
            margin-bottom: 20px;
        }

        .success-overlay button {
            padding: 12px 32px;
            font-size: 16px;
            background: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* 실패 화면 */
        .fail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .fail-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .fail-overlay h1 {
            color: #e74c3c;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .fail-overlay p {
            color: #aaa;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .fail-overlay button {
            padding: 12px 32px;
            font-size: 16px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* 안내 */
        .instruction {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="bracelet-display">
        <span>내 팔찌:</span>
        <div class="bracelet-color" id="bracelet-color"></div>
        <span id="bracelet-label">이 색 우산을 찾으세요</span>
    </div>

    <div class="chances">
        기회: <span class="chance-dot" id="c1"></span><span class="chance-dot" id="c2"></span><span class="chance-dot" id="c3"></span>
    </div>

    <div class="umbrella-stand" id="stand"></div>

    <!-- 우산꽂이 통 -->
    <div class="stand-body" style="position:fixed; bottom:40px; left:50%; transform:translateX(-50%);"></div>

    <div class="hand-cursor" id="hand-cursor"></div>

    <div class="instruction">팔찌와 같은 색의 우산을 클릭하세요</div>

    <div class="success-overlay" id="success">
        <h1>성공!</h1>
        <p style="color:#aaa; font-size:18px; margin-bottom:20px;">내 우산을 찾았어요</p>
        <button onclick="location.reload()">다시 하기</button>
    </div>

    <div class="fail-overlay" id="fail">
        <h1>체포!</h1>
        <p>남의 우산을 3번이나 잡으시다니...</p>
        <button onclick="location.reload()">다시 하기</button>
    </div>

    <script>
        // 우산 색상 팔레트 (다양한 색상 + 패턴)
        const COLORS = [
            '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6',
            '#1abc9c', '#e67e22', '#ec407a', '#26c6da', '#ab47bc',
            '#ff7043', '#66bb6a', '#42a5f5', '#ffa726', '#ef5350',
            '#7e57c2', '#26a69a', '#d4e157', '#ff8a65', '#78909c',
            '#f06292', '#4db6ac', '#ffb74d', '#ba68c8', '#4dd0e1',
            '#aed581', '#ff8a80', '#80cbc4', '#ce93d8', '#fff176'
        ];

        const PATTERNS = ['solid', 'striped', 'dotted'];

        let umbrellas = [];
        let targetColor = '';
        let targetPattern = '';
        let wrongCount = 0;
        let gameOver = false;

        const stand = document.getElementById('stand');
        const handCursor = document.getElementById('hand-cursor');
        const braceletColor = document.getElementById('bracelet-color');
        const braceletLabel = document.getElementById('bracelet-label');

        // 우산 생성
        function createUmbrellas() {
            stand.innerHTML = '';
            umbrellas = [];

            // 타겟 우산 결정
            const targetIdx = Math.floor(Math.random() * 30);
            
            for (let i = 0; i < 30; i++) {
                const color = COLORS[i % COLORS.length];
                const pattern = PATTERNS[i % PATTERNS.length];
                
                const umbrella = document.createElement('div');
                umbrella.className = 'umbrella';
                umbrella.dataset.color = color;
                umbrella.dataset.pattern = pattern;
                umbrella.dataset.index = i;

                // 우산 위치 (반원형 배치)
                const angle = (i / 30) * Math.PI * 0.8 + Math.PI * 0.1;
                const radiusX = 200;
                const radiusY = 60;
                const centerX = 250;
                const baseY = 280;
                
                const x = centerX + Math.cos(angle) * radiusX * (0.8 + Math.random() * 0.4) - 30;
                const y = baseY - Math.sin(angle) * radiusY - Math.random() * 30;
                
                umbrella.style.left = x + 'px';
                umbrella.style.top = y + 'px';

                // 우산 SVG 생성
                const height = 180 + Math.random() * 40;
                const rotation = (Math.random() - 0.5) * 20;
                umbrella.style.transform = `rotate(${rotation}deg)`;
                
                umbrella.innerHTML = createUmbrellaSVG(color, pattern, height);
                
                umbrella.addEventListener('click', () => handleClick(i, color, pattern, umbrella));
                
                stand.appendChild(umbrella);
                umbrellas.push({ color, pattern, element: umbrella });

                if (i === targetIdx) {
                    targetColor = color;
                    targetPattern = pattern;
                }
            }

            // 팔찌 색상 설정
            braceletColor.style.background = targetColor;
            if (targetPattern === 'striped') {
                braceletColor.style.background = `repeating-linear-gradient(45deg, ${targetColor}, ${targetColor} 4px, rgba(255,255,255,0.4) 4px, rgba(255,255,255,0.4) 8px)`;
            } else if (targetPattern === 'dotted') {
                braceletColor.style.background = targetColor;
                braceletColor.style.boxShadow = `inset 0 0 0 3px ${targetColor}, inset 0 0 0 5px rgba(255,255,255,0.5)`;
            }
        }

        // 우산 SVG
        function createUmbrellaSVG(color, pattern, height) {
            let patternDef = '';
            let fillAttr = `fill="${color}"`;

            if (pattern === 'striped') {
                patternDef = `
                    <defs>
                        <pattern id="stripe-${color.replace('#','')}" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                            <rect width="4" height="8" fill="${color}"/>
                            <rect x="4" width="4" height="8" fill="rgba(255,255,255,0.3)"/>
                        </pattern>
                    </defs>`;
                fillAttr = `fill="url(#stripe-${color.replace('#','')})"`;
            } else if (pattern === 'dotted') {
                patternDef = `
                    <defs>
                        <pattern id="dots-${color.replace('#','')}" patternUnits="userSpaceOnUse" width="10" height="10">
                            <rect width="10" height="10" fill="${color}"/>
                            <circle cx="5" cy="5" r="2" fill="rgba(255,255,255,0.4)"/>
                        </pattern>
                    </defs>`;
                fillAttr = `fill="url(#dots-${color.replace('#','')})"`;
            }

            return `
                <svg width="60" height="${height}" viewBox="0 0 60 ${height}">
                    ${patternDef}
                    <!-- 우산 캐노피 -->
                    <path d="M 5 45 Q 30 -10 55 45 Z" ${fillAttr} stroke="${color}" stroke-width="1.5"/>
                    <!-- 우산 봉 -->
                    <line x1="30" y1="45" x2="30" y2="${height - 20}" stroke="#555" stroke-width="2.5"/>
                    <!-- 손잡이 -->
                    <path d="M 30 ${height - 20} Q 30 ${height} 22 ${height}" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <!-- 꼭대기 -->
                    <circle cx="30" cy="6" r="3" fill="#333"/>
                </svg>`;
        }

        // 손 커서 SVG (팔찌 포함)
        function updateHandCursor() {
            const braceletStyle = targetPattern === 'striped' 
                ? `stroke="${targetColor}" stroke-width="6" stroke-dasharray="4 3"`
                : targetPattern === 'dotted'
                ? `stroke="${targetColor}" stroke-width="6" stroke-dasharray="2 3"`
                : `stroke="${targetColor}" stroke-width="6"`;

            handCursor.innerHTML = `
                <svg width="80" height="100" viewBox="0 0 80 100">
                    <!-- 팔 -->
                    <rect x="25" y="55" width="30" height="45" rx="12" fill="#f4c898" stroke="#dba06d" stroke-width="1"/>
                    <!-- 팔찌 -->
                    <rect x="23" y="75" width="34" height="12" rx="6" fill="none" ${braceletStyle} id="bracelet-svg"/>
                    <!-- 손바닥 -->
                    <ellipse cx="40" cy="40" rx="18" ry="22" fill="#f4c898" stroke="#dba06d" stroke-width="1"/>
                    <!-- 손가락들 -->
                    <rect x="22" y="10" width="9" height="30" rx="4.5" fill="#f4c898" stroke="#dba06d" stroke-width="0.8"/>
                    <rect x="33" y="5" width="9" height="35" rx="4.5" fill="#f4c898" stroke="#dba06d" stroke-width="0.8"/>
                    <rect x="44" y="8" width="9" height="32" rx="4.5" fill="#f4c898" stroke="#dba06d" stroke-width="0.8"/>
                    <rect x="55" y="14" width="8" height="26" rx="4" fill="#f4c898" stroke="#dba06d" stroke-width="0.8"/>
                    <!-- 엄지 -->
                    <rect x="12" y="32" width="8" height="20" rx="4" fill="#f4c898" stroke="#dba06d" stroke-width="0.8" transform="rotate(-20 16 42)"/>
                </svg>`;
        }

        // 수갑으로 변환
        function showHandcuffs() {
            handCursor.innerHTML = `
                <svg width="80" height="100" viewBox="0 0 80 100">
                    <!-- 팔 -->
                    <rect x="25" y="55" width="30" height="45" rx="12" fill="#f4c898" stroke="#dba06d" stroke-width="1"/>
                    <!-- 수갑 -->
                    <rect x="20" y="72" width="40" height="16" rx="4" fill="#888" stroke="#555" stroke-width="2"/>
                    <circle cx="26" cy="80" r="3" fill="#555"/>
                    <rect x="38" y="76" width="8" height="4" rx="1" fill="#666"/>
                    <!-- 손바닥 -->
                    <ellipse cx="40" cy="40" rx="18" ry="22" fill="#f4c898" stroke="#dba06d" stroke-width="1"/>
                    <!-- 손가락들 (주먹) -->
                    <rect x="24" y="20" width="9" height="22" rx="4.5" fill="#f4c898" stroke="#dba06d" stroke-width="0.8" transform="rotate(5 28 31)"/>
                    <rect x="34" y="18" width="9" height="24" rx="4.5" fill="#f4c898" stroke="#dba06d" stroke-width="0.8"/>
                    <rect x="44" y="20" width="9" height="22" rx="4.5" fill="#f4c898" stroke="#dba06d" stroke-width="0.8" transform="rotate(-5 48 31)"/>
                    <rect x="53" y="24" width="8" height="18" rx="4" fill="#f4c898" stroke="#dba06d" stroke-width="0.8" transform="rotate(-10 57 33)"/>
                </svg>`;
        }

        // 클릭 핸들러
        function handleClick(index, color, pattern, element) {
            if (gameOver) return;

            if (color === targetColor && pattern === targetPattern) {
                // 성공!
                element.classList.add('correct');
                setTimeout(() => {
                    document.getElementById('success').classList.add('show');
                }, 800);
                gameOver = true;
            } else {
                // 실패
                wrongCount++;
                element.classList.add('wrong');
                setTimeout(() => element.classList.remove('wrong'), 400);

                // 경고 표시
                const warning = document.createElement('div');
                warning.className = 'warning';
                warning.textContent = '⚠️';
                document.body.appendChild(warning);
                setTimeout(() => warning.remove(), 800);

                // 기회 차감
                document.getElementById(`c${wrongCount}`).classList.add('used');

                if (wrongCount >= 3) {
                    // 게임 오버 — 사이렌 + 수갑
                    gameOver = true;
                    document.body.classList.add('siren');
                    showHandcuffs();
                    
                    setTimeout(() => {
                        document.body.classList.remove('siren');
                        document.getElementById('fail').classList.add('show');
                    }, 2000);
                }
            }
        }

        // 마우스 추적
        document.addEventListener('mousemove', (e) => {
            handCursor.style.left = (e.clientX - 30) + 'px';
            handCursor.style.top = (e.clientY - 20) + 'px';
        });

        // 초기화
        createUmbrellas();
        updateHandCursor();
    </script>
</body>
</html>
