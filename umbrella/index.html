<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 우산을 찾아라</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: #000; cursor: none; user-select: none;
            font-family: 'Courier New', monospace;
            image-rendering: pixelated;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        /* UI 오버레이 */
        .ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }
        .bracelet-info {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: #000; border: 3px solid #fff; padding: 8px 20px;
            color: #fff; font-size: 14px; display: flex; align-items: center; gap: 12px;
            font-family: 'Courier New', monospace; z-index: 200;
        }
        .bracelet-swatch {
            width: 24px; height: 24px; border: 2px solid #fff;
        }
        .chances-ui {
            position: fixed; top: 16px; right: 20px;
            color: #fff; font-size: 14px; z-index: 200;
            font-family: 'Courier New', monospace;
        }
        .chance-x { color: #e74c3c; font-size: 18px; margin-left: 4px; }
        .chance-o { color: #2ecc71; font-size: 18px; margin-left: 4px; }
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 500; opacity: 0;
            pointer-events: none; transition: opacity 0.3s;
        }
        .overlay-screen.show { opacity: 1; pointer-events: auto; }
        .overlay-screen h1 {
            font-family: 'Courier New', monospace; font-size: 48px;
            text-transform: uppercase; letter-spacing: 4px;
        }
        .overlay-screen p {
            font-family: 'Courier New', monospace; font-size: 16px;
            margin: 12px 0 24px; color: #aaa;
        }
        .overlay-screen button {
            font-family: 'Courier New', monospace; font-size: 16px;
            padding: 10px 28px; background: #000; color: #fff;
            border: 3px solid #fff; cursor: pointer;
            pointer-events: auto;
        }
        .overlay-screen button:hover { background: #fff; color: #000; }
        #success-screen { background: rgba(0,0,0,0.85); }
        #success-screen h1 { color: #2ecc71; }
        #fail-screen { background: rgba(0,0,0,0.85); }
        #fail-screen h1 { color: #e74c3c; }
        .siren { animation: sirenFlash 0.15s infinite alternate; }
        @keyframes sirenFlash {
            0% { box-shadow: inset 0 0 200px rgba(255,0,0,0.4); }
            100% { box-shadow: inset 0 0 200px rgba(0,0,255,0.4); }
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div class="bracelet-info">
        <span>MY BRACELET:</span>
        <div class="bracelet-swatch" id="swatch"></div>
    </div>
    <div class="chances-ui" id="chances">
        LIFE: <span class="chance-o">&#9679;</span><span class="chance-o">&#9679;</span>
    </div>
    <div class="overlay-screen" id="success-screen">
        <h1>CLEAR!</h1>
        <p>You found your umbrella.</p>
        <button onclick="location.reload()">RETRY</button>
    </div>
    <div class="overlay-screen" id="fail-screen">
        <h1>BUSTED!</h1>
        <p>That's not yours...</p>
        <button onclick="location.reload()">RETRY</button>
    </div>

    <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W, H, scale;
    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        scale = Math.min(W / 1200, H / 800);
    }
    resize();
    window.addEventListener('resize', resize);

    // 색상 팔레트 (90년대 레트로)
    const PALETTES = [
        { base: '#e74c3c', accent: '#fff', pattern: 'solid' },
        { base: '#2980b9', accent: '#f1c40f', pattern: 'hstripe' },
        { base: '#27ae60', accent: '#e74c3c', pattern: 'diamond' },
        { base: '#f39c12', accent: '#2c3e50', pattern: 'vstripe' },
        { base: '#8e44ad', accent: '#1abc9c', pattern: 'dots' },
        { base: '#c0392b', accent: '#ecf0f1', pattern: 'hstripe' },
        { base: '#16a085', accent: '#f39c12', pattern: 'checker' },
        { base: '#d35400', accent: '#2ecc71', pattern: 'vstripe' },
        { base: '#2c3e50', accent: '#e74c3c', pattern: 'diamond' },
        { base: '#f1c40f', accent: '#e74c3c', pattern: 'solid' },
        { base: '#1abc9c', accent: '#9b59b6', pattern: 'hstripe' },
        { base: '#e67e22', accent: '#3498db', pattern: 'dots' },
        { base: '#9b59b6', accent: '#f1c40f', pattern: 'checker' },
        { base: '#34495e', accent: '#e74c3c', pattern: 'vstripe' },
        { base: '#e74c3c', accent: '#f1c40f', pattern: 'hstripe' },
        { base: '#3498db', accent: '#e74c3c', pattern: 'diamond' },
        { base: '#2ecc71', accent: '#f39c12', pattern: 'vstripe' },
        { base: '#e91e63', accent: '#00bcd4', pattern: 'dots' },
        { base: '#ff5722', accent: '#4caf50', pattern: 'checker' },
        { base: '#673ab7', accent: '#ff9800', pattern: 'hstripe' },
        { base: '#009688', accent: '#ff5722', pattern: 'solid' },
        { base: '#795548', accent: '#ffc107', pattern: 'vstripe' },
        { base: '#607d8b', accent: '#ff4081', pattern: 'diamond' },
        { base: '#4caf50', accent: '#ff5722', pattern: 'hstripe' },
        { base: '#ff9800', accent: '#3f51b5', pattern: 'dots' },
        { base: '#00bcd4', accent: '#e91e63', pattern: 'checker' },
        { base: '#cddc39', accent: '#9c27b0', pattern: 'vstripe' },
        { base: '#ff4081', accent: '#00e676', pattern: 'solid' },
        { base: '#3f51b5', accent: '#ff9800', pattern: 'hstripe' },
        { base: '#8bc34a', accent: '#e91e63', pattern: 'diamond' }
    ];

    // 우산 모양 타입
    const SHAPES = ['classic', 'pointy', 'flat', 'bubble', 'pagoda'];

    // 우산 데이터
    let umbrellas = [];
    let targetIdx = 0;
    let mouseX = W / 2, mouseY = H - 100;
    let hoveredIdx = -1;
    let wrongCount = 0;
    let gameOver = false;
    let handcuffs = false;

    // 우산꽂이 영역
    const STAND_TOP = 0.35;
    const STAND_BOTTOM = 0.78;

    function initGame() {
        umbrellas = [];
        const count = 30;
        const standLeft = W * 0.08;
        const standRight = W * 0.92;
        const standW = standRight - standLeft;

        // 셔플된 팔레트
        const shuffled = [...PALETTES].sort(() => Math.random() - 0.5);

        for (let i = 0; i < count; i++) {
            const palette = shuffled[i % shuffled.length];
            const shape = SHAPES[i % SHAPES.length];
            const col = i;
            const x = standLeft + (col + 0.5) * (standW / count);
            const baseY = H * STAND_BOTTOM;
            const topY = H * STAND_TOP + Math.random() * H * 0.05;
            const umbH = baseY - topY;
            umbrellas.push({
                x, topY, baseY, umbH, palette, shape,
                width: standW / count * 0.85,
                hovered: false, scale: 1, removed: false
            });
        }

        // 타겟 랜덤 선택
        targetIdx = Math.floor(Math.random() * count);
        
        // 팔찌 색상 표시
        const swatch = document.getElementById('swatch');
        const tp = umbrellas[targetIdx].palette;
        if (tp.pattern === 'solid') {
            swatch.style.background = tp.base;
        } else if (tp.pattern === 'hstripe') {
            swatch.style.background = `repeating-linear-gradient(0deg, ${tp.base} 0px, ${tp.base} 4px, ${tp.accent} 4px, ${tp.accent} 8px)`;
        } else if (tp.pattern === 'vstripe') {
            swatch.style.background = `repeating-linear-gradient(90deg, ${tp.base} 0px, ${tp.base} 4px, ${tp.accent} 4px, ${tp.accent} 8px)`;
        } else if (tp.pattern === 'diamond' || tp.pattern === 'checker') {
            swatch.style.background = `repeating-conic-gradient(${tp.base} 0% 25%, ${tp.accent} 0% 50%) 50% / 8px 8px`;
        } else {
            swatch.style.background = tp.base;
        }
    }

    // 픽셀 패턴 채우기
    function fillPattern(x, y, w, h, palette) {
        const { base, accent, pattern } = palette;
        ctx.fillStyle = base;
        ctx.fillRect(x, y, w, h);

        ctx.fillStyle = accent;
        const ps = 4; // pixel size
        if (pattern === 'hstripe') {
            for (let row = 0; row < h; row += ps * 2) {
                ctx.fillRect(x, y + row, w, ps);
            }
        } else if (pattern === 'vstripe') {
            for (let col = 0; col < w; col += ps * 2) {
                ctx.fillRect(x + col, y, ps, h);
            }
        } else if (pattern === 'diamond') {
            for (let row = 0; row < h; row += ps * 4) {
                for (let col = 0; col < w; col += ps * 4) {
                    ctx.fillRect(x + col + ps, y + row, ps, ps);
                    ctx.fillRect(x + col, y + row + ps, ps, ps);
                    ctx.fillRect(x + col + ps * 2, y + row + ps, ps, ps);
                    ctx.fillRect(x + col + ps, y + row + ps * 2, ps, ps);
                }
            }
        } else if (pattern === 'dots') {
            for (let row = 0; row < h; row += ps * 3) {
                for (let col = 0; col < w; col += ps * 3) {
                    ctx.fillRect(x + col + ps, y + row + ps, ps, ps);
                }
            }
        } else if (pattern === 'checker') {
            for (let row = 0; row < h; row += ps * 2) {
                for (let col = 0; col < w; col += ps * 2) {
                    if ((Math.floor(row / (ps*2)) + Math.floor(col / (ps*2))) % 2 === 0) {
                        ctx.fillRect(x + col, y + row, ps * 2, ps * 2);
                    }
                }
            }
        }
    }

    // 우산 그리기
    function drawUmbrella(u, idx) {
        if (u.removed) return;
        ctx.save();

        const s = u.hovered ? 1.12 : 1;
        const cx = u.x;
        const cy = u.topY + u.umbH / 2;
        ctx.translate(cx, cy);
        ctx.scale(s, s);
        ctx.translate(-cx, -cy);

        const uw = u.width;
        const canopyH = u.umbH * 0.3;
        const stickTop = u.topY + canopyH;
        const canopyTop = u.topY;

        // 우산 캐노피 (모양에 따라)
        ctx.save();
        ctx.beginPath();
        if (u.shape === 'classic') {
            ctx.moveTo(cx - uw/2, canopyTop + canopyH);
            ctx.quadraticCurveTo(cx, canopyTop - canopyH * 0.3, cx + uw/2, canopyTop + canopyH);
            ctx.closePath();
        } else if (u.shape === 'pointy') {
            ctx.moveTo(cx - uw/2, canopyTop + canopyH);
            ctx.lineTo(cx, canopyTop - canopyH * 0.2);
            ctx.lineTo(cx + uw/2, canopyTop + canopyH);
            ctx.closePath();
        } else if (u.shape === 'flat') {
            ctx.rect(cx - uw/2, canopyTop, uw, canopyH);
        } else if (u.shape === 'bubble') {
            ctx.ellipse(cx, canopyTop + canopyH * 0.6, uw/2, canopyH * 0.7, 0, 0, Math.PI * 2);
        } else if (u.shape === 'pagoda') {
            ctx.moveTo(cx - uw/2, canopyTop + canopyH);
            ctx.quadraticCurveTo(cx - uw/4, canopyTop - canopyH*0.1, cx, canopyTop + canopyH*0.3);
            ctx.quadraticCurveTo(cx + uw/4, canopyTop - canopyH*0.1, cx + uw/2, canopyTop + canopyH);
            ctx.closePath();
        }
        ctx.clip();
        fillPattern(cx - uw/2, canopyTop - canopyH*0.3, uw, canopyH * 1.5, u.palette);
        ctx.restore();

        // 캐노피 외곽선
        ctx.beginPath();
        if (u.shape === 'classic') {
            ctx.moveTo(cx - uw/2, canopyTop + canopyH);
            ctx.quadraticCurveTo(cx, canopyTop - canopyH * 0.3, cx + uw/2, canopyTop + canopyH);
            ctx.closePath();
        } else if (u.shape === 'pointy') {
            ctx.moveTo(cx - uw/2, canopyTop + canopyH);
            ctx.lineTo(cx, canopyTop - canopyH * 0.2);
            ctx.lineTo(cx + uw/2, canopyTop + canopyH);
            ctx.closePath();
        } else if (u.shape === 'flat') {
            ctx.rect(cx - uw/2, canopyTop, uw, canopyH);
        } else if (u.shape === 'bubble') {
            ctx.ellipse(cx, canopyTop + canopyH * 0.6, uw/2, canopyH * 0.7, 0, 0, Math.PI * 2);
        } else if (u.shape === 'pagoda') {
            ctx.moveTo(cx - uw/2, canopyTop + canopyH);
            ctx.quadraticCurveTo(cx - uw/4, canopyTop - canopyH*0.1, cx, canopyTop + canopyH*0.3);
            ctx.quadraticCurveTo(cx + uw/4, canopyTop - canopyH*0.1, cx + uw/2, canopyTop + canopyH);
            ctx.closePath();
        }
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 우산 봉 (스틱)
        ctx.fillStyle = '#333';
        ctx.fillRect(cx - 2, stickTop, 4, u.baseY - stickTop - 15);

        // 손잡이 (J형)
        ctx.beginPath();
        ctx.arc(cx - 8, u.baseY - 15, 8, -Math.PI/2, Math.PI/2);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 꼭대기 점
        ctx.fillStyle = '#222';
        ctx.fillRect(cx - 3, canopyTop - 6, 6, 6);

        // 호버 글로우
        if (u.hovered) {
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 15;
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - uw/2 - 4, canopyTop - 8, uw + 8, u.umbH + 8);
            ctx.shadowBlur = 0;
        }

        ctx.restore();
    }

    // 우산꽂이 통 그리기
    function drawStand() {
        const sLeft = W * 0.06;
        const sRight = W * 0.94;
        const sTop = H * STAND_BOTTOM - 10;
        const sBottom = H * 0.92;

        // 통 본체
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(sLeft, sTop, sRight - sLeft, sBottom - sTop);

        // 테두리
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 4;
        ctx.strokeRect(sLeft, sTop, sRight - sLeft, sBottom - sTop);

        // 상단 림
        ctx.fillStyle = '#333';
        ctx.fillRect(sLeft - 6, sTop - 8, sRight - sLeft + 12, 12);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.strokeRect(sLeft - 6, sTop - 8, sRight - sLeft + 12, 12);
    }

    // 손 그리기 (픽셀아트 스타일)
    function drawHand() {
        ctx.save();
        const hx = mouseX;
        const hy = H - 60;
        const armTop = hy - 80;

        // 팔
        ctx.fillStyle = '#d4956a';
        ctx.fillRect(hx - 14, hy - 20, 28, 80);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(hx - 14, hy - 20, 28, 80);

        // 팔찌 또는 수갑
        if (handcuffs) {
            // 수갑
            ctx.fillStyle = '#666';
            ctx.fillRect(hx - 18, hy + 20, 36, 16);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.strokeRect(hx - 18, hy + 20, 36, 16);
            // 열쇠구멍
            ctx.fillStyle = '#222';
            ctx.fillRect(hx - 3, hy + 25, 6, 6);
        } else {
            // 팔찌
            const tp = umbrellas[targetIdx].palette;
            ctx.save();
            ctx.beginPath();
            ctx.rect(hx - 16, hy + 18, 32, 14);
            ctx.clip();
            fillPattern(hx - 16, hy + 18, 32, 14, tp);
            ctx.restore();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(hx - 16, hy + 18, 32, 14);
        }

        // 손가락들 (위로 뻗음)
        const fingers = [
            { x: hx - 10, w: 8, h: 30 },
            { x: hx - 3, w: 8, h: 36 },
            { x: hx + 4, w: 8, h: 33 },
            { x: hx + 11, w: 7, h: 26 },
        ];
        fingers.forEach(f => {
            ctx.fillStyle = '#d4956a';
            ctx.fillRect(f.x, hy - 20 - f.h, f.w, f.h);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(f.x, hy - 20 - f.h, f.w, f.h);
        });

        // 엄지
        ctx.fillStyle = '#d4956a';
        ctx.fillRect(hx - 18, hy - 30, 7, 18);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(hx - 18, hy - 30, 7, 18);

        ctx.restore();
    }

    // 비 효과 (레트로)
    let raindrops = [];
    function initRain() {
        for (let i = 0; i < 80; i++) {
            raindrops.push({
                x: Math.random() * W,
                y: Math.random() * H,
                speed: 4 + Math.random() * 6,
                len: 8 + Math.random() * 12
            });
        }
    }
    initRain();

    function drawRain() {
        ctx.strokeStyle = 'rgba(150,180,200,0.3)';
        ctx.lineWidth = 1;
        raindrops.forEach(r => {
            ctx.beginPath();
            ctx.moveTo(r.x, r.y);
            ctx.lineTo(r.x - 2, r.y + r.len);
            ctx.stroke();
            r.y += r.speed;
            if (r.y > H) { r.y = -r.len; r.x = Math.random() * W; }
        });
    }

    // 히트 테스트
    function getHoveredUmbrella(mx, my) {
        // 손 위치 기준으로 위쪽의 우산 영역 검사
        const handTipY = H - 140;
        for (let i = umbrellas.length - 1; i >= 0; i--) {
            const u = umbrellas[i];
            if (u.removed) continue;
            const halfW = u.width / 2 + 4;
            if (mx > u.x - halfW && mx < u.x + halfW &&
                handTipY > u.topY - 10 && handTipY < u.baseY + 10) {
                return i;
            }
        }
        return -1;
    }

    // 경고 애니메이션
    let warningAlpha = 0;
    let warningText = '';

    function showWarning() {
        warningAlpha = 1;
        warningText = 'WRONG!';
    }

    // 메인 렌더
    function render() {
        ctx.clearRect(0, 0, W, H);

        // 배경
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        // 비
        drawRain();

        // 우산꽂이 통
        drawStand();

        // 우산들
        hoveredIdx = getHoveredUmbrella(mouseX, mouseY);
        umbrellas.forEach((u, i) => {
            u.hovered = (i === hoveredIdx);
            drawUmbrella(u, i);
        });

        // 손
        drawHand();

        // 경고 텍스트
        if (warningAlpha > 0) {
            ctx.save();
            ctx.globalAlpha = warningAlpha;
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 64px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(warningText, W / 2, H / 2);
            ctx.restore();
            warningAlpha -= 0.02;
        }

        if (!gameOver) requestAnimationFrame(render);
        else render_static();
    }

    function render_static() {
        // 마지막 프레임 유지
    }

    // 입력
    canvas.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    canvas.addEventListener('click', () => {
        if (gameOver) return;
        if (hoveredIdx === -1) return;

        if (hoveredIdx === targetIdx) {
            // 성공
            umbrellas[hoveredIdx].removed = true;
            gameOver = true;
            setTimeout(() => {
                document.getElementById('success-screen').classList.add('show');
            }, 300);
        } else {
            // 실패
            wrongCount++;
            showWarning();
            // 기회 표시 업데이트
            const chances = document.getElementById('chances');
            let html = 'LIFE: ';
            for (let i = 0; i < 2; i++) {
                if (i < 2 - wrongCount) html += '<span class="chance-o">&#9679;</span>';
                else html += '<span class="chance-x">&#10005;</span>';
            }
            chances.innerHTML = html;

            if (wrongCount >= 2) {
                // 게임오버 — 사이렌 + 수갑
                gameOver = true;
                handcuffs = true;
                document.body.classList.add('siren');
                // 마지막 프레임 그리기
                setTimeout(() => {
                    ctx.clearRect(0, 0, W, H);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, W, H);
                    drawRain(); drawStand();
                    umbrellas.forEach((u, i) => drawUmbrella(u, i));
                    drawHand();
                }, 50);
                setTimeout(() => {
                    document.body.classList.remove('siren');
                    document.getElementById('fail-screen').classList.add('show');
                }, 2000);
            }
        }
    });

    // 시작
    initGame();
    render();
    </script>
</body>
</html>
